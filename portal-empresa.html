<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0D2240;
  --teal:#00A99D;
  --border:rgba(13,34,64,0.12);
  --text2:#4A6080;
  --text3:#8BA0B8;
  --bg:#f5f6f8;
  --accent:#00A99D; /* se sobreescribe por sistema al pintar el resultado */
  --green:#1f9254;
  --amber:#c88a1a;
  --red:#c0392b;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;}
.wrap{width:100%;max-width:480px;}
.wrap.expanded{max-width:880px;}

.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;}
.logo{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:2px;}
.tagline{font-size:12px;color:var(--teal);margin-bottom:24px;font-weight:600;}
h1{font-size:17px;font-weight:600;margin-bottom:6px;}
.sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;}
.field input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:'Inter',sans-serif;outline:none;text-transform:uppercase;}
.field input:focus{border-color:var(--teal);}
.btn{width:100%;padding:12px;background:var(--teal);border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:6px;}
.btn:disabled{opacity:.6;cursor:default;}
.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--border);}
.bad{color:#c0392b;font-weight:600;font-size:13px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.foot{font-size:11px;color:var(--text3);margin-top:22px;text-align:center;}

.result-card{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 8px 32px rgba(13,34,64,0.08);}
.result-head{padding:36px 40px 28px;position:relative;}
.result-head::after{content:'';position:absolute;left:40px;right:40px;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent);}
.result-brand{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px;}
.result-name{font-size:24px;font-weight:800;color:var(--navy);line-height:1.25;margin-bottom:6px;}
.result-course{font-size:17px;font-weight:700;color:var(--accent);line-height:1.35;}

.result-body{padding:30px 40px 36px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px;margin-bottom:28px;}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr);}}
.stat{border-left:3px solid var(--accent);padding-left:12px;}
.stat .k{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.stat .v{font-size:14px;font-weight:600;color:var(--navy);line-height:1.3;}

.section{margin-bottom:26px;}
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.desc{font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-line;}

table.equipo{width:100%;border-collapse:collapse;font-size:13px;}
table.equipo th{text-align:left;padding:10px 10px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;background:var(--bg);}
table.equipo td{padding:10px 10px;border-top:1px solid var(--border);}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.pill.alto{background:rgba(31,146,84,0.12);color:var(--green);}
.pill.medio{background:rgba(200,138,26,0.12);color:var(--amber);}
.pill.bajo{background:rgba(192,57,43,0.12);color:var(--red);}
.pill.curso{background:rgba(13,34,64,0.08);color:var(--text2);}

.folio-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:22px;margin-top:6px;border-top:1px solid var(--border);}
.emit-date{font-size:12px;color:var(--text3);}
.result-foot{background:var(--navy);color:rgba(255,255,255,0.85);padding:16px 40px;text-align:center;font-size:11px;letter-spacing:.02em;}
.retry{text-align:center;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <div class="card" id="searchCard">
    <div class="logo">Grupo Innovaci</div>
    <div class="tagline">Capacitación que impulsa tu crecimiento</div>
    <h1>Portal de seguimiento de capacitación</h1>
    <div class="sub">Ingresa el RFC de tu empresa y el código de acceso que te compartió Academia Innovaci para dar seguimiento al curso que contrataste.</div>

    <div class="field">
      <label>RFC de la empresa</label>
      <input id="fRfc" placeholder="Ej. ABC010101AB1" autocomplete="off">
    </div>
    <div class="field">
      <label>Código de acceso</label>
      <input id="fCodigo" placeholder="Ej. K7M2QX" autocomplete="off">
    </div>
    <button class="btn" id="btnEntrar" onclick="entrar()">Ingresar</button>

    <div id="resultadoError"></div>
    <div class="foot">Grupo Innovaci · os.innovaci.com.mx</div>
  </div>

  <div id="resultadoWrap"></div>

</div>

<script>
// Misma anon key pública que usa toda la app — la seguridad vive en que el
// RFC+código es un dato que solo tiene la empresa, no en ocultar la llave
// (mismo modelo que verificar.html con folio+apellido).
const SURL='https://ydwouspzneacxfixlmmv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd291c3B6bmVhY3hmaXhsbW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzA5MzAsImV4cCI6MjA5NjkwNjkzMH0.uWB1VN2YT7ynTbHmfTWCOBHMRR54LdHJook7iOk7Mug';
const sb=supabase.createClient(SURL,SKEY);

const ACENTOS={NOI:'#fc8104',COI:'#29a2dd',SAE:'#c80000'};
function accentDe(sistema){return ACENTOS[sistema]||'#00A99D';}
function normalizar(s){return (s||'').trim().toUpperCase().replace(/\s+/g,'');}
function fechaLarga(d){
  if(!d) return null;
  const [y,m,day]=d.split('-');
  const meses=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${parseInt(day)} de ${meses[parseInt(m)]} de ${y}`;
}
function periodoTexto(ini,fin){
  if(!ini) return '—';
  if(!fin) return `Desde ${fechaLarga(ini)}`;
  return `${fechaLarga(ini)} — ${fechaLarga(fin)}`;
}
const MODALIDAD_LABEL={en_vivo:'En vivo',['24_7']:'24/7 (a tu ritmo)',in_company:'In company'};
const ACCESO_LABEL={esencial:'Esencial',plus:'Plus',premium:'Premium'};
const TIPO_CONST_LABEL={participacion:'Participación',aprobacion:'Aprobación',acreditacion:'Acreditación'};

// Autocompletar si llega por query params (?rfc=...&codigo=...) desde el
// enlace que Academia le comparte a la empresa.
const params=new URLSearchParams(window.location.search);
if(params.get('rfc')) document.getElementById('fRfc').value=params.get('rfc');
if(params.get('codigo')) document.getElementById('fCodigo').value=params.get('codigo');

let cargando=false;
let ultimoResultado=null;

async function entrar(){
  if(cargando) return;
  const rfc=normalizar(document.getElementById('fRfc').value);
  const codigo=normalizar(document.getElementById('fCodigo').value);
  const btn=document.getElementById('btnEntrar');
  const errDiv=document.getElementById('resultadoError');
  if(!rfc||!codigo){
    errDiv.innerHTML='<div class="bad">Ingresa el RFC y el código de acceso para continuar.</div>';
    return;
  }
  cargando=true; btn.disabled=true; btn.textContent='Ingresando...';
  errDiv.innerHTML='';

  try{
    // Igual que Verifica: el filtro va DENTRO de la consulta (server-side) —
    // si RFC+código no coinciden, Postgres no regresa ninguna fila. Nunca se
    // pide el listado completo para comparar en el navegador.
    const {data,error}=await sb.from('academia_portal_publica')
      .select('*')
      .eq('portal_rfc',rfc)
      .eq('portal_codigo',codigo)
      .order('participante_nombre');

    if(error||!data||!data.length){
      errDiv.innerHTML='<div class="bad">No se encontró ningún curso con ese RFC y código de acceso. Verifica los datos e intenta de nuevo, o contacta a tu asesor de Academia Innovaci.</div>';
      return;
    }
    ultimoResultado=data;
    pintarResultado(data);
  }catch(e){
    errDiv.innerHTML='<div class="bad">Ocurrió un error al ingresar. Intenta de nuevo en unos segundos.</div>';
  }finally{
    cargando=false; btn.disabled=false; btn.textContent='Ingresar';
  }
}

function calificacionDeFila(f){
  // Prioridad: calificación de la constancia ya emitida; si no, la del
  // examen capturado en la ficha; si no hay ninguna, no se puede graficar.
  if(f.constancia_calificacion!=null) return f.constancia_calificacion;
  if(f.examen_calificacion!=null) return f.examen_calificacion;
  return null;
}
function resultadoFila(f,criterioMin){
  if(f.constancia_tipo){
    const cal=f.constancia_calificacion!=null?` · ${f.constancia_calificacion}%`:'';
    return {texto:`✅ ${TIPO_CONST_LABEL[f.constancia_tipo]||'Acreditado'}${cal}`,clase:'alto'};
  }
  if(f.estatus_final==='no_acreditado') return {texto:'No acreditado',clase:'bajo'};
  if(f.estatus_final==='baja') return {texto:'Baja',clase:'bajo'};
  return {texto:'En curso',clase:'curso'};
}

function pintarResultado(filas){
  const g=filas[0];
  const accent=accentDe(g.sistema);
  document.documentElement.style.setProperty('--accent',accent);
  document.getElementById('wrap').classList.add('expanded');
  document.getElementById('searchCard').style.display='none';

  const totalSesiones=g.sesiones_totales||null;
  const totalPracticas=g.practicas_totales||null;
  const criterioMin=g.criterio_acreditacion||'80%';

  const statBlock=(k,v)=>v?`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`:'';

  const filasHtml=filas.map(f=>{
    const asistPct=totalSesiones?Math.round(100*f.sesiones_asistidas/totalSesiones)+'%':'—';
    const elegiblePracticas=(f.nivel_acceso==='plus'||f.nivel_acceso==='premium');
    const pracPct=(elegiblePracticas&&totalPracticas)?Math.round(100*f.practicas_aprobadas/totalPracticas)+'%':'—';
    const res=g.portal_finalizado?resultadoFila(f,criterioMin):null;
    return `<tr>
      <td>${f.participante_nombre}</td>
      <td>${ACCESO_LABEL[f.nivel_acceso]||f.nivel_acceso}</td>
      <td>${totalSesiones?`${f.sesiones_asistidas}/${totalSesiones} (${asistPct})`:'—'}</td>
      <td>${elegiblePracticas?(totalPracticas?`${f.practicas_aprobadas}/${totalPracticas} (${pracPct})`:'—'):'<span style="color:var(--text3);">N/A</span>'}</td>
      ${g.portal_finalizado?`<td><span class="pill ${res.clase}">${res.texto}</span></td>`:''}
    </tr>`;
  }).join('');

  const observaciones=filas.filter(f=>f.practicas_observaciones&&f.practicas_observaciones.trim());

  const html=`
  <div class="result-card">
    <div class="result-head">
      <div class="result-brand">Grupo Innovaci · ${g.sistema_nombre||g.sistema}</div>
      <div class="result-name">${g.cliente_nombre||''}</div>
      <div class="result-course">${g.curso_nombre}</div>
    </div>
    <div class="result-body">
      <div class="grid">
        ${statBlock('Participantes',filas.length)}
        ${statBlock('Modalidad',MODALIDAD_LABEL[g.modalidad]||g.modalidad)}
        ${statBlock('Periodo',periodoTexto(g.generacion_fecha_inicio,g.generacion_fecha_fin))}
        ${statBlock('Duración',g.curso_duracion_horas?`${g.curso_duracion_horas} hrs`:null)}
      </div>

      <div class="section">
        <div class="section-title">${g.portal_finalizado?'Resultados finales del equipo':'Avance del equipo'}</div>
        <div style="overflow-x:auto;">
        <table class="equipo">
          <thead><tr><th>Participante</th><th>Acceso</th><th>Asistencia</th><th>Prácticas</th>${g.portal_finalizado?'<th>Resultado</th>':''}</tr></thead>
          <tbody>${filasHtml}</tbody>
        </table>
        </div>
      </div>

      ${g.portal_finalizado&&observaciones.length?`<div class="section"><div class="section-title">Observaciones de la instructora por participante</div><div class="desc">${observaciones.map(o=>`<div style="margin-bottom:8px;"><strong>${o.participante_nombre}:</strong> ${o.practicas_observaciones}</div>`).join('')}</div></div>`:''}

      ${g.portal_finalizado&&g.portal_texto_analisis?`<div class="section"><div class="section-title">Análisis general del grupo</div><div class="desc">${g.portal_texto_analisis}</div></div>`:''}

      ${g.portal_finalizado&&g.portal_texto_recomendaciones?`<div class="section"><div class="section-title">Recomendaciones estratégicas</div><div class="desc">${g.portal_texto_recomendaciones}</div></div>`:''}

      ${!g.portal_finalizado?`<div class="desc" style="font-style:italic;">El curso todavía está en curso — los resultados finales de acreditación, las observaciones de la instructora y el reporte descargable estarán disponibles aquí cuando termine.</div>`:''}

      <div class="folio-row">
        <div class="emit-date">Generación ${g.generacion}</div>
        ${g.portal_finalizado?`<button class="btn secondary" style="width:auto;padding:10px 20px;" onclick="descargarReporte()">⬇ Descargar reporte</button>`:''}
      </div>
    </div>
    <div class="result-foot">Capacitación práctica, soluciones reales · os.innovaci.com.mx</div>
  </div>
  <div class="retry"><button class="btn secondary" style="width:auto;padding:10px 20px;" onclick="reiniciar()">Salir</button></div>
  `;
  document.getElementById('resultadoWrap').innerHTML=html;
}

function reiniciar(){
  document.getElementById('wrap').classList.remove('expanded');
  document.getElementById('resultadoWrap').innerHTML='';
  document.getElementById('searchCard').style.display='block';
  document.getElementById('resultadoError').innerHTML='';
  ultimoResultado=null;
}

// ── Reporte descargable (PDF) ───────────────────────────────────────────
// Mismo contenido que el reporte que Academia ya entrega a mano (ver
// "Reporte general de capacitación" tipo Fertland): resumen ejecutivo,
// gráfica de resultados individuales, interpretación, análisis y
// recomendaciones de la instructora. Se genera en el navegador con jsPDF —
// no depende de ningún backend.
function descargarReporte(){
  if(!ultimoResultado||!ultimoResultado.length) return;
  const filas=ultimoResultado;
  const g=filas[0];
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'letter'});
  const navy=[13,34,64], teal=[0,169,157], green=[31,146,84], amber=[200,138,26], red=[192,57,43];
  const pageW=doc.internal.pageSize.getWidth();
  let y=20;

  doc.setFillColor(...navy); doc.rect(0,0,pageW,34,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('REPORTE GENERAL DE CAPACITACIÓN',pageW/2,15,{align:'center'});
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text(`${g.curso_nombre}`,pageW/2,23,{align:'center'});
  doc.setFontSize(9);
  doc.text(`${g.cliente_nombre||''} · Generación ${g.generacion}`,pageW/2,30,{align:'center'});
  y=46;

  doc.setTextColor(...navy);
  const criterioNum=parseInt(g.criterio_acreditacion)||80;
  const elegibles=filas.filter(f=>true);
  const conResultado=filas.filter(f=>calificacionDeFila(f)!=null);
  const acreditados=filas.filter(f=>f.constancia_tipo==='acreditacion'||(calificacionDeFila(f)!=null&&calificacionDeFila(f)>=criterioNum));
  const pctAcreditacion=filas.length?Math.round(100*acreditados.length/filas.length):0;

  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.text('01  Resumen ejecutivo',14,y); y+=8;
  const resumen=[
    [String(filas.length),'Participantes'],
    [`${pctAcreditacion}%`,'Nivel de acreditación'],
    [`${criterioNum}%`,'Criterio de acreditación'],
    [g.curso_duracion_horas?`${g.curso_duracion_horas} h`:'—','Duración total'],
  ];
  const colW=(pageW-28)/4;
  resumen.forEach((r,i)=>{
    const x=14+i*colW;
    doc.setFontSize(15); doc.setTextColor(...teal); doc.text(r[0],x,y+6);
    doc.setFontSize(7); doc.setTextColor(...navy); doc.text(r[1].toUpperCase(),x,y+11);
  });
  y+=22;

  doc.setDrawColor(230,230,230); doc.line(14,y,pageW-14,y); y+=10;

  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
  doc.text('02  Resultados individuales',14,y); y+=4;
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(74,96,128);
  doc.text(`Calificación obtenida por cada colaborador frente al criterio mínimo de acreditación (${criterioNum}%).`,14,y+4);
  y+=12;

  const barX=70, barMaxW=pageW-14-barX-20, rowH=9;
  filas.forEach(f=>{
    const cal=calificacionDeFila(f);
    doc.setFontSize(8); doc.setTextColor(...navy); doc.setFont('helvetica','normal');
    const nombreCorto=doc.splitTextToSize(f.participante_nombre,barX-18)[0];
    doc.text(nombreCorto,14,y+4.5);
    if(cal!=null){
      const w=Math.max(2,(cal/100)*barMaxW);
      const color=cal>=criterioNum?green:(cal>=60?amber:red);
      doc.setFillColor(...color);
      doc.roundedRect(barX,y,w,5.5,1,1,'F');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
      doc.text(`${cal}%`,barX+w+3,y+4.2);
    } else {
      doc.setFontSize(8); doc.setTextColor(139,160,184); doc.text('Sin calificación capturada',barX,y+4.2);
    }
    y+=rowH;
    if(y>250){ doc.addPage(); y=20; }
  });
  y+=4;

  if(y>230){ doc.addPage(); y=20; }
  doc.setDrawColor(230,230,230); doc.line(14,y,pageW-14,y); y+=10;
  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
  doc.text('03  Interpretación de desempeño',14,y); y+=7;
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(74,96,128);
  const interp=[
    [`Alto ${criterioNum}% – 100%`,'Dominio adecuado del sistema y capacidad para aplicarlo en entorno real.',green],
    ['Medio 60% – 79%','Conocimiento funcional; requiere reforzamiento práctico para consolidar habilidades.',amber],
    ['Bajo 0% – 59%','Requiere acompañamiento y práctica adicional para lograr una implementación efectiva.',red],
  ];
  interp.forEach(([t,d,c])=>{
    doc.setFillColor(...c); doc.circle(16,y-1,1.3,'F');
    doc.setFont('helvetica','bold'); doc.setTextColor(...navy); doc.text(t,21,y);
    doc.setFont('helvetica','normal'); doc.setTextColor(74,96,128);
    const desc=doc.splitTextToSize(d,pageW-14-21);
    doc.text(desc,21,y+4.5);
    y+=4.5+desc.length*4;
  });
  y+=6;

  const addSeccionTexto=(titulo,texto)=>{
    if(!texto||!texto.trim()) return;
    if(y>240){ doc.addPage(); y=20; }
    doc.setDrawColor(230,230,230); doc.line(14,y,pageW-14,y); y+=10;
    doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
    doc.text(titulo,14,y); y+=7;
    doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(74,96,128);
    const lineas=doc.splitTextToSize(texto,pageW-28);
    doc.text(lineas,14,y);
    y+=lineas.length*4.6+6;
  };
  addSeccionTexto('04  Análisis general del grupo',g.portal_texto_analisis);
  addSeccionTexto('05  Recomendaciones estratégicas',g.portal_texto_recomendaciones);

  const pageCount=doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    const h=doc.internal.pageSize.getHeight();
    doc.setFillColor(...navy); doc.rect(0,h-14,pageW,14,'F');
    doc.setFontSize(8); doc.setTextColor(255,255,255);
    doc.text('Grupo Innovaci · capacitacion@innovaci.com.mx',14,h-6);
    doc.text(`Emitido ${new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'})}`,pageW-14,h-6,{align:'right'});
  }

  const nombreArchivo=`Reporte_${(g.cliente_nombre||'curso').replace(/[^a-z0-9]+/gi,'_')}_${(g.sistema||'')}_${g.generacion}.pdf`;
  doc.save(nombreArchivo);
}

document.getElementById('fCodigo').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
</script>
</body>
</html>
