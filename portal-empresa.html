<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Serif+4:ital@0;1&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0e2233;
  --navy2:#0b3b5c;
  --teal:#12b3a8;
  --teal2:#0e8d85;
  --border:#e7ebee;
  --text2:#5c6b77;
  --text3:#9aa6b0;
  --bg:#eef1f4;
  --accent:#12b3a8; /* se sobreescribe por sistema al pintar el resultado */
  --green:#1f8a5f;
  --greenbg:#e9f8f0;
  --amber:#b4791f;
  --amberbg:#fbf1e2;
  --red:#b4441f;
  --redbg:#fdecea;
}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;max-width:480px;}
.wrap.expanded{max-width:980px;}

.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;box-shadow:0 1px 2px rgba(16,24,32,.04),0 12px 32px -16px rgba(16,24,32,.14);}
.logo-img{height:22px;width:auto;margin-bottom:18px;}
.tagline{font-size:12px;color:var(--teal2);margin-bottom:26px;font-weight:700;letter-spacing:.02em;}
h1{font-size:18px;font-weight:800;margin-bottom:7px;color:var(--navy);}
.sub{font-size:13px;color:var(--text2);margin-bottom:22px;line-height:1.55;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;}
.field input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:'Manrope',sans-serif;outline:none;text-transform:uppercase;}
.field input:focus{border-color:var(--teal);}
.btn{width:100%;padding:13px;background:var(--teal);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;font-family:'Manrope',sans-serif;cursor:pointer;margin-top:6px;}
.btn:disabled{opacity:.6;cursor:default;}
.btn.secondary{background:#fff;color:var(--navy);border:1px solid #d7dde2;}
.btn.dark{background:var(--navy);color:#fff;}
.btn-icon{display:inline-flex;align-items:center;gap:8px;}
.bad{color:var(--red);font-weight:600;font-size:13px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.foot{font-size:11px;color:var(--text3);margin-top:22px;text-align:center;}

.result-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,32,.04),0 12px 32px -16px rgba(16,24,32,.14);}
.result-topbar{height:5px;width:100%;background:linear-gradient(90deg,var(--navy2) 0%,var(--teal) 100%);}
.result-head{padding:40px 44px 32px;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start;}
.result-head-main{display:flex;flex-direction:column;gap:13px;min-width:260px;flex:1 1 380px;}
.result-brand{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.1em;text-transform:uppercase;}
.result-name{font-size:28px;font-weight:800;color:var(--navy);line-height:1.18;}
.result-course{font-size:16px;font-weight:700;color:var(--accent);line-height:1.3;}
.meta-line{font-size:13px;color:var(--text2);display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:2px;}
.meta-line b{color:var(--text3);font-weight:600;}
.result-head-logo{height:26px;width:auto;flex:0 0 auto;margin-top:4px;}

.result-body{padding:0 44px 40px;display:flex;flex-direction:column;gap:22px;}

.resumen{background:var(--navy);border-radius:16px;padding:24px 28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:#fff;}
.resumen-icon{flex:0 0 auto;display:flex;}
.resumen-text{font-size:11px;font-weight:700;letter-spacing:.06em;color:#8fb0c2;text-transform:uppercase;}
.resumen-main{font-size:16px;font-weight:700;margin-top:2px;line-height:1.35;}
.resumen-rings{display:flex;gap:24px;flex-wrap:wrap;margin-left:auto;}
.ring-box{display:flex;flex-direction:column;align-items:center;gap:6px;}
.ring-box .ring-label{font-size:10px;font-weight:700;letter-spacing:.04em;color:#8fb0c2;text-transform:uppercase;}

.analisis-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
@media (max-width:620px){.analisis-grid{grid-template-columns:1fr;}}
.analisis-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px 26px;}
.analisis-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.analisis-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
.desc{font-size:14px;color:#2c3a44;line-height:1.6;white-space:pre-line;font-family:'Source Serif 4',serif;font-style:italic;}

.indiv-bars{display:flex;flex-direction:column;gap:12px;}
.indiv-row{display:flex;align-items:center;gap:14px;}
.indiv-name{width:150px;flex:0 0 150px;font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.indiv-track{flex:1 1 auto;height:10px;background:#eef1f3;border-radius:99px;overflow:hidden;}
.indiv-fill{height:100%;border-radius:99px;}
.indiv-pct{width:46px;flex:0 0 46px;text-align:right;font-size:13px;font-weight:800;color:var(--navy);}

.interp-grid{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.interp-item{display:flex;align-items:flex-start;gap:10px;}
.interp-dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 auto;}
.interp-item b{font-size:13px;color:var(--navy);}
.interp-item span{display:block;font-size:12px;color:var(--text2);line-height:1.5;margin-top:1px;}

.servicios-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
@media (max-width:620px){.servicios-grid{grid-template-columns:1fr;}}
.servicio-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;gap:12px;}
.servicio-nombre{font-size:14px;font-weight:800;color:var(--navy);}
.servicio-precio{font-size:20px;font-weight:800;color:var(--teal2);}
.servicio-precio small{font-size:11px;font-weight:700;color:var(--text3);}
.servicio-list{list-style:none;display:flex;flex-direction:column;gap:6px;}
.servicio-list li{font-size:12px;color:var(--text2);padding-left:14px;position:relative;}
.servicio-list li::before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--teal);}

.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:16px;}
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px 30px;}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 20px;}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr);}}
.stat{border-left:3px solid var(--border);padding-left:13px;}
.stat .k{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.stat .v{font-size:15px;font-weight:700;color:var(--navy);line-height:1.3;}
.periodo-row{margin-top:22px;padding-top:20px;border-top:1px solid #eef1f3;display:flex;align-items:center;gap:12px;font-size:14px;color:#2c3a44;}
.periodo-row b{font-weight:700;}

.equipo{display:flex;flex-direction:column;}
.equipo-row{display:flex;flex-direction:column;gap:10px;padding:18px 0;border-top:1px solid #eef1f3;}
.equipo-row:first-child{border-top:none;padding-top:4px;}
.equipo-top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between;}
.equipo-id{display:flex;align-items:center;gap:13px;min-width:200px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--greenbg,#eaf6f5);color:var(--teal2);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.equipo-nombre{font-size:14px;font-weight:700;color:var(--navy);}
.equipo-nota{display:block;font-size:11px;color:var(--text3);font-weight:500;margin-top:-4px;padding-left:49px;}
.equipo-stats{display:flex;flex-wrap:wrap;gap:24px;align-items:center;padding-left:49px;}
.equipo-stat{text-align:left;min-width:60px;}
.equipo-stat .k{font-size:9px;color:var(--text3);letter-spacing:.03em;font-weight:700;}
.equipo-stat .v{font-size:13px;font-weight:700;color:var(--navy);margin-top:2px;}
.equipo-resultado{text-align:right;min-width:140px;flex:0 0 auto;}
.pill{display:inline-block;padding:5px 12px;border-radius:99px;font-size:11px;font-weight:700;}
.pill.alto{background:var(--greenbg);color:var(--green);}
.pill.bajo{background:var(--redbg);color:var(--red);}
.pill.curso{background:#eef1f3;color:var(--text2);}
.motivo{display:block;font-size:10px;color:var(--text3);font-weight:600;margin-top:4px;}

.folio-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.emit-date{font-size:13px;color:var(--text3);}
.result-foot{background:var(--navy);color:rgba(255,255,255,.72);padding:16px 44px;text-align:center;font-size:11px;letter-spacing:.02em;}
.retry{text-align:center;margin-top:20px;}
</style>
</head>

// El WhatsApp al que se enruta cada solicitud es el del vendedor/asesor
// comercial asignado a esa cuenta en Cartera (columna usuarios.telefono_whatsapp,
// expuesta por la vista academia_portal_publica como vendedor_whatsapp) — no
// un número genérico de la empresa. Si ese vendedor no tiene número
// capturado todavía, se pide a mano en el momento del envío (ver
// solicitarServicio), sin guardarse en ningún lado.
function numeroVentasDe(g){
  return (g&&g.vendedor_whatsapp||'').replace(/[^0-9]/g,'');
}

const ACENTOS={NOI:'#fc8104',COI:'#29a2dd',SAE:'#c80000'};
function accentDe(sistema){return ACENTOS[sistema]||'#12b3a8';}
function normalizar(s){return (s||'').trim().toUpperCase().replace(/\s+/g,'');}
function fechaLarga(d){
  if(!d) return null;
  const [y,m,day]=d.split('-');
  const meses=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${parseInt(day)} de ${meses[parseInt(m)]} de ${y}`;
}
function periodoTexto(ini,fin){
  if(!ini) return '—';
  if(!fin) return `Desde ${fechaLarga(ini)}`;
  return `${fechaLarga(ini)} → ${fechaLarga(fin)}`;
}
function fechaCorta(d){
  if(!d) return null;
  const [y,m,day]=d.split('-');
  return `${day}/${m}/${y}`;
}
function inicialesDe(nombre){
  const partes=(nombre||'').trim().split(/\s+/).filter(Boolean);
  if(!partes.length) return '?';
  return (partes[0][0]+(partes[1]?partes[1][0]:'')).toUpperCase();
}

// Autocompletar si llega por query params (?rfc=...&codigo=...) desde el
// enlace que Academia le comparte a la empresa.
const params=new URLSearchParams(window.location.search);
if(params.get('rfc')) document.getElementById('fRfc').value=params.get('rfc');
if(params.get('codigo')) document.getElementById('fCodigo').value=params.get('codigo');

let cargando=false;
let ultimoResultado=null;

async function entrar(){
  if(cargando) return;
  const rfc=normalizar(document.getElementById('fRfc').value);
  const codigo=normalizar(document.getElementById('fCodigo').value);
  const btn=document.getElementById('btnEntrar');
  const errDiv=document.getElementById('resultadoError');
  if(!rfc||!codigo){
    errDiv.innerHTML='<div class="bad">Ingresa el RFC y el código de acceso para continuar.</div>';
    return;
  }
  cargando=true; btn.disabled=true; btn.textContent='Ingresando...';
  errDiv.innerHTML='';

  try{
    // Igual que Verifica: el filtro va DENTRO de la consulta (server-side) —
    // si RFC+código no coinciden, Postgres no regresa ninguna fila. Nunca se
    // pide el listado completo para comparar en el navegador.
    const {data,error}=await sb.from('academia_portal_publica')
      .select('*')
      .eq('portal_rfc',rfc)
      .eq('portal_codigo',codigo)
      .order('participante_nombre');

    if(error||!data||!data.length){
      errDiv.innerHTML='<div class="bad">No se encontró ningún curso con ese RFC y código de acceso. Verifica los datos e intenta de nuevo, o contacta a tu asesor de Academia Innovaci.</div>';
      return;
    }
    ultimoResultado=data;
    pintarResultado(data);
  }catch(e){
    errDiv.innerHTML='<div class="bad">Ocurrió un error al ingresar. Intenta de nuevo en unos segundos.</div>';
  }finally{
    cargando=false; btn.disabled=false; btn.textContent='Ingresar';
  }
}

function calificacionDeFila(f){
  // Prioridad: calificación de la constancia ya emitida; si no, la del
  // examen capturado en la ficha; si no hay ninguna, no se puede graficar.
  if(f.constancia_calificacion!=null) return f.constancia_calificacion;
  if(f.examen_calificacion!=null) return f.examen_calificacion;
  return null;
}
function resultadoFila(f,criterioMin){
  if(f.constancia_tipo){
    const cal=f.constancia_calificacion!=null?` · ${f.constancia_calificacion}%`:'';
    return {texto:`${TIPO_CONST_LABEL[f.constancia_tipo]||'Acreditado'}${cal}`,clase:'alto',motivo:null};
  }
  if(f.estatus_final==='no_acreditado') return {texto:'No acreditado',clase:'bajo',motivo:f.estatus_final_motivo||null};
  if(f.estatus_final==='baja') return {texto:'Baja',clase:'bajo',motivo:f.estatus_final_motivo||null};
  return {texto:'En curso',clase:'curso',motivo:null};
}
// Clasificación unificada alto/bajo usada en 01 (anillo), 04 (análisis), 05
// (recomendaciones) y 06 (servicios): toma primero el estatus final real
// (constancia emitida, no acreditado, baja) y, si todavía no hay uno
// registrado, cae a la calificación numérica capturada (examen/constancia)
// contra el criterio mínimo — así nadie con una calificación real capturada
// se queda fuera de la cuenta solo porque aún no se marcó su estatus_final
// ni se le emitió constancia. Antes "acreditados"/"bajos" en el texto
// automático se calculaban aparte de "No acreditado"/"Baja" de la tarjeta de
// abajo y podían no coincidir (el caso de la auditoría del 2026-10-15: un
// participante sin calificación numérica pero con estatus_final=no_acreditado
// no se contaba en ningún lado del texto automático).
function clasificarParticipante(f,criterioMin){
  const r=resultadoFila(f,criterioMin);
  if(r.clase!=='curso') return r;
  const cal=calificacionDeFila(f);
  if(cal==null) return r;
  const criterioNum=parseInt(criterioMin)||80;
  return cal>=criterioNum?{texto:`${cal}%`,clase:'alto',motivo:null}:{texto:`${cal}%`,clase:'bajo',motivo:null};
}
function resumenEjecutivoTexto(filas,g){
  const totalSesiones=g.sesiones_totales||null;
  const sesionesImpartidas=g.sesiones_impartidas||0;
  // Base real de asistencia: cuántas sesiones YA se dieron, no el total
  // programado del curso completo — si el curso sigue en marcha, nadie
  // puede llevar el 100% de 11 si solo van 6. Jp (2026-10-05).
  const baseAsistencia=sesionesImpartidas>0?sesionesImpartidas:totalSesiones;
  const n=filas.length;
  const criterioMin=g.criterio_acreditacion||'80%';
  const partes=[`${n} participante${n===1?'':'s'}`];
  if(baseAsistencia){
    const c100=filas.filter(f=>f.sesiones_asistidas>=baseAsistencia).length;
    const sufijo=(sesionesImpartidas>0&&totalSesiones&&sesionesImpartidas<totalSesiones)?` de las ${sesionesImpartidas} sesiones dadas hasta ahora (de ${totalSesiones} programadas)`:'';
    partes.push(`${c100} de ${n} asistieron al 100%${sufijo}`);
  }
  if(g.portal_finalizado){
    // Mismo criterio unificado que el análisis/recomendaciones de abajo
    // (clasificarParticipante) — antes este resumen de arriba usaba solo
    // resultadoFila (constancia emitida), así que podía decir "1 de 6 se
    // acreditó" mientras el análisis decía "3 de 6 alcanzaron el criterio"
    // para el mismo grupo. Jp, visto en el portal de demo, 2026-10-15.
    const acreditados=filas.filter(f=>clasificarParticipante(f,criterioMin).clase==='alto').length;
    partes.push(`${acreditados} de ${n} se ${acreditados===1?'acreditó':'acreditaron'}`);
  }
  return partes.join(' · ');
}

// ── Gráfica de anillo (SVG inline, sin librerías) para el resumen ejecutivo.
function anilloSVG(pct,color,label,val){
  const r=32, c=2*Math.PI*r, p=Math.max(0,Math.min(100,pct));
  const off=c-(c*p/100);
  return `<div class="ring-box">
    <svg width="80" height="80" viewBox="0 0 80 80">
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="7"/>
      <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 40 40)"/>
      <text x="40" y="46" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">${val}</text>
    </svg>
    <div class="ring-label">${label}</div>
  </div>`;
}

// ── 02 Resultados individuales — misma gráfica de barras que el PDF, pero en la página.
function indivBarsHtml(filas,criterioMin,g){
  const criterioNum=parseInt(criterioMin)||80;
  const totalPracticas=g&&g.practicas_totales?g.practicas_totales:null;
  return filas.map(f=>{
    const cal=calificacionDeFila(f);
    if(cal==null){
      // Antes, cualquier participante sin calificación numérica (examen o
      // constancia) se veía igual aquí arriba: "Sin dato" en gris neutro —
      // incluso cuando la tarjeta de abajo ya muestra un estatus final real
      // (No acreditado / Baja). Eso escondía al único caso que de verdad
      // importa para quien solo revisa este resumen. Jp, auditoría 2026-10-15.
      if(f.estatus_final==='no_acreditado'||f.estatus_final==='baja'){
        // El texto de estatus ("No acreditado · 1/11 prácticas") es más
        // largo que el ancho fijo de 46px pensado para un "95%" — se
        // recortaba a la mitad. Se colapsa la barra vacía (flex:0) y se le
        // da todo ese espacio al texto, con wrap en vez de nowrap. Jp,
        // 2026-10-15 (visto en captura real de EURO COMBUSTION).
        const r=resultadoFila(f,criterioMin);
        const elegiblePracticas=(f.nivel_acceso==='plus'||f.nivel_acceso==='premium');
        const pracTxt=(elegiblePracticas&&totalPracticas)?` · ${f.practicas_aprobadas||0}/${totalPracticas} prácticas`:'';
        return `<div class="indiv-row"><div class="indiv-name">${f.participante_nombre}</div><div class="indiv-track" style="flex:0 0 0;"></div><div class="indiv-pct" style="width:auto;flex:1 1 auto;color:var(--red);font-size:11px;font-weight:700;white-space:normal;line-height:1.3;">${r.texto}${pracTxt}</div></div>`;
      }
      return `<div class="indiv-row"><div class="indiv-name">${f.participante_nombre}</div><div class="indiv-track"></div><div class="indiv-pct" style="color:var(--text3);font-size:11px;font-weight:600;">Sin dato</div></div>`;
    }
    const color=cal>=criterioNum?'var(--green)':(cal>=60?'var(--amber)':'var(--red)');
    return `<div class="indiv-row">
      <div class="indiv-name">${f.participante_nombre}</div>
      <div class="indiv-track"><div class="indiv-fill" style="width:${cal}%;background:${color};"></div></div>
      <div class="indiv-pct">${cal}%</div>
    </div>`;
  }).join('');
}

// ── 03 Interpretación de desempeño — mismo criterio Alto/Medio/Bajo que el PDF.
function interpretacionHtml(criterioMin){
  const criterioNum=parseInt(criterioMin)||80;
  const items=[
    ['var(--green)',`Alto · ${criterioNum}% – 100%`,'Dominio adecuado del sistema y capacidad para aplicarlo en entorno real.'],
    ['var(--amber)','Medio · 60% – 79%','Conocimiento funcional; requiere reforzamiento práctico para consolidar habilidades.'],
    ['var(--red)','Bajo · 0% – 59%','Requiere acompañamiento y práctica adicional para lograr una implementación efectiva.'],
  ];
  return items.map(([c,t,d])=>`<div class="interp-item"><div class="interp-dot" style="background:${c};"></div><div><b>${t}</b><span>${d}</span></div></div>`).join('');
}

// ── 04/05 Análisis y recomendaciones: una base se calcula siempre a partir de
// los datos reales del curso (asistencia, prácticas, acreditación); si la
// instructora mandó su propio texto por Telegram, se agrega como complemento
// — nunca lo sustituye, así nunca se pierde su observación puntual.
function analisisAutoTexto(filas,g){
  const n=filas.length;
  if(!n) return '';
  const totalSesiones=g.sesiones_totales||null;
  const sesionesImpartidas=g.sesiones_impartidas||0;
  const baseAsistencia=sesionesImpartidas>0?sesionesImpartidas:totalSesiones;
  const criterioMin=g.criterio_acreditacion||'80%';
  const criterioNum=parseInt(criterioMin)||80;
  const partes=[];
  if(baseAsistencia){
    const c100=filas.filter(f=>f.sesiones_asistidas>=baseAsistencia).length;
    const refSesiones=(sesionesImpartidas>0&&totalSesiones&&sesionesImpartidas<totalSesiones)?`las ${sesionesImpartidas} sesiones dadas hasta ahora`:'las sesiones programadas';
    if(c100===n) partes.push(`El grupo mostró un compromiso sobresaliente con el curso: la totalidad de los participantes (${n} de ${n}) asistió al 100% de ${refSesiones}.`);
    else {
      const asistProm=Math.round(100*filas.reduce((s,f)=>s+(f.sesiones_asistidas/baseAsistencia),0)/n);
      partes.push(`La asistencia promedio del grupo fue de ${asistProm}%, con ${c100} de ${n} participante${n===1?'':'s'} cubriendo el 100% de ${refSesiones}.`);
    }
  }
  if(g.portal_finalizado&&n){
    // Antes esta clasificación solo veía a quien tenía una calificación
    // numérica capturada (examen o constancia); a un participante con
    // estatus_final real (no acreditado / baja) pero sin esa calificación
    // ni se contaba aquí. Usar resultadoFila para los tres casos deja
    // consistente esta cifra con la tarjeta de abajo. Jp, auditoría
    // 2026-10-15.
    const clasificadas=filas.map(f=>clasificarParticipante(f,criterioMin));
    const acreditados=clasificadas.filter(r=>r.clase==='alto').length;
    const bajosFilas=filas.filter((f,i)=>clasificadas[i].clase==='bajo');
    const pct=Math.round(100*acreditados/n);
    if(pct===100) partes.push(`Todos los participantes alcanzaron el criterio de acreditación (${criterioMin}), lo que refleja una comprensión sólida de los temas cubiertos.`);
    else if(pct>=50) partes.push(`${acreditados} de ${n} participantes alcanzaron el criterio de acreditación (${criterioMin}); el resto se beneficiaría de reforzamiento adicional.`);
    else partes.push(`Solo ${acreditados} de ${n} participantes alcanzaron el criterio de acreditación (${criterioMin}), lo que sugiere la necesidad de reforzar los temas del curso.`);
    // Se separa "no acreditado" (sigue en el curso, bajo desempeño) de
    // "baja" (ya no está en el curso) — recomendar "reforzar temas" a
    // alguien que se dio de baja no tiene sentido. Jp, 2026-10-15.
    const bajoDesempeño=bajosFilas.filter(f=>f.estatus_final!=='baja');
    const porBaja=bajosFilas.filter(f=>f.estatus_final==='baja');
    if(bajoDesempeño.length&&bajoDesempeño.length<=3){
      const nombres=bajoDesempeño.map(f=>f.participante_nombre).join(' y ');
      partes.push(`En particular, ${nombres} ${bajoDesempeño.length===1?'no alcanzó':'no alcanzaron'} el criterio y se beneficiaría${bajoDesempeño.length===1?'':'n'} de seguimiento puntual.`);
    }
    if(porBaja.length&&porBaja.length<=3){
      const nombresBaja=porBaja.map(f=>f.participante_nombre).join(' y ');
      partes.push(`${nombresBaja} ${porBaja.length===1?'se dio':'se dieron'} de baja antes de concluir el curso.`);
    }
  }
  const elegiblesPracticas=filas.filter(f=>f.nivel_acceso==='plus'||f.nivel_acceso==='premium');
  if(elegiblesPracticas.length&&g.practicas_totales){
    const pracProm=Math.round(100*elegiblesPracticas.reduce((s,f)=>s+(f.practicas_aprobadas/g.practicas_totales),0)/elegiblesPracticas.length);
    partes.push(`En las prácticas, el grupo con acceso a laboratorio registró un avance promedio del ${pracProm}%.`);
  }
  return partes.join(' ');
}
function recomendacionesAutoTexto(filas,g){
  const criterioMin=g.criterio_acreditacion||'80%';
  // Misma corrección que en analisisAutoTexto: resultadoFila clasifica a
  // TODOS los participantes (con o sin calificación numérica), así que un
  // caso "no acreditado" sin examen/constancia capturado ya no se escapa de
  // esta recomendación. Jp, auditoría 2026-10-15.
  const bajosFilas=g.portal_finalizado?filas.filter(f=>clasificarParticipante(f,criterioMin).clase==='bajo'):[];
  // Igual que en analisisAutoTexto: separar bajo desempeño (sigue en el
  // curso) de baja (ya no está) — la recomendación de "reforzar temas" no
  // aplica a quien se dio de baja. Jp, 2026-10-15.
  const bajoDesempeño=bajosFilas.filter(f=>f.estatus_final!=='baja');
  const porBaja=bajosFilas.filter(f=>f.estatus_final==='baja');
  const totalSesiones=g.sesiones_totales||null;
  const baseAsistencia=(g.sesiones_impartidas||0)>0?g.sesiones_impartidas:totalSesiones;
  const partes=[];
  if(bajoDesempeño.length){
    if(bajoDesempeño.length<=3){
      const nombres=bajoDesempeño.map(f=>f.participante_nombre).join(' y ');
      partes.push(`Se recomienda dar seguimiento puntual a ${nombres}, quien${bajoDesempeño.length===1?'':'es'} ${bajoDesempeño.length===1?'no alcanzó':'no alcanzaron'} el criterio de acreditación, reforzando los temas con mayor dificultad mediante sesiones de práctica adicionales.`);
    } else {
      partes.push(`Se recomienda dar seguimiento puntual a ${bajoDesempeño.length} participantes que no alcanzaron el criterio de acreditación, reforzando los temas con mayor dificultad mediante sesiones de práctica adicionales.`);
    }
  } else if(g.portal_finalizado&&!porBaja.length){
    partes.push('Se recomienda mantener el ritmo de trabajo del grupo y aprovechar el dominio alcanzado aplicando lo aprendido en casos reales de la operación diaria.');
  }
  if(porBaja.length){
    if(porBaja.length<=3){
      const nombresBaja=porBaja.map(f=>f.participante_nombre).join(' y ');
      partes.push(`Se recomienda dar seguimiento con ${nombresBaja} sobre el motivo de su baja del curso, antes de considerar una reinscripción o un curso de reforzamiento.`);
    } else {
      partes.push(`Se recomienda dar seguimiento con ${porBaja.length} participantes que se dieron de baja del curso, antes de considerar una reinscripción o un curso de reforzamiento.`);
    }
  }
  if(baseAsistencia){
    const faltantes=filas.filter(f=>f.sesiones_asistidas<baseAsistencia);
    if(faltantes.length) partes.push(`${faltantes.length===1?'1 participante no completó':faltantes.length+' participantes no completaron'} el 100% de las sesiones; se sugiere programar una sesión de repaso para cubrir los temas no vistos en vivo.`);
  }
  partes.push('Para potenciar el retorno de la inversión en capacitación, se sugiere dar seguimiento al uso del sistema en el día a día y considerar una evaluación de desempeño individual más detallada (ver servicios complementarios).');
  return partes.join(' ');
}
function textoComplementado(auto,instructorTexto){
  if(instructorTexto&&instructorTexto.trim()) return `${auto}\n\n${instructorTexto.trim()}`;
  return auto;
}

function pintarResultado(filas){
  const g=filas[0];
  const accent=accentDe(g.sistema);
  document.documentElement.style.setProperty('--accent',accent);
  document.getElementById('wrap').classList.add('expanded');
  document.getElementById('searchCard').style.display='none';

  const totalSesiones=g.sesiones_totales||null;
  const totalPracticas=g.practicas_totales||null;
  const criterioMin=g.criterio_acreditacion||'80%';
  // Cuántas sesiones YA se dieron (no el total programado del curso
  // completo). Si el curso sigue en marcha, "5/11" sin este dato se lee
  // como que a alguien le faltan 6 sesiones cuando en realidad solo han
  // pasado 6 en total — Jp lo notó revisando GELKLEEN-SEP26 (2026-10-05).
  const sesionesImpartidas=g.sesiones_impartidas||0;
  const baseAsistencia=sesionesImpartidas>0?sesionesImpartidas:totalSesiones;
  const enCurso=sesionesImpartidas>0&&totalSesiones&&sesionesImpartidas<totalSesiones;

  const statBlock=(k,v)=>v?`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`:'';

  const filasHtml=filas.map(f=>{
    const asistPct=baseAsistencia?Math.round(100*f.sesiones_asistidas/baseAsistencia)+'%':'—';
    const faltas=baseAsistencia?Math.max(0,baseAsistencia-f.sesiones_asistidas):null;
    const elegiblePracticas=(f.nivel_acceso==='plus'||f.nivel_acceso==='premium');
    const pracPct=(elegiblePracticas&&totalPracticas)?Math.round(100*f.practicas_aprobadas/totalPracticas)+'%':'—';
    const res=g.portal_finalizado?resultadoFila(f,criterioMin):null;
    const vigenciaPartes=[];
    if(f.fecha_fin_laboratorio) vigenciaPartes.push(`Acceso a laboratorio hasta ${fechaCorta(f.fecha_fin_laboratorio)}`);
    if(f.fecha_fin_sesion_privada) vigenciaPartes.push(`Sesión privada pendiente hasta ${fechaCorta(f.fecha_fin_sesion_privada)}`);
    const vigenciaHtml=vigenciaPartes.length?`<span class="equipo-nota">${vigenciaPartes.join(' · ')}</span>`:'';
    return `<div class="equipo-row">
      <div class="equipo-top">
        <div class="equipo-id">
          <div class="avatar">${inicialesDe(f.participante_nombre)}</div>
          <div class="equipo-nombre">${f.participante_nombre}</div>
        </div>
        ${g.portal_finalizado?`<div class="equipo-resultado"><span class="pill ${res.clase}">${res.texto}</span>${res.motivo?`<span class="motivo">${res.motivo}</span>`:''}</div>`:''}
      </div>
      ${vigenciaHtml}
      <div class="equipo-stats">
        <div class="equipo-stat"><div class="k">ACCESO</div><div class="v">${ACCESO_LABEL[f.nivel_acceso]||f.nivel_acceso}</div></div>
        <div class="equipo-stat"><div class="k">ASISTENCIA</div><div class="v">${baseAsistencia?`${f.sesiones_asistidas}/${baseAsistencia} (${asistPct})`:'—'}</div>${enCurso?`<div style="font-size:9px;color:var(--text3);margin-top:2px;">de ${totalSesiones} programadas</div>`:''}</div>
        ${baseAsistencia?`<div class="equipo-stat"><div class="k">FALTAS</div><div class="v" style="${faltas>0?'color:var(--red);':''}">${faltas}</div></div>`:''}
        <div class="equipo-stat"><div class="k">PRÁCTICAS</div><div class="v">${elegiblePracticas?(totalPracticas?`${f.practicas_aprobadas}/${totalPracticas} (${pracPct})`:'—'):'N/A'}</div></div>
      </div>
    </div>`;
  }).join('');

  const observaciones=filas.filter(f=>f.practicas_observaciones&&f.practicas_observaciones.trim());

  // Anillos del resumen ejecutivo: asistencia promedio del grupo (contra las
  // sesiones ya dadas, no el total del curso) y, cuando ya finalizó, % de
  // acreditación — mismos datos que ya resume el texto, nomás en gráfica.
  const asistPromGrupo=baseAsistencia?Math.round(100*filas.reduce((s,f)=>s+f.sesiones_asistidas,0)/(baseAsistencia*filas.length)):null;
  // Mismo criterio unificado que el resto del portal (clasificarParticipante)
  // — ver nota en resumenEjecutivoTexto. Jp, 2026-10-15.
  const acreditadosGrupo=g.portal_finalizado?filas.filter(f=>clasificarParticipante(f,criterioMin).clase==='alto').length:null;
  const pctAcreditacionGrupo=(g.portal_finalizado&&filas.length)?Math.round(100*acreditadosGrupo/filas.length):null;
  const ringsHtml=`<div class="resumen-rings">
    ${asistPromGrupo!=null?anilloSVG(asistPromGrupo,'#5fd9cf','Asistencia',asistPromGrupo+'%'):''}
    ${pctAcreditacionGrupo!=null?anilloSVG(pctAcreditacionGrupo,'#9fe8a0','Acreditación',pctAcreditacionGrupo+'%'):''}

  // 02/03 del PDF (resultados individuales + interpretación), ahora también

  const resultadosIndivHtml=g.portal_finalizado?`

  const analisisTexto=g.portal_finalizado?textoComplementado(analisisAutoTexto(filas,g),g.portal_texto_analisis):null;
  const recomendacionesTexto=g.portal_finalizado?textoComplementado(recomendacionesAutoTexto(filas,g),g.portal_texto_recomendaciones):null;

  // 06: servicios complementarios de pago — mismo contenido y precios que ya

  // Excluye a quien se dio de baja: estos servicios (práctica, desempeño)

  const bajosServicio=g.portal_finalizado?filas.filter(f=>clasificarParticipante(f,criterioMin).clase==='bajo'&&f.estatus_final!=='baja'):[];
  const sugerenciaServicioHtml=(bajosServicio.length&&bajosServicio.length<=3)?`<div class="desc" style="margin-bottom:14px;">Con base en los resultados de este grupo, estos servicios aplicarían especialmente para <b>${bajosServicio.map(f=>f.participante_nombre).join(' y ')}</b>, quien${bajosServicio.length===1?'':'es'} ${bajosServicio.length===1?'no alcanzó':'no alcanzaron'} el criterio de acreditación.</div>`:'';
  const serviciosHtml=g.portal_finalizado?`
      <div class="panel">
        <div class="section-title">Servicios complementarios disponibles</div>
        ${sugerenciaServicioHtml}
        <div class="servicios-grid">
          <div class="servicio-card">
            <div class="servicio-nombre">Informe detallado de prácticas</div>
            <div class="servicio-precio">$400 <small>+IVA por participante</small></div>
            <ul class="servicio-list">
              <li>Evaluación por ejercicio</li>
              <li>Retroalimentación técnica específica</li>
            </ul>
            <button class="btn secondary btn-icon" style="width:auto;padding:10px 18px;align-self:flex-start;" onclick="solicitarServicio('Informe detallado de prácticas')">${ICONS.informe} Solicitar</button>
          </div>
          <div class="servicio-card">
            <div class="servicio-nombre">Reporte de desempeño individual — nivel consultivo</div>
            <div class="servicio-precio">$900 <small>+IVA por participante</small></div>
            <ul class="servicio-list">
              <li>Evaluación cualitativa del participante</li>
              <li>Observaciones del instructor</li>
              <li>Nivel de participación</li>
              <li>Áreas de mejora específicas</li>
            </ul>
            <button class="btn secondary btn-icon" style="width:auto;padding:10px 18px;align-self:flex-start;" onclick="solicitarServicio('Reporte de desempeño individual — nivel consultivo')">${ICONS.informe} Solicitar</button>
          </div>
        </div>
      </div>`:'';

  const metaPartes=[];
  if(g.vendedor_nombre) metaPartes.push(`<span><b>Asesor comercial</b> ${g.vendedor_nombre}</span>`);
  if(g.instructor_nombre) metaPartes.push(`<span><b>Instructor(a)</b> ${g.instructor_nombre}${g.instructor_cargo?' — '+g.instructor_cargo:''}</span>`);
  const metaHtml=metaPartes.length?`<div class="meta-line">${metaPartes.join('')}</div>`:'';

  const html=`
  <div class="result-card">
    <div class="result-topbar"></div>
    <div class="result-head">
      <div class="result-head-main">
        <div class="result-brand">Academia · Portal de seguimiento</div>
        <div class="result-name">${g.cliente_nombre||''}</div>
        <div class="result-course">${g.curso_nombre}</div>
        ${metaHtml}
      </div>
      <img class="result-head-logo" src="data:image/png;base64,${LOGO_B64}" alt="Grupo Innovaci">
    </div>
    <div class="result-body">

      <div class="resumen">
        <div class="resumen-icon">${ICONS.check}</div>
        <div>
          <div class="resumen-text">Resultado general del grupo</div>
          <div class="resumen-main">${resumenEjecutivoTexto(filas,g)}</div>
        </div>
        ${ringsHtml}
      </div>

      ${resultadosIndivHtml}

      <div class="panel">
        <div class="section-title">Qué incluye este curso</div>
        <div class="grid">
          ${statBlock('Modalidad',MODALIDAD_LABEL[g.modalidad]||g.modalidad)}
          ${statBlock('Duración',g.curso_duracion_horas?`${g.curso_duracion_horas} hrs`:null)}
          ${statBlock('Sesiones',totalSesiones?`${totalSesiones}`:null)}
          ${statBlock('Prácticas',totalPracticas?`${totalPracticas}`:null)}
        </div>
        <div class="periodo-row">
          ${ICONS.calendario}
          <div><b>Periodo del curso:</b> ${periodoTexto(g.generacion_fecha_inicio,g.generacion_fecha_fin)}</div>
        </div>
      </div>

      <div class="panel">
        <div class="section-title">${g.portal_finalizado?'Resultados finales del equipo':'Avance del equipo'}</div>
        <div class="equipo">${filasHtml}</div>
      </div>

      ${g.portal_finalizado&&observaciones.length?`<div class="panel"><div class="section-title">Observaciones de la instructora por participante</div><div class="desc" style="font-style:normal;font-family:'Manrope',sans-serif;">${observaciones.map(o=>`<div style="margin-bottom:8px;"><b>${o.participante_nombre}:</b> ${o.practicas_observaciones}</div>`).join('')}</div></div>`:''}

      ${analisisTexto||recomendacionesTexto?`
      <div class="analisis-grid">
        ${analisisTexto?`<div class="analisis-card"><div class="analisis-head" style="color:var(--navy2);">${ICONS.analisis}<div class="analisis-title">Análisis general del grupo</div></div><div class="desc">${analisisTexto}</div></div>`:''}
        ${recomendacionesTexto?`<div class="analisis-card"><div class="analisis-head" style="color:var(--teal2);">${ICONS.recomendacion}<div class="analisis-title">Recomendaciones estratégicas</div></div><div class="desc">${recomendacionesTexto}</div></div>`:''}
      </div>`:''}

      ${serviciosHtml}

      ${!g.portal_finalizado?`<div class="desc">El curso todavía está en curso — los resultados finales de acreditación, las observaciones de la instructora y el reporte descargable estarán disponibles aquí cuando termine.</div>`:''}

      <div class="folio-row">
        <div class="emit-date">Generación ${g.generacion}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn secondary btn-icon" style="width:auto;padding:12px 20px;" onclick="solicitarServicio('Informe detallado de prácticas')">${ICONS.informe} Solicitar informe detallado</button>
          ${g.portal_finalizado?`<button class="btn dark btn-icon" style="width:auto;padding:12px 22px;" onclick="descargarReporte()">${ICONS.descargar} Descargar reporte</button>`:''}
        </div>
      </div>
    </div>
    <div class="result-foot">Capacitación práctica, soluciones reales · os.innovaci.com.mx</div>
  </div>
  <div class="retry"><button class="btn secondary" style="width:auto;padding:10px 20px;" onclick="reiniciar()">Salir</button></div>
  `;
  document.getElementById('resultadoWrap').innerHTML=html;
}

function reiniciar(){
  document.getElementById('wrap').classList.remove('expanded');
  document.getElementById('resultadoWrap').innerHTML='';
  document.getElementById('searchCard').style.display='block';
  document.getElementById('resultadoError').innerHTML='';
  ultimoResultado=null;
}

// ── Solicitar un servicio (lead a Ventas) ───────────────────────────────
// Este botón NO genera ningún reporte: solo abre WhatsApp, YA enrutado al
// vendedor/asesor comercial asignado a esta cuenta en Cartera, con un
// mensaje pre-armado pidiendo el servicio indicado. Es un lead para que
// Ventas lo atienda y genere/envíe el reporte a mano — igual que "Enviar
// acceso por WhatsApp" de index.html es un envío manual.
function solicitarServicio(servicioNombre){
  if(!ultimoResultado||!ultimoResultado.length) return;
  const g=ultimoResultado[0];
  let numero=numeroVentasDe(g);
  if(!numero){
    // Esta cuenta no tiene todavía un vendedor con WhatsApp capturado en
    // Cartera — se pide a mano en el momento del envío, sin guardarse en
    // ningún lado (mismo criterio que index.html cuando falta un teléfono).
    numero=(prompt(`Falta un WhatsApp de ventas asignado a esta cuenta. Captúralo para este envío (no se guarda en ningún lado):`)||'').replace(/[^0-9]/g,'');
    if(!numero) return;
    if(numero.length===10) numero='52'+numero;
  }
  const msg=`Hola, somos de *${g.cliente_nombre||'la empresa'}*. Quisiéramos solicitar *${servicioNombre}* para el curso *${g.curso_nombre}* (Generación ${g.generacion}). Gracias.`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(msg)}`,'_blank');
}

// ── Reporte descargable (PDF) ───────────────────────────────────────────
// Mismo contenido que el reporte que Academia ya entrega a mano (ver
// "Reporte general de capacitación" tipo Fertland): resumen ejecutivo,
// gráfica de resultados individuales, interpretación, análisis y
// recomendaciones de la instructora. Se genera en el navegador con jsPDF —
// no depende de ningún backend.
function descargarReporte(){
  if(!ultimoResultado||!ultimoResultado.length) return;
  const filas=ultimoResultado;
  const g=filas[0];
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'letter'});
  const navy=[14,34,51], teal=[18,179,168], green=[31,138,95], amber=[180,121,31], red=[180,68,31];
  const pageW=doc.internal.pageSize.getWidth();
  let y=20;

  doc.setFillColor(...navy); doc.rect(0,0,pageW,34,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('REPORTE GENERAL DE CAPACITACIÓN',pageW/2,15,{align:'center'});
  doc.setFontSize(11); doc.setFont('helvetica','normal');
  doc.text(`${g.curso_nombre}`,pageW/2,23,{align:'center'});
  doc.setFontSize(9);
  doc.text(`${g.cliente_nombre||''} · Generación ${g.generacion}`,pageW/2,30,{align:'center'});
  y=46;

  doc.setTextColor(...navy);
  const criterioNum=parseInt(g.criterio_acreditacion)||80;
  const elegibles=filas.filter(f=>true);
  const conResultado=filas.filter(f=>calificacionDeFila(f)!=null);
  const acreditados=filas.filter(f=>f.constancia_tipo==='acreditacion'||(calificacionDeFila(f)!=null&&calificacionDeFila(f)>=criterioNum));
  const pctAcreditacion=filas.length?Math.round(100*acreditados.length/filas.length):0;

  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.text('01  Resumen ejecutivo',14,y); y+=8;
  const resumen=[
    [String(filas.length),'Participantes'],
    [`${pctAcreditacion}%`,'Nivel de acreditación'],
    [`${criterioNum}%`,'Criterio de acreditación'],
    [g.curso_duracion_horas?`${g.curso_duracion_horas} h`:'—','Duración total'],
  ];
  const colW=(pageW-28)/4;
  resumen.forEach((r,i)=>{
    const x=14+i*colW;
    doc.setFontSize(15); doc.setTextColor(...teal); doc.text(r[0],x,y+6);
    doc.setFontSize(7); doc.setTextColor(...navy); doc.text(r[1].toUpperCase(),x,y+11);
  });
  y+=22;

  doc.setDrawColor(230,230,230); doc.line(14,y,pageW-14,y); y+=10;

  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
  doc.text('02  Resultados individuales',14,y); y+=4;
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(92,107,119);
  doc.text(`Calificación obtenida por cada colaborador frente al criterio mínimo de acreditación (${criterioNum}%).`,14,y+4);
  y+=12;

  const barX=70, barMaxW=pageW-14-barX-20, rowH=9;
  filas.forEach(f=>{
    const cal=calificacionDeFila(f);
    doc.setFontSize(8); doc.setTextColor(...navy); doc.setFont('helvetica','normal');
    const nombreCorto=doc.splitTextToSize(f.participante_nombre,barX-18)[0];
    doc.text(nombreCorto,14,y+4.5);
    if(cal!=null){
      const w=Math.max(2,(cal/100)*barMaxW);
      const color=cal>=criterioNum?green:(cal>=60?amber:red);
      doc.setFillColor(...color);
      doc.roundedRect(barX,y,w,5.5,1,1,'F');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
      doc.text(`${cal}%`,barX+w+3,y+4.2);
    } else if(f.estatus_final==='no_acreditado'||f.estatus_final==='baja'){
      // Mismo criterio que en la página: si ya hay un estatus final real,
      // no se muestra como "sin dato" aunque no exista una calificación
      // numérica capturada. Jp, auditoría 2026-10-15.
      const r=resultadoFila(f,String(criterioNum)+'%');
      doc.setFontSize(8); doc.setFont('helvetica','bold'); doc.setTextColor(...red);
      doc.text(r.texto,barX,y+4.2);
    } else {
      doc.setFontSize(8); doc.setTextColor(154,166,176); doc.text('Sin calificación capturada',barX,y+4.2);
    }
    y+=rowH;
    if(y>250){ doc.addPage(); y=20; }
  });
  y+=4;

  if(y>230){ doc.addPage(); y=20; }
  doc.setDrawColor(230,230,230); doc.line(14,y,pageW-14,y); y+=10;
  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
  doc.text('03  Interpretación de desempeño',14,y); y+=7;
  doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(92,107,119);
  const interp=[
    [`Alto ${criterioNum}% – 100%`,'Dominio adecuado del sistema y capacidad para aplicarlo en entorno real.',green],
    ['Medio 60% – 79%','Conocimiento funcional; requiere reforzamiento práctico para consolidar habilidades.',amber],
    ['Bajo 0% – 59%','Requiere acompañamiento y práctica adicional para lograr una implementación efectiva.',red],
  ];
  interp.forEach(([t,d,c])=>{
    doc.setFillColor(...c); doc.circle(16,y-1,1.3,'F');
    doc.setFont('helvetica','bold'); doc.setTextColor(...navy); doc.text(t,21,y);
    doc.setFont('helvetica','normal'); doc.setTextColor(92,107,119);
    const desc=doc.splitTextToSize(d,pageW-14-21);
    doc.text(desc,21,y+4.5);
    y+=4.5+desc.length*4;
  });
  y+=6;

  const addSeccionTexto=(titulo,texto)=>{
    if(!texto||!texto.trim()) return;
    if(y>240){ doc.addPage(); y=20; }
    doc.setDrawColor(230,230,230); doc.line(14,y,pageW-14,y); y+=10;
    doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
    doc.text(titulo,14,y); y+=7;
    doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.setTextColor(92,107,119);
    const lineas=doc.splitTextToSize(texto,pageW-28);
    doc.text(lineas,14,y);
    y+=lineas.length*4.6+6;
  };
  addSeccionTexto('04  Análisis general del grupo',analisisAutoTexto(filas,g)+((g.portal_texto_analisis&&g.portal_texto_analisis.trim())?'\n\n'+g.portal_texto_analisis.trim():''));
  addSeccionTexto('05  Recomendaciones estratégicas',recomendacionesAutoTexto(filas,g)+((g.portal_texto_recomendaciones&&g.portal_texto_recomendaciones.trim())?'\n\n'+g.portal_texto_recomendaciones.trim():''));

  // 06 Servicios complementarios disponibles — mismos dos servicios y
  // precios que ya se ofrecen desde la página.
  if(y>215){ doc.addPage(); y=20; }
  doc.setDrawColor(230,230,230); doc.line(14,y,pageW-14,y); y+=10;
  doc.setFontSize(10); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
  doc.text('06  Servicios complementarios disponibles',14,y); y+=8;
  {
    // Misma sugerencia contextual que en la página: si hay 1-3 personas en
    // riesgo, se nombran aquí en vez de ofrecer los servicios de forma
    // genérica. Jp, auditoría 2026-10-15.
    const criterioMin06=g.criterio_acreditacion||'80%';
    const bajosServicioPdf=filas.filter(f=>clasificarParticipante(f,criterioMin06).clase==='bajo'&&f.estatus_final!=='baja');
    if(bajosServicioPdf.length&&bajosServicioPdf.length<=3){
      doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(92,107,119);
      const nombresPdf=bajosServicioPdf.map(f=>f.participante_nombre).join(' y ');
      const txtPdf=`Con base en los resultados de este grupo, estos servicios aplicarían especialmente para ${nombresPdf}, quien${bajosServicioPdf.length===1?'':'es'} ${bajosServicioPdf.length===1?'no alcanzó':'no alcanzaron'} el criterio de acreditación.`;
      const lineasPdf=doc.splitTextToSize(txtPdf,pageW-28);
      doc.text(lineasPdf,14,y); y+=lineasPdf.length*4.2+6;
    }
  }
  const servicios=[
    ['Informe detallado de prácticas','$400 +IVA por participante',['Evaluación por ejercicio','Retroalimentación técnica específica']],
    ['Reporte de desempeño individual — nivel consultivo','$900 +IVA por participante',['Evaluación cualitativa del participante','Observaciones del instructor','Nivel de participación','Áreas de mejora específicas']],
  ];
  const servColW=(pageW-28-10)/2;
  const servColX=[14,14+servColW+10];
  let servMaxY=y;
  servicios.forEach((srv,i)=>{
    const x=servColX[i]; let sy=y;
    doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
    const nombreLineas=doc.splitTextToSize(srv[0],servColW);
    doc.text(nombreLineas,x,sy); sy+=nombreLineas.length*4.6+2;
    doc.setFontSize(10); doc.setTextColor(...teal); doc.text(srv[1],x,sy); sy+=7;
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(92,107,119);
    srv[2].forEach(item=>{
      doc.text('•',x,sy); doc.text(doc.splitTextToSize(item,servColW-6),x+4,sy); sy+=5.5;
    });
    if(sy>servMaxY) servMaxY=sy;
  });
  y=servMaxY+4;

  // Firma de quien impartió el curso — pendiente desde el Lote 26 (el
  // reporte de muestra la incluía); ya existe el dato vía
  // firmante_instructor_id (Lote 28), solo faltaba usarlo aquí. Jp,
  // 2026-10-15. Segunda ronda (mismo día): Jp pidió la imagen real de la
  // firma, no solo el nombre en texto — se reutiliza ACADEMIA_FIRMAS_IMG,
  // el mismo catálogo que ya usa index.html para las constancias (clave =
  // nombre exacto del firmante). Si el instructor no tiene firma cargada
  // ahí, se degrada a solo línea + nombre + cargo, igual que antes.
  if(g.instructor_nombre){
    if(y>235){ doc.addPage(); y=20; } else { y+=10; }
    const firmaImg=ACADEMIA_FIRMAS_IMG[g.instructor_nombre];
    const firmaH=13, firmaW=firmaImg?firmaH*firmaImg.w/firmaImg.h:0;
    const firmaLineY=y+(firmaImg?firmaH+2:0);
    if(firmaImg) doc.addImage(firmaImg.url,'PNG',14,firmaLineY-firmaH-1,firmaW,firmaH);
    doc.setDrawColor(200,200,200); doc.line(14,firmaLineY,74,firmaLineY);
    let fy=firmaLineY+5;
    doc.setFontSize(9); doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
    doc.text(g.instructor_nombre,14,fy); fy+=4.5;
    doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.setTextColor(92,107,119);
    doc.text(g.instructor_cargo||'Instructor(a)',14,fy);
  }

  const pageCount=doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    const h=doc.internal.pageSize.getHeight();
    doc.setFillColor(...navy); doc.rect(0,h-14,pageW,14,'F');
    doc.setFontSize(8); doc.setTextColor(255,255,255);
    doc.text('Grupo Innovaci · capacitacion@innovaci.com.mx',14,h-6);
    doc.text(`Emitido ${new Date().toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'})}`,pageW-14,h-6,{align:'right'});
  }

  const nombreArchivo=`Reporte_${(g.cliente_nombre||'curso').replace(/[^a-z0-9]+/gi,'_')}_${(g.sistema||'')}_${g.generacion}.pdf`;
  doc.save(nombreArchivo);
}

document.getElementById('fCodigo').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});
</script>
