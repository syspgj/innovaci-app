<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovaci OS · Marketing</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Marketing en su propio HTML para no sobrecargar index.html (Jp, 2026-11-22).
   Mismo lenguaje visual que la app principal; comparte la sesión de Supabase. */
:root{
  --navy:#0D2240;--navy2:#132C52;--teal:#00A99D;--teal-d:#00877E;--teal-bg:rgba(0,169,157,0.1);--teal-b:rgba(0,169,157,0.25);
  --gold:#F5A623;--gold-bg:rgba(245,166,35,0.1);--gold-b:rgba(245,166,35,0.25);
  --purple:#6B3FA0;--purple-bg:#f1ecfa;
  --red:#E84040;--red-bg:rgba(232,64,64,0.08);--red-b:rgba(232,64,64,0.25);--green:#27AE60;--green-bg:rgba(39,174,96,0.1);
  --bg:#EEF2F7;--surface:#fff;--surf2:#F7FAFC;
  --text:#0D2240;--text2:#4A6080;--text3:#8BA0B8;
  --border:rgba(13,34,64,0.08);--rad:16px;--radsm:10px;--radpill:999px;
  --shadow-sm:0 1px 2px rgba(13,34,64,0.05),0 1px 3px rgba(13,34,64,0.06);
  --shadow-md:0 2px 6px rgba(13,34,64,0.06),0 8px 24px rgba(13,34,64,0.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,Arial,sans-serif;font-size:14px;}
a{color:var(--teal);}
.topbar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;}
.topbar .brand small{font-weight:500;color:rgba(255,255,255,.6);font-size:12px;}
.topbar .right{display:flex;align-items:center;gap:10px;font-size:12px;}
.topbar a.app{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;font-weight:600;}
.topbar .av{width:30px;height:30px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 70px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);box-shadow:var(--shadow-sm);}
.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--radsm);padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn.ghost{background:#fff;color:var(--text2);border:1px solid var(--border);font-weight:600;}
.btn.navy{background:var(--navy);}
.btn.purple{background:var(--purple);}
.btn.sm{padding:5px 11px;font-size:11.5px;border-radius:8px;}
.inp{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radsm);font-size:13px;font-family:inherit;color:var(--text);box-sizing:border-box;background:#fff;}
textarea.inp{min-height:62px;resize:vertical;}
label.fld{display:block;margin-bottom:10px;}
label.fld>span{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:600;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:var(--radpill);padding:2px 9px;}
.loading{display:flex;align-items:center;gap:10px;color:var(--text3);padding:40px;justify-content:center;}
.spinner{width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal .box{background:#fff;border-radius:var(--rad);max-width:620px;width:100%;max-height:92vh;overflow-y:auto;padding:22px 24px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}
.muted{color:var(--text3);font-size:12px;}
.center{text-align:center;padding:50px 20px;color:var(--text3);}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;z-index:2000;box-shadow:var(--shadow-md);}
.tcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
.trow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--border);}
.trow:first-child{border-top:none;}
.fasehead{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px;}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">📣 Innovaci OS <small>· Marketing</small></div>
  <div class="right" id="topRight"></div>
</div>
<div class="wrap" id="root">
  <div class="loading"><div class="spinner"></div> Cargando…</div>
</div>

<script>
const SURL='https://ydwouspzneacxfixlmmv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd291c3B6bmVhY3hmaXhsbW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzA5MzAsImV4cCI6MjA5NjkwNjkzMH0.uWB1VN2YT7ynTbHmfTWCOBHMRR54LdHJook7iOk7Mug';
const sb=supabase.createClient(SURL,SKEY);
const ROLES_MKT=['director','marketing'];

let userProfile=null, _campanas=[], _tareas=[], _usuarios=[], _vista='lista', _sel=null;

// ─── Helpers ──────────────────────────────────────────────────────────────
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hoyISO(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});}
function addDays(iso,n){ if(!iso) return null; const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function diasDesdeHoy(iso){ if(!iso) return null; return Math.round((new Date(iso+'T12:00:00')-new Date(hoyISO()+'T12:00:00'))/86400000); }
const MESES3=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fFecha(iso){ if(!iso) return 'sin fecha'; const p=String(iso).slice(0,10).split('-'); return (+p[2])+' '+MESES3[+p[1]]; }
function fmtMoney(n){ return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0}); }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function modal(html){ cerrar(); const m=document.createElement('div'); m.className='modal'; m.id='mktModal'; m.onclick=e=>{if(e.target===m)cerrar();}; m.innerHTML='<div class="box">'+html+'</div>'; document.body.appendChild(m); }
function cerrar(){ const m=document.getElementById('mktModal'); if(m)m.remove(); }

// ─── Catálogos ────────────────────────────────────────────────────────────
const MKT_TIPOS=[['black_friday','Black Friday'],['buen_fin','Buen Fin'],['aguinaldo','Aguinaldo'],['masterclass','Masterclass'],['lanzamiento_taller','Lanzamiento de taller'],['promocion','Promoción'],['otro','Otro']];
const TIPO_LBL=Object.fromEntries(MKT_TIPOS);
const FASES=[['preventa','Preventa','#6B3FA0'],['campana','Campaña','#00A99D'],['ultimos_dias','Últimos días','#F5A623'],['cierre','Cierre','#E84040'],['post','Cierre / Post','#4A6080']];
const FASE_LBL=Object.fromEntries(FASES.map(f=>[f[0],f[1]]));
const FASE_COL=Object.fromEntries(FASES.map(f=>[f[0],f[2]]));
const FASE_ORDEN=FASES.map(f=>f[0]);
const TT=[['creativo','🎨 Creativo'],['cambio_creativo','🔁 Cambiar creativo'],['cerrar_inscripcion','🔒 Cierre inscripciones'],['precio_tienda','🛒 Precios en tienda'],['grabar_video','🎬 Grabar video'],['aviso_ventas','📣 Aviso a Ventas'],['publicacion','📱 Publicación'],['otro','📌 Tarea']];
const TT_LBL=Object.fromEntries(TT);

// Playbooks: ref 'inicio'|'fin', d = días de desfase (negativo = antes), rol responsable sugerido
const PB_PROMO=[
  {t:'Confirmar / armar creativos de la promoción', tt:'creativo', f:'preventa', ref:'inicio', d:-3, rol:'marketing'},
  {t:'Grabar video promocional (si aplica)', tt:'grabar_video', f:'preventa', ref:'inicio', d:-3, rol:'academia'},
  {t:'Subir precios / descuentos en la tienda', tt:'precio_tienda', f:'campana', ref:'inicio', d:0, rol:'marketing'},
  {t:'Avisar a Ventas las promociones vigentes', tt:'aviso_ventas', f:'campana', ref:'inicio', d:0, rol:'marketing'},
  {t:'Publicar el arranque de la campaña', tt:'publicacion', f:'campana', ref:'inicio', d:0, rol:'marketing'},
  {t:'Recordatorio a media campaña', tt:'publicacion', f:'campana', ref:'inicio', d:3, rol:'marketing'},
  {t:'Cambiar a creativos de "últimos días"', tt:'cambio_creativo', f:'ultimos_dias', ref:'fin', d:-2, rol:'marketing'},
  {t:'Publicar "última oportunidad / cierre"', tt:'cierre', f:'cierre', ref:'fin', d:0, rol:'marketing'},
  {t:'Regresar precios normales en la tienda', tt:'precio_tienda', f:'post', ref:'fin', d:1, rol:'marketing'},
  {t:'Avisar a Ventas que terminó la promoción', tt:'aviso_ventas', f:'post', ref:'fin', d:1, rol:'marketing'},
];
const PB_EVENTO=[
  {t:'Grabar video del taller / curso (Karen)', tt:'grabar_video', f:'preventa', ref:'inicio', d:-5, rol:'academia'},
  {t:'Creativos de preventa', tt:'creativo', f:'preventa', ref:'inicio', d:-4, rol:'marketing'},
  {t:'Abrir inscripciones / publicar', tt:'publicacion', f:'campana', ref:'inicio', d:0, rol:'marketing'},
  {t:'Avisar a Ventas el evento y su promoción', tt:'aviso_ventas', f:'campana', ref:'inicio', d:0, rol:'marketing'},
  {t:'Recordatorio: inscripciones abiertas', tt:'publicacion', f:'campana', ref:'fin', d:-3, rol:'marketing'},
  {t:'Creativo de "cierre de inscripciones"', tt:'cerrar_inscripcion', f:'cierre', ref:'fin', d:-1, rol:'marketing'},
  {t:'Cerrar inscripciones', tt:'cerrar_inscripcion', f:'cierre', ref:'fin', d:0, rol:'marketing'},
];
const PLAYBOOKS={black_friday:PB_PROMO, buen_fin:PB_PROMO, promocion:PB_PROMO, aguinaldo:PB_EVENTO, masterclass:PB_EVENTO, lanzamiento_taller:PB_EVENTO, otro:[{t:'Planear la campaña (fechas, objetivo, creativos)', tt:'otro', f:'preventa', ref:'inicio', d:0, rol:'marketing'}]};

function usuarioPorRol(rol){ const u=_usuarios.find(x=>x.rol===rol&&x.activo!==false); return u?u.id:null; }
function nombreUsuario(id){ const u=_usuarios.find(x=>x.id===id); return u?u.nombre:'— sin asignar —'; }

// ─── Arranque ─────────────────────────────────────────────────────────────
async function arrancar(){
  const root=document.getElementById('root');
  const {data:sessData}=await sb.auth.getSession();
  if(!sessData||!sessData.session){
    root.innerHTML=`<div class="center card" style="padding:50px 24px;"><div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px;">Inicia sesión primero</div><div class="muted" style="margin-bottom:16px;">Entra en la app principal y desde ahí se abre Marketing.</div><a class="btn" href="/" style="text-decoration:none;display:inline-block;">Ir a la app principal</a></div>`;
    return;
  }
  const uid=sessData.session.user.id;
  const {data:prof}=await sb.from('usuarios').select('*').eq('id',uid).maybeSingle();
  if(!prof){ root.innerHTML='<div class="center">No encontré tu perfil. Avisa a Dirección.</div>'; return; }
  userProfile=prof;
  if(!ROLES_MKT.includes(prof.rol)){
    root.innerHTML=`<div class="center card" style="padding:50px 24px;"><div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px;">Esta área es de Marketing</div><div class="muted" style="margin-bottom:16px;">Tu usuario (${esc(prof.rol)}) no tiene acceso. Si crees que debería, avisa a Dirección.</div><a class="btn ghost" href="/" style="text-decoration:none;display:inline-block;">Volver a la app</a></div>`;
    return;
  }
  document.getElementById('topRight').innerHTML=`<a class="app" href="/">← App principal</a><span>${esc(prof.nombre||'')}</span><span class="av">${esc((prof.nombre||'?').substring(0,2).toUpperCase())}</span>`;
  await cargar();
}

async function cargar(){
  const root=document.getElementById('root');
  root.innerHTML='<div class="loading"><div class="spinner"></div> Cargando campañas…</div>';
  const [c,t,u]=await Promise.all([
    sb.from('mkt_campanas').select('*').order('fecha_inicio',{ascending:false,nullsFirst:false}),
    sb.from('mkt_campana_tareas').select('*'),
    sb.from('usuarios').select('id,nombre,rol,activo'),
  ]);
  _campanas=c.data||[]; _tareas=t.data||[]; _usuarios=u.data||[];
  render();
}

function render(){ if(_vista==='detalle'&&_sel) renderDetalle(); else renderLista(); }

// ─── Vista principal: panel "gerente" + lista de campañas ──────────────────
function tareasDe(campId){ return _tareas.filter(x=>x.campana_id===campId).sort((a,b)=>(FASE_ORDEN.indexOf(a.fase)-FASE_ORDEN.indexOf(b.fase))||String(a.fecha_programada||'9').localeCompare(String(b.fecha_programada||'9'))||(a.orden-b.orden)); }

function renderLista(){
  const root=document.getElementById('root');
  const pend=_tareas.filter(x=>x.estado!=='hecha'&&x.fecha_programada);
  const campById=Object.fromEntries(_campanas.map(c=>[c.id,c]));
  const activas=_campanas.filter(c=>c.estado!=='finalizada');
  const idsActivas=new Set(activas.map(c=>c.id));
  const relevantes=pend.filter(x=>idsActivas.has(x.campana_id));
  const vencidas=relevantes.filter(x=>diasDesdeHoy(x.fecha_programada)<0).sort((a,b)=>a.fecha_programada.localeCompare(b.fecha_programada));
  const hoy=relevantes.filter(x=>diasDesdeHoy(x.fecha_programada)===0);
  const prox=relevantes.filter(x=>{const d=diasDesdeHoy(x.fecha_programada);return d>0&&d<=7;}).sort((a,b)=>a.fecha_programada.localeCompare(b.fecha_programada));

  const tareaLinea=(x,col)=>{
    const c=campById[x.campana_id]||{};
    return `<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--border);">
      <div style="min-width:0;"><div style="font-size:12.5px;font-weight:600;color:var(--text);">${esc(TT_LBL[x.tipo_tarea]||'📌')} · ${esc(x.titulo)}</div>
      <div style="font-size:11px;color:var(--text3);">${esc(c.nombre||'')} · 👤 ${esc(nombreUsuario(x.responsable_id))} · ${fFecha(x.fecha_programada)}</div></div>
      <button class="btn sm" onclick="marcarHecha('${x.id}')">✓ Hecha</button></div>`;
  };
  const panel=(titulo,arr,col,bg)=>arr.length?`<div class="card" style="padding:12px 15px;margin-bottom:12px;border-left:4px solid ${col};background:${bg};">
    <div style="font-size:12.5px;font-weight:800;color:${col};">${titulo} (${arr.length})</div>${arr.map(x=>tareaLinea(x,col)).join('')}</div>`:'';

  const campCard=c=>{
    const ts=tareasDe(c.id); const hechas=ts.filter(x=>x.estado==='hecha').length;
    const pct=ts.length?Math.round(hechas/ts.length*100):0;
    const prxs=ts.filter(x=>x.estado!=='hecha'&&x.fecha_programada).sort((a,b)=>a.fecha_programada.localeCompare(b.fecha_programada));
    const prx=prxs[0];
    const dprx=prx?diasDesdeHoy(prx.fecha_programada):null;
    const estadoChip=c.estado==='finalizada'?'<span class="chip" style="background:#eef1f4;color:#8ba0b8;">Finalizada</span>':(c.estado==='borrador'?'<span class="chip" style="background:var(--gold-bg);color:#9a6b00;">Borrador</span>':'<span class="chip" style="background:var(--teal-bg);color:var(--teal-d);">Activa</span>');
    return `<div class="card" style="padding:14px 16px;margin-bottom:10px;cursor:pointer;" onclick="abrir('${c.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div><div style="font-size:15px;font-weight:700;color:var(--navy);">${esc(c.nombre)}</div>
        <div style="font-size:11.5px;color:var(--text3);margin-top:2px;"><span class="chip" style="background:var(--purple-bg);color:var(--purple);">${esc(TIPO_LBL[c.tipo]||c.tipo||'—')}</span> · ${fFecha(c.fecha_inicio)} → ${fFecha(c.fecha_fin)}${c.producto?' · '+esc(c.producto):''}</div></div>
        ${estadoChip}
      </div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="flex:1;min-width:160px;background:#eef1f4;border-radius:999px;height:8px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:var(--teal);"></div></div>
        <div style="font-size:11.5px;color:var(--text2);font-weight:600;">${hechas}/${ts.length} tareas</div>
      </div>
      ${prx?`<div style="margin-top:8px;font-size:12px;color:${dprx<0?'#E84040':(dprx===0?'#b7791f':'var(--text2)')};"><b>Siguiente:</b> ${esc(prx.titulo)} · ${dprx<0?('vencida hace '+Math.abs(dprx)+' d'):(dprx===0?'hoy':'en '+dprx+' d')} (${fFecha(prx.fecha_programada)})</div>`:(c.estado!=='finalizada'?'<div style="margin-top:8px;font-size:12px;color:var(--green);">✓ Todo al día</div>':'')}
    </div>`;
  };

  root.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
      <div><div style="font-size:18px;font-weight:800;color:var(--navy);">📣 Campañas de marketing</div>
      <div class="muted">Cada campaña arma sola su calendario de tareas por fase (preventa → campaña → últimos días → cierre) y te avisa cuándo toca cada cosa.</div></div>
      <button class="btn purple" onclick="nuevaModal()">+ Nueva campaña</button>
    </div>
    ${panel('🔴 Vencidas',vencidas,'#E84040','var(--red-bg)')}
    ${panel('🟠 Para hoy',hoy,'#F5A623','var(--gold-bg)')}
    ${panel('📅 Próximos 7 días',prox,'#00A99D','var(--teal-bg)')}
    ${(!vencidas.length&&!hoy.length&&!prox.length)?'<div class="card" style="padding:14px 16px;margin-bottom:12px;color:var(--green);font-size:13px;font-weight:600;">✓ No hay tareas de marketing pendientes para los próximos días.</div>':''}
    <div style="font-size:13px;font-weight:700;color:var(--text2);margin:16px 0 8px;">Todas las campañas (${_campanas.length})</div>
    ${_campanas.length?_campanas.map(campCard).join(''):'<div class="card center">Aún no hay campañas. Crea la primera con "+ Nueva campaña".</div>'}
  `;
}

// ─── Nueva campaña ─────────────────────────────────────────────────────────
function nuevaModal(){
  const optTipo=MKT_TIPOS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
  const optResp=`<option value="">— sin asignar —</option>`+_usuarios.filter(u=>u.activo!==false).map(u=>`<option value="${u.id}" ${u.rol==='marketing'?'selected':''}>${esc(u.nombre)} (${esc(u.rol)})</option>`).join('');
  modal(`<div style="font-size:16px;font-weight:800;margin-bottom:4px;">+ Nueva campaña</div>
    <div class="muted" style="margin-bottom:14px;">Elige el tipo y las fechas; la app arma sola las tareas por fase. Luego puedes ajustarlas.</div>
    <label class="fld"><span>Nombre de la campaña</span><input id="nNombre" class="inp" placeholder="Ej. Black Friday 2026"></label>
    <div class="grid2">
      <label class="fld"><span>Tipo</span><select id="nTipo" class="inp">${optTipo}</select></label>
      <label class="fld"><span>Responsable principal</span><select id="nResp" class="inp">${optResp}</select></label>
      <label class="fld"><span>Inicio de la campaña</span><input id="nIni" type="date" class="inp" value="${hoyISO()}"></label>
      <label class="fld"><span>Fin / cierre</span><input id="nFin" type="date" class="inp"></label>
      <label class="fld"><span>Producto / sistema (opcional)</span><input id="nProd" class="inp" placeholder="NOI, COI, Diplomado…"></label>
      <label class="fld"><span>Presupuesto (opcional)</span><input id="nPres" type="number" class="inp" placeholder="0"></label>
    </div>
    <label class="fld"><span>Objetivo (opcional)</span><textarea id="nObj" class="inp" placeholder="Qué buscamos con esta campaña"></textarea></label>
    <div style="font-size:11.5px;color:var(--text3);margin-bottom:12px;">💡 Se generarán tareas automáticas según el tipo. Las fechas se calculan desde el inicio y el cierre.</div>
    <div style="display:flex;gap:8px;"><button class="btn purple" onclick="crear()">Crear campaña</button><button class="btn ghost" onclick="cerrar()">Cancelar</button></div>`);
}

async function crear(){
  const v=id=>document.getElementById(id)?.value.trim()||'';
  const nombre=v('nNombre'); if(!nombre) return alert('Ponle nombre a la campaña.');
  const tipo=v('nTipo'); const ini=v('nIni')||null; const fin=v('nFin')||null;
  if(!ini||!fin) return alert('Pon la fecha de inicio y de cierre para calcular las tareas.');
  if(fin<ini) return alert('La fecha de cierre no puede ser antes del inicio.');
  const fila={nombre, tipo, estado:'activa', fecha_inicio:ini, fecha_fin:fin,
    objetivo:v('nObj')||null, producto:v('nProd')||null, presupuesto:parseFloat(v('nPres'))||null,
    responsable_id:document.getElementById('nResp')?.value||null,
    anio:+ini.slice(0,4), mes:+ini.slice(5,7), created_by:userProfile?.nombre||''};
  const {data:camp,error}=await sb.from('mkt_campanas').insert(fila).select().single();
  if(error) return alert('No se pudo crear: '+error.message);
  // Generar tareas del playbook
  const pb=PLAYBOOKS[tipo]||PLAYBOOKS.otro;
  const respPrin=fila.responsable_id;
  const tareas=pb.map((p,i)=>({
    campana_id:camp.id, titulo:p.t, tipo_tarea:p.tt, fase:p.f,
    responsable_id: usuarioPorRol(p.rol) || respPrin || null,
    fecha_programada: addDays(p.ref==='inicio'?ini:fin, p.d),
    estado:'pendiente', orden:i
  }));
  if(tareas.length){ const {error:e2}=await sb.from('mkt_campana_tareas').insert(tareas); if(e2) console.error(e2); }
  cerrar(); toast('Campaña creada con '+tareas.length+' tareas'); _sel=camp.id; _vista='detalle'; await cargar();
}

// ─── Detalle de campaña ────────────────────────────────────────────────────
function abrir(id){ _sel=id; _vista='detalle'; render(); }
function volver(){ _vista='lista'; _sel=null; render(); }

function renderDetalle(){
  const root=document.getElementById('root');
  const c=_campanas.find(x=>x.id===_sel); if(!c){ volver(); return; }
  const ts=tareasDe(c.id);
  const optResp=id=>`<option value="">— sin asignar —</option>`+_usuarios.filter(u=>u.activo!==false).map(u=>`<option value="${u.id}" ${u.id===id?'selected':''}>${esc(u.nombre)}</option>`).join('');
  const hechas=ts.filter(x=>x.estado==='hecha').length;

  let filas='';
  FASE_ORDEN.forEach(f=>{
    const grp=ts.filter(x=>x.fase===f); if(!grp.length) return;
    filas+=`<div class="fasehead" style="color:${FASE_COL[f]};">${FASE_LBL[f]}</div>`;
    filas+=`<div class="tcard">`+grp.map(x=>{
      const done=x.estado==='hecha'; const d=diasDesdeHoy(x.fecha_programada);
      const fcol=done?'var(--text3)':(d==null?'var(--text3)':(d<0?'#E84040':(d===0?'#b7791f':'var(--text2)')));
      return `<div class="trow">
        <input type="checkbox" ${done?'checked':''} onchange="toggleTarea('${x.id}',this.checked)" style="width:18px;height:18px;margin-top:2px;cursor:pointer;">
        <div style="min-width:0;">
          <div style="font-size:13px;font-weight:600;color:${done?'var(--text3)':'var(--text)'};${done?'text-decoration:line-through;':''}">${esc(TT_LBL[x.tipo_tarea]||'📌')} ${esc(x.titulo)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:5px;">
            <input type="date" class="inp" style="width:140px;padding:4px 7px;font-size:12px;" value="${x.fecha_programada||''}" onchange="editarTarea('${x.id}','fecha_programada',this.value)">
            <select class="inp" style="width:auto;padding:4px 7px;font-size:12px;" onchange="editarTarea('${x.id}','responsable_id',this.value)">${optResp(x.responsable_id)}</select>
            ${done&&x.hecha_por?`<span style="font-size:10.5px;color:var(--green);">✓ ${esc(x.hecha_por)}</span>`:(x.fecha_programada&&!done?`<span style="font-size:10.5px;color:${fcol};">${d<0?'vencida':(d===0?'hoy':'en '+d+' d')}</span>`:'')}
          </div>
        </div>
        <button class="btn ghost sm" onclick="borrarTarea('${x.id}')" title="Borrar tarea">✕</button>
      </div>`;
    }).join('')+`</div>`;
  });

  root.innerHTML=`
    <div style="margin-bottom:10px;"><a href="javascript:void(0)" onclick="volver()" style="font-size:12.5px;">← Volver a campañas</a></div>
    <div class="card" style="padding:16px 18px;margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div><div style="font-size:18px;font-weight:800;color:var(--navy);">${esc(c.nombre)}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:3px;"><span class="chip" style="background:var(--purple-bg);color:var(--purple);">${esc(TIPO_LBL[c.tipo]||c.tipo)}</span> · ${fFecha(c.fecha_inicio)} → ${fFecha(c.fecha_fin)}${c.producto?' · '+esc(c.producto):''}${c.presupuesto?' · Presupuesto '+fmtMoney(c.presupuesto):''}</div>
        ${c.objetivo?`<div style="font-size:12.5px;color:var(--text2);margin-top:6px;">🎯 ${esc(c.objetivo)}</div>`:''}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${c.estado!=='finalizada'?`<button class="btn ghost sm" onclick="finalizar('${c.id}')">Finalizar</button>`:`<button class="btn ghost sm" onclick="reactivar('${c.id}')">Reactivar</button>`}
          <button class="btn ghost sm" onclick="borrarCampana('${c.id}')" style="color:#E84040;">Borrar</button>
        </div>
      </div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="flex:1;min-width:160px;background:#eef1f4;border-radius:999px;height:9px;overflow:hidden;"><div style="width:${ts.length?Math.round(hechas/ts.length*100):0}%;height:100%;background:var(--teal);"></div></div>
        <div style="font-size:12px;color:var(--text2);font-weight:600;">${hechas}/${ts.length} tareas hechas</div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <div style="font-size:13px;font-weight:700;color:var(--text2);">Tareas por fase</div>
      <button class="btn ghost sm" onclick="agregarTareaModal('${c.id}')">+ Agregar tarea</button>
    </div>
    ${ts.length?filas:'<div class="card center">Esta campaña no tiene tareas. Agrega una.</div>'}
  `;
}

// ─── Acciones sobre tareas ─────────────────────────────────────────────────
async function marcarHecha(id){
  await sb.from('mkt_campana_tareas').update({estado:'hecha',hecha_at:new Date().toISOString(),hecha_por:userProfile?.nombre||''}).eq('id',id);
  const t=_tareas.find(x=>x.id===id); if(t){t.estado='hecha';t.hecha_por=userProfile?.nombre||'';}
  render();
}
async function toggleTarea(id,checked){
  const patch=checked?{estado:'hecha',hecha_at:new Date().toISOString(),hecha_por:userProfile?.nombre||''}:{estado:'pendiente',hecha_at:null,hecha_por:null};
  await sb.from('mkt_campana_tareas').update(patch).eq('id',id);
  const t=_tareas.find(x=>x.id===id); if(t)Object.assign(t,patch);
  render();
}
async function editarTarea(id,campo,val){
  const patch={}; patch[campo]=val||null;
  await sb.from('mkt_campana_tareas').update(patch).eq('id',id);
  const t=_tareas.find(x=>x.id===id); if(t)Object.assign(t,patch);
  if(campo==='fecha_programada') render();
}
async function borrarTarea(id){
  if(!confirm('¿Borrar esta tarea?')) return;
  await sb.from('mkt_campana_tareas').delete().eq('id',id);
  _tareas=_tareas.filter(x=>x.id!==id); render();
}
function agregarTareaModal(campId){
  const optTT=TT.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
  const optF=FASES.map(f=>`<option value="${f[0]}">${f[1]}</option>`).join('');
  const optResp=`<option value="">— sin asignar —</option>`+_usuarios.filter(u=>u.activo!==false).map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join('');
  modal(`<div style="font-size:16px;font-weight:800;margin-bottom:12px;">+ Agregar tarea</div>
    <label class="fld"><span>Tarea</span><input id="aT" class="inp" placeholder="Qué hay que hacer"></label>
    <div class="grid2">
      <label class="fld"><span>Tipo</span><select id="aTT" class="inp">${optTT}</select></label>
      <label class="fld"><span>Fase</span><select id="aF" class="inp">${optF}</select></label>
      <label class="fld"><span>Fecha</span><input id="aFecha" type="date" class="inp" value="${hoyISO()}"></label>
      <label class="fld"><span>Responsable</span><select id="aResp" class="inp">${optResp}</select></label>
    </div>
    <div style="display:flex;gap:8px;"><button class="btn purple" onclick="agregarTarea('${campId}')">Agregar</button><button class="btn ghost" onclick="cerrar()">Cancelar</button></div>`);
}
async function agregarTarea(campId){
  const v=id=>document.getElementById(id)?.value||'';
  const titulo=v('aT').trim(); if(!titulo) return alert('Escribe la tarea.');
  const fila={campana_id:campId,titulo,tipo_tarea:v('aTT'),fase:v('aF'),fecha_programada:v('aFecha')||null,responsable_id:v('aResp')||null,estado:'pendiente',orden:99};
  const {data,error}=await sb.from('mkt_campana_tareas').insert(fila).select().single();
  if(error) return alert('No se pudo: '+error.message);
  _tareas.push(data); cerrar(); render();
}

// ─── Acciones sobre campaña ────────────────────────────────────────────────
async function finalizar(id){ await sb.from('mkt_campanas').update({estado:'finalizada'}).eq('id',id); const c=_campanas.find(x=>x.id===id); if(c)c.estado='finalizada'; render(); }
async function reactivar(id){ await sb.from('mkt_campanas').update({estado:'activa'}).eq('id',id); const c=_campanas.find(x=>x.id===id); if(c)c.estado='activa'; render(); }
async function borrarCampana(id){
  if(!confirm('¿Borrar esta campaña y todas sus tareas? No se puede deshacer.')) return;
  await sb.from('mkt_campanas').delete().eq('id',id);
  _campanas=_campanas.filter(x=>x.id!==id); _tareas=_tareas.filter(x=>x.campana_id!==id);
  volver();
}

arrancar();
</script>
