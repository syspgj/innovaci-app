<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovaci OS · Operaciones</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mismo lenguaje visual que la app principal (index.html) — Jp, 2026-11-19.
   Fase 0 del plan de Mesa de Control: módulo en su propio HTML para no
   sobrecargar index.html. Comparte la sesión de Supabase por ser el mismo
   dominio; no vuelve a pedir login. */
:root{
  --navy:#0D2240;--navy2:#132C52;--teal:#00A99D;--teal-d:#00877E;--teal-bg:rgba(0,169,157,0.1);--teal-b:rgba(0,169,157,0.25);
  --gold:#F5A623;--gold-bg:rgba(245,166,35,0.1);--gold-b:rgba(245,166,35,0.25);
  --red:#E84040;--red-bg:rgba(232,64,64,0.08);--red-b:rgba(232,64,64,0.25);--green:#27AE60;--green-bg:rgba(39,174,96,0.1);
  --bg:#EEF2F7;--surface:#fff;--surf2:#F7FAFC;
  --text:#0D2240;--text2:#4A6080;--text3:#8BA0B8;
  --border:rgba(13,34,64,0.08);--rad:16px;--radsm:10px;--radpill:999px;
  --shadow-sm:0 1px 2px rgba(13,34,64,0.05),0 1px 3px rgba(13,34,64,0.06);
  --shadow-md:0 2px 6px rgba(13,34,64,0.06),0 8px 24px rgba(13,34,64,0.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,Arial,sans-serif;font-size:14px;}
a{color:var(--teal);}
.topbar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;}
.topbar .brand small{font-weight:500;color:rgba(255,255,255,.6);font-size:12px;}
.topbar .right{display:flex;align-items:center;gap:10px;font-size:12px;}
.topbar a.app{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;font-weight:600;}
.topbar .av{width:30px;height:30px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}
.wrap.full{max-width:1680px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px;}
.tab{padding:7px 14px;border-radius:var(--radpill);border:1px solid var(--border);background:#fff;color:var(--text2);font-size:12.5px;font-weight:600;cursor:pointer;}
.tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.tab.soon{opacity:.55;cursor:default;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);box-shadow:var(--shadow-sm);}
.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--radsm);padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn.ghost{background:#fff;color:var(--text2);border:1px solid var(--border);font-weight:600;}
.btn.navy{background:var(--navy);}
.inp{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radsm);font-size:13px;font-family:inherit;color:var(--text);box-sizing:border-box;background:#fff;}
textarea.inp{min-height:62px;resize:vertical;}
label.fld{display:block;margin-bottom:10px;}
label.fld>span{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:600;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:var(--radpill);padding:2px 9px;}
.loading{display:flex;align-items:center;gap:10px;color:var(--text3);padding:40px;justify-content:center;}
.spinner{width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal .box{background:#fff;border-radius:var(--rad);max-width:760px;width:100%;max-height:92vh;overflow-y:auto;padding:22px 24px;}
.asgCols{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
.asgCols .colhead{font-size:11px;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.03em;margin:2px 0 8px;}
.inp[readonly]{background:var(--surf2);color:var(--text2);}
@media(max-width:620px){.asgCols{grid-template-columns:1fr;}}
.svc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.svc:hover{background:var(--surf2);}
.svc:last-child{border-bottom:none;}
.svc .nom{font-weight:700;font-size:13.5px;color:var(--text);}
.svc .meta{font-size:11px;color:var(--text3);margin-top:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}
.muted{color:var(--text3);font-size:12px;}
.center{text-align:center;padding:50px 20px;color:var(--text3);}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">🛠 Innovaci OS <small>· Operaciones</small></div>
  <div class="right" id="topRight"></div>
</div>
<div class="wrap" id="root">
  <div class="loading"><div class="spinner"></div> Cargando…</div>
</div>

<script>
// ─── Conexión (misma que la app principal; sesión compartida por dominio) ───
const SURL='https://ydwouspzneacxfixlmmv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd291c3B6bmVhY3hmaXhsbW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzA5MzAsImV4cCI6MjA5NjkwNjkzMH0.uWB1VN2YT7ynTbHmfTWCOBHMRR54LdHJook7iOk7Mug';
const sb=supabase.createClient(SURL,SKEY);

// Roles que entran a Operaciones. El asesor (Soporte) entra en modo lectura.
const ROLES_OPS=['director','mesa_control','gerente_operaciones','administracion','asesor'];
let userProfile=null, esStaff=false, esAsesor=false, _actuarComo=null, _servicios=[], _busca='', _filtroCat='';

function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tiempoTxt(min){ if(min==null||min==='') return '—'; min=+min; if(min<60) return min+' min'; const h=Math.floor(min/60),m=min%60; return h+'h'+(m?' '+m+'m':''); }

async function arrancar(){
  const root=document.getElementById('root');
  const {data:sessData}=await sb.auth.getSession();
  if(!sessData||!sessData.session){
    root.innerHTML=`<div class="center card" style="padding:50px 24px;">
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px;">Inicia sesión primero</div>
      <div class="muted" style="margin-bottom:16px;">Esta es el área de Operaciones de Innovaci OS. Entra en la app principal y desde ahí se abre aquí.</div>
      <a class="btn" href="/" style="text-decoration:none;display:inline-block;">Ir a la app principal</a></div>`;
    return;
  }
  const uid=sessData.session.user.id;
  const {data:prof}=await sb.from('usuarios').select('*').eq('id',uid).maybeSingle();
  if(!prof){ root.innerHTML=`<div class="center">No encontré tu perfil de usuario. Avisa a Dirección.</div>`; return; }
  userProfile=prof;
  if(!ROLES_OPS.includes(prof.rol)){
    root.innerHTML=`<div class="center card" style="padding:50px 24px;">
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px;">Esta área es de Operaciones</div>
      <div class="muted" style="margin-bottom:16px;">Tu usuario (${esc(prof.rol)}) no tiene acceso a Mesa de Control. Si crees que debería, avisa a Dirección.</div>
      <a class="btn ghost" href="/" style="text-decoration:none;display:inline-block;">Volver a la app</a></div>`;
    return;
  }
  esStaff=['director','mesa_control','gerente_operaciones','administracion'].includes(prof.rol);
  esAsesor=(prof.rol==='asesor');
  if(esAsesor) currentOpsTab='asignaciones'; // el asesor entra directo a sus servicios
  document.getElementById('topRight').innerHTML=`
    <a class="app" href="/">← App principal</a>
    <span>${esc(prof.nombre||'')}</span>
    <span class="av">${esc((prof.nombre||'?').substring(0,2).toUpperCase())}</span>`;
  pintarShell();
}

let currentOpsTab='catalogo';
function irOps(tab){ currentOpsTab=tab; pintarShell(); }
function pintarShell(){
  const tabAsigTxt = esAsesor ? '📅 Mis servicios' : '📅 Asignaciones';
  const sub = currentOpsTab==='asignaciones'
    ? (esAsesor ? 'Tus servicios asignados. Cuando estés con el cliente, dale ▶ Iniciar; al terminar, ⏹ Finalizar.'
                : 'Tablero del servicio: solicitudes → asignados → en curso → concluidos → reportados → cerrados con ticket.')
    : 'El catálogo que es cimiento de todo: qué es cada servicio, qué pedirle al cliente, qué valida Mesa de Control, alcances y tiempo.';
  const rootEl=document.getElementById('root');
  rootEl.className='wrap'+(currentOpsTab==='asignaciones'?' full':'');
  rootEl.innerHTML=`
    <div class="tabs">
      <div class="tab ${currentOpsTab==='catalogo'?'active':''}" onclick="irOps('catalogo')">🧾 Catálogo de servicios</div>
      <div class="tab ${currentOpsTab==='asignaciones'?'active':''}" onclick="irOps('asignaciones')">${tabAsigTxt}</div>
      <div class="tab soon" title="Próxima fase">🎫 Tickets</div>
    </div>
    <div class="muted" style="margin:2px 0 14px;">${sub}</div>
    <div id="mod"></div>`;
  if(currentOpsTab==='asignaciones'){ renderAsignaciones(); if(!_opsTick) _opsTick=setInterval(tickTiempos,30000); }
  else{ if(_opsTick){ clearInterval(_opsTick); _opsTick=null; } renderCatalogo(); }
}

// ─── Catálogo de servicios de operación ─────────────────────────────────────
async function renderCatalogo(){
  const m=document.getElementById('mod');
  m.innerHTML=`<div class="loading"><div class="spinner"></div> Cargando catálogo…</div>`;
  const {data,error}=await sb.from('operaciones_servicios_catalogo').select('*').order('activo',{ascending:false}).order('orden').order('nombre');
  if(error){ m.innerHTML=`<div class="center" style="color:var(--red);">No se pudo cargar: ${esc(error.message)}</div>`; return; }
  _servicios=data||[];
  pintarCatalogo();
}
function catLabel(c){ return c||'Sin clasificar'; }
function filtrarCat(v){ _filtroCat=v; pintarCatalogo(); }
function pintarCatalogo(){
  const m=document.getElementById('mod');
  const q=_busca.trim().toLowerCase();
  // categorías presentes, para los filtros
  const cats=[...new Set(_servicios.map(s=>catLabel(s.categoria)))].sort();
  let lista=_servicios;
  if(_filtroCat) lista=lista.filter(s=>catLabel(s.categoria)===_filtroCat);
  if(q) lista=lista.filter(s=>[s.nombre,s.codigo,s.categoria,s.aplica_poliza,s.resumen_claro,s.a_que_se_refiere].join(' ').toLowerCase().includes(q));
  const chip=(txt,val)=>`<button class="btn ${_filtroCat===val?'':'ghost'}" style="padding:4px 11px;font-size:12px;" onclick='filtrarCat(${esc(JSON.stringify(val))})'>${esc(txt)}</button>`;
  m.innerHTML=`
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;">
      <div style="flex:1;min-width:200px;">
        <div style="font-size:15px;font-weight:700;">Catálogo de servicios</div>
        <div class="muted">${_servicios.length} servicio${_servicios.length===1?'':'s'} · el manual de cada servicio: qué es, qué pedirle al cliente, qué valida Mesa de Control, alcances y tiempo.</div>
      </div>
      <input class="inp" style="flex:0 0 220px;max-width:240px;" placeholder="🔍 Buscar servicio…" value="${esc(_busca)}" oninput="_busca=this.value;pintarCatalogo()">
      ${esStaff?`<button class="btn" onclick="editarServicio(null)">＋ Nuevo servicio</button>`:''}
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
      ${chip('Todas','')}${cats.map(c=>chip(c,c)).join('')}
    </div>
    <div class="card">
      ${lista.length?lista.map(filaServicio).join(''):'<div class="center">'+(q||_filtroCat?'Sin coincidencias.':'Aún no hay servicios en el catálogo.'+(esStaff?' Empieza con “＋ Nuevo servicio”.':''))+'</div>'}
    </div>`;
}
function filaServicio(s){
  const t=tiempoTxt(s.tiempo_aprox_min);
  const pol=(s.aplica_poliza||'').toUpperCase();
  const polChip = pol.startsWith('SI') ? '<span class="chip" style="background:var(--green-bg,#e7f6ec);color:var(--green,#1a7f3c);">en póliza</span>'
                : pol==='NO' ? '<span class="chip" style="background:var(--amber-bg,#fdf3e3);color:var(--amber,#9a6a12);">no incluido</span>' : '';
  return `<div class="svc" onclick="verServicio('${s.id}')">
    <div style="flex:1;min-width:0;">
      <div class="nom">${esc(s.nombre)} ${polChip}${s.activo?'':' <span class="chip" style="background:var(--red-bg);color:var(--red);">inactivo</span>'}</div>
      <div class="meta">${s.categoria?esc(s.categoria)+' · ':''}${s.nivel_asesor?esc(s.nivel_asesor)+' · ':''}⏱ ${t}${s.precio_recomendado!=null?' · $'+(+s.precio_recomendado).toLocaleString('es-MX'):''}${s.codigo?' · '+esc(s.codigo):''}</div>
    </div>
    <div style="color:var(--text3);font-size:12px;white-space:nowrap;">ver →</div>
  </div>`;
}

// Detalle en segundo nivel = el MANUAL del servicio (UX: entrada básica, manual al abrir).
function verServicio(id){
  const s=_servicios.find(x=>x.id===id); if(!s) return;
  // bloque normal
  const bloque=(t,v,icon)=>v?`<div style="margin-top:14px;"><div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;">${icon?icon+' ':''}${t}</div><div style="font-size:13px;color:var(--text);margin-top:3px;white-space:pre-wrap;line-height:1.5;">${esc(v)}</div></div>`:'';
  // bloque resaltado (Mesa de Control)
  const bloqueMC=(t,v,icon)=>v?`<div style="margin-top:14px;background:var(--navy-bg,#eef2fb);border:1px solid var(--navy-bd,#d4ddf4);border-radius:10px;padding:11px 13px;"><div style="font-size:11px;font-weight:800;color:var(--navy,#2a3f7a);text-transform:uppercase;letter-spacing:.04em;">${icon?icon+' ':''}${t}</div><div style="font-size:13px;color:var(--text);margin-top:4px;white-space:pre-wrap;line-height:1.5;">${esc(v)}</div></div>`:'';
  const pol=(s.aplica_poliza||'').toUpperCase();
  const polTxt = pol.startsWith('SI') ? '✅ Incluido en póliza'+(pol.length>2?' — '+esc(s.aplica_poliza):'')
               : pol==='NO' ? '⚠️ NO incluido en póliza (se cobra aparte)'
               : s.aplica_poliza ? esc(s.aplica_poliza) : '';
  // ficha de datos duros
  const dato=(et,val)=>val?`<div style="min-width:120px;"><div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;">${et}</div><div style="font-size:13px;font-weight:700;color:var(--text);">${val}</div></div>`:'';
  const money=v=>v!=null?'$'+(+v).toLocaleString('es-MX',{minimumFractionDigits:0}):'';
  const qué = s.resumen_claro || s.a_que_se_refiere;
  mostrarModal(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
      <div style="min-width:0;">
        <div style="font-size:16px;font-weight:800;">${esc(s.nombre)}</div>
        <div class="muted">${s.categoria?esc(s.categoria):''}${s.codigo?' · '+esc(s.codigo):''}${s.nivel_asesor?' · '+esc(s.nivel_asesor):''}${s.activo?'':' · <span style="color:var(--red);">inactivo</span>'}</div>
      </div>
      <button class="btn ghost" onclick="cerrarModal()" style="padding:5px 10px;">✕</button>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding:11px 13px;background:var(--bg2,#f6f7f9);border-radius:10px;">
      ${dato('Tiempo aprox.', s.tiempo_prom_txt?esc(s.tiempo_prom_txt):tiempoTxt(s.tiempo_aprox_min))}
      ${dato('Rango', [s.tiempo_min_txt,s.tiempo_max_txt].filter(Boolean).map(esc).join(' – '))}
      ${dato('Precio recomendado', money(s.precio_recomendado))}
      ${dato('Precio mínimo', money(s.precio_minimo))}
    </div>
    ${polTxt?`<div style="margin-top:10px;font-size:13px;font-weight:700;color:${pol.startsWith('SI')?'var(--green,#1a7f3c)':pol==='NO'?'var(--amber,#9a6a12)':'var(--text)'};">${polTxt}</div>`:''}
    ${bloque('¿Qué es y cuándo se usa?',qué,'💡')}
    ${bloque('Qué incluye el servicio',s.observacion_partida,'📦')}
    ${bloque('Qué debe tener listo el cliente',s.requisitos_cliente,'📋')}
    ${bloqueMC('Antes de asignar — valida Mesa de Control',s.consideraciones_mc,'🔎')}
    ${bloque('Lo que Ventas debe decir al cliente',s.consideraciones_ventas,'🗣')}
    ${bloque('Requisitos del asesor',s.requisitos_asesor,'🧰')}
    <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;">
      ${esStaff?`<button class="btn" onclick="editarServicio('${s.id}')">✏️ Editar</button>`:''}
      <button class="btn ghost" onclick="cerrarModal()">Cerrar</button>
    </div>`);
}

// Alta / edición (solo staff). Cubre TODO el manual del servicio.
function editarServicio(id){
  const s=id?_servicios.find(x=>x.id===id):{};
  if(!esStaff) return;
  const num=v=>v!=null?v:'';
  mostrarModal(`
    <div style="font-size:16px;font-weight:800;margin-bottom:4px;">${id?'Editar servicio':'Nuevo servicio'}</div>
    <div class="muted" style="margin-bottom:12px;">Todo lo que escribas aquí es lo que verá Mesa de Control y Ventas al cotizar y asignar. Escríbelo claro, como para explicárselo a alguien de 12 años.</div>
    <label class="fld"><span>Nombre del servicio *</span><input class="inp" id="svNombre" value="${esc(s.nombre||'')}" placeholder="Ej. Alta de RFC adicional en Siigo Aspel Facture"></label>
    <div class="grid2">
      <label class="fld"><span>Categoría</span><input class="inp" id="svCat" value="${esc(s.categoria||'')}" placeholder="Servicios Aspel / Servicios IT"></label>
      <label class="fld"><span>Código (opcional)</span><input class="inp" id="svCod" value="${esc(s.codigo||'')}" placeholder="AASFA"></label>
      <label class="fld"><span>Línea</span>
        <select class="inp" id="svLinea">
          <option value="" ${!s.linea?'selected':''}>—</option>
          <option value="AS" ${s.linea==='AS'?'selected':''}>AS · Aspel</option>
          <option value="IT" ${s.linea==='IT'?'selected':''}>IT</option>
        </select></label>
      <label class="fld"><span>Nivel de asesor</span><input class="inp" id="svNivel" value="${esc(s.nivel_asesor||'')}" placeholder="Junior / Senior / Master Aspel"></label>
      <label class="fld"><span>Clave SAT</span><input class="inp" id="svSat" value="${esc(s.clave_sat||'')}" placeholder="81112200"></label>
      <label class="fld"><span>Clave unidad</span><input class="inp" id="svUni" value="${esc(s.clave_unidad||'')}" placeholder="E48"></label>
      <label class="fld"><span>Precio recomendado ($)</span><input class="inp" id="svPrecR" type="number" min="0" step="0.01" value="${num(s.precio_recomendado)}" placeholder="300"></label>
      <label class="fld"><span>Precio mínimo ($)</span><input class="inp" id="svPrecM" type="number" min="0" step="0.01" value="${num(s.precio_minimo)}" placeholder="200"></label>
    </div>
    <div class="grid2">
      <label class="fld"><span>Tiempo mínimo</span><input class="inp" id="svTmin" value="${esc(s.tiempo_min_txt||'')}" placeholder="30 minutos"></label>
      <label class="fld"><span>Tiempo promedio</span><input class="inp" id="svTprom" value="${esc(s.tiempo_prom_txt||'')}" placeholder="45 min"></label>
      <label class="fld"><span>Tiempo máximo</span><input class="inp" id="svTmax" value="${esc(s.tiempo_max_txt||'')}" placeholder="1 hora"></label>
      <label class="fld"><span>Tiempo aprox. (minutos, para cálculos)</span><input class="inp" id="svTiempo" type="number" min="0" value="${num(s.tiempo_aprox_min)}" placeholder="45"></label>
    </div>
    <label class="fld"><span>Aplica a póliza</span><input class="inp" id="svPol" value="${esc(s.aplica_poliza||'')}" placeholder="SI / NO / texto de la condición"></label>
    <label class="fld"><span>💡 ¿Qué es y cuándo se usa? (en palabras simples)</span><textarea class="inp" id="svQue" placeholder="Explica en qué caso se pide este servicio, como una receta.">${esc(s.a_que_se_refiere||'')}</textarea></label>
    <label class="fld"><span>Resumen claro (opcional · si lo dejas vacío se usa el de arriba)</span><textarea class="inp" id="svResumen" placeholder="Versión corta y clara para mostrar primero.">${esc(s.resumen_claro||'')}</textarea></label>
    <label class="fld"><span>📦 Qué incluye el servicio (alcances / partida)</span><textarea class="inp" id="svObs" placeholder="Qué se entrega y qué NO incluye.">${esc(s.observacion_partida||'')}</textarea></label>
    <label class="fld"><span>📋 Qué debe tener listo el cliente</span><textarea class="inp" id="svReqCli" placeholder="Accesos, respaldos, datos fiscales, etc.">${esc(s.requisitos_cliente||'')}</textarea></label>
    <label class="fld"><span>🔎 Antes de asignar — valida Mesa de Control</span><textarea class="inp" id="svMC" placeholder="Lo que Mesa de Control revisa antes de pasar el servicio a soporte.">${esc(s.consideraciones_mc||'')}</textarea></label>
    <label class="fld"><span>🗣 Lo que Ventas debe decir al cliente</span><textarea class="inp" id="svVen" placeholder="Qué advertir antes de cerrar la venta.">${esc(s.consideraciones_ventas||'')}</textarea></label>
    <label class="fld"><span>🧰 Requisitos del asesor (opcional)</span><textarea class="inp" id="svReqAse" placeholder="Qué debe preparar o llevar el asesor.">${esc(s.requisitos_asesor||'')}</textarea></label>
    <label class="fld"><span>Descripción (base del entregable)</span><textarea class="inp" id="svDesc" placeholder="Texto que sirve de base para el entregable al cliente.">${esc(s.descripcion||'')}</textarea></label>
    <label style="display:flex;align-items:center;gap:7px;font-size:13px;margin:4px 0 14px;cursor:pointer;"><input type="checkbox" id="svActivo" ${s.activo===false?'':'checked'}> Activo</label>
    <div id="svMsg" style="font-size:12px;margin-bottom:8px;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" id="svGuardar" onclick="guardarServicio('${id||''}')">Guardar</button>
      <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>

}
async function guardarServicio(id){
  const v=i=>document.getElementById(i)?.value.trim();
  const nombre=v('svNombre');
  const msg=document.getElementById('svMsg');
  if(!nombre){ msg.innerHTML='<span style="color:var(--red);font-weight:600;">El nombre es obligatorio.</span>'; return; }
  const n=i=>{ const r=v(i); return r!==''&&r!=null?Number(r):null; };
  const iv=i=>{ const r=v(i); return r!==''&&r!=null?parseInt(r,10):null; };
  const fila={
    nombre,
    categoria:v('svCat')||null, codigo:v('svCod')||null, linea:v('svLinea')||null,
    nivel_asesor:v('svNivel')||null, clave_sat:v('svSat')||null, clave_unidad:v('svUni')||null,
    precio_recomendado:n('svPrecR'), precio_minimo:n('svPrecM'),
    tiempo_min_txt:v('svTmin')||null, tiempo_prom_txt:v('svTprom')||null, tiempo_max_txt:v('svTmax')||null,
    tiempo_aprox_min:iv('svTiempo'),
    aplica_poliza:v('svPol')||null,
    a_que_se_refiere:v('svQue')||null,
    resumen_claro:(v('svResumen')||v('svQue'))||null,
    observacion_partida:v('svObs')||null,
    requisitos_cliente:v('svReqCli')||null,
    consideraciones_mc:v('svMC')||null,
    consideraciones_ventas:v('svVen')||null,
    requisitos_asesor:v('svReqAse')||null,
    descripcion:v('svDesc')||null,
    activo:document.getElementById('svActivo').checked, updated_at:new Date().toISOString()
  };
  const btn=document.getElementById('svGuardar'); btn.disabled=true; btn.textContent='Guardando…';
  let error;
  if(id){ ({error}=await sb.from('operaciones_servicios_catalogo').update(fila).eq('id',id)); }
  else  { ({error}=await sb.from('operaciones_servicios_catalogo').insert(fila)); }
  if(error){ btn.disabled=false; btn.textContent='Guardar'; msg.innerHTML=`<span style="color:var(--red);font-weight:600;">No se pudo guardar: ${esc(error.message)}</span>`; return; }
  cerrarModal();
  renderCatalogo();
}

// ═══ ASIGNACIONES (Fase 1 del plan de Mesa de Control) ══════════════════════
// Coordinación toma un pendiente de Telegram (o captura directa) y lo asigna a
// un asesor con servicio del catálogo, día y hora. Guarda en servicios_ejecutados
// (la tabla del ticket) con estatus ASIGNADO y marca el pendiente como procesado.
let _opsCatAsig=[], _asesores=[], _pendientes=[], _asignaciones=[], _opsFiltroTipo='todo', _opsTick=null, _polVig=[];
// Nivel de póliza (igual que Cartera de cuentas): N1 Black · Crítico … N5 Gray · Básica
const POLIZA_NIVEL_COLOR={N1:'#1A1F29',N2:'#1D5FA8',N3:'#E0A324',N4:'#1D9E75',N5:'#9AA3AB'};
const POLIZA_NIVEL_ETIQUETA={N1:'Black',N2:'Blue',N3:'Gold',N4:'Green',N5:'Gray'};
const _norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\([^)]*\)/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
// Resuelve la póliza VIGENTE de un servicio/solicitud (por id de póliza, por cuenta, o por nombre)
function _polizaDe(o){
  if(!_polVig||!_polVig.length||!o) return null;
  const pid=o.cliente_poliza_id, cid=o.cliente_cartera_id, nom=o.cliente_nombre||o.cliente||'';
  let p = pid&&_polVig.find(x=>x.id===pid);
  if(!p && cid) p=_polVig.find(x=>x.cliente_cartera_id===cid);
  if(!p && nom){ const n=_norm(nom); if(n) p=_polVig.find(x=>{const pn=_norm(x.cliente_nombre); return pn&&(pn===n||n.startsWith(pn)||pn.startsWith(n)||(pn.length>4&&n.includes(pn))||(n.length>4&&pn.includes(n)));}); }
  return p||null;
}
const _nivelDe=p=>p&&p.polizas_catalogo?p.polizas_catalogo.prioridad_codigo:null;
function _horasRest(p){ if(!p) return null; const t=parseFloat(p.horas_totales)||0,c=parseFloat(p.horas_consumidas)||0; return Math.max(0,Math.round((t-c)*100)/100); }
function _polVigente(p){ if(!p) return false; if(!p.fecha_vencimiento) return true; return String(p.fecha_vencimiento).slice(0,10)>=new Date().toISOString().slice(0,10); }
function _nivelBadge(niv){ if(!niv) return ''; const c=POLIZA_NIVEL_COLOR[niv]||'#555'; return `<span class="chip" style="background:${c};color:#fff;font-size:10px;">🛡 ${niv} ${POLIZA_NIVEL_ETIQUETA[niv]||''}</span>`; }
const _nivOrden=niv=>niv?parseInt(String(niv).replace(/\D/g,''),10)||9:9;
// Flujo del servicio como tablero (CRM). Cada tarjeta avanza solo cuando se cumple su candado.
const ETAPAS=[
  {k:'SOLICITUD', t:'Solicitudes', ic:'📥', c:'#6B7280'},
  {k:'ASIGNADO',  t:'Asignados',   ic:'📅', c:'#2563EB'},
  {k:'EN_CURSO',  t:'En curso',    ic:'⚙️', c:'#7C3AED'},
  {k:'CONCLUIDO', t:'Concluidos (sin ticket)', ic:'✅', c:'#0D9488'},
  {k:'REPORTADO', t:'Reportados (sin ticket)', ic:'📝', c:'#D97706'},
  {k:'CERRADO',   t:'Cerrados (con ticket)',   ic:'🎫', c:'#16A34A'},
];
const ETAPA={}; ETAPAS.forEach(e=>ETAPA[e.k]=e);
// Estatus viejos → nuevos (compatibilidad con lo ya guardado)
const _MAPEST={POR_CONTACTAR:'ASIGNADO',EJECUTADO:'CONCLUIDO',REPORTE_PENDIENTE:'CONCLUIDO'};
const estEtapa=s=>{ const e=_MAPEST[s]||s; return ETAPA[e]?e:'ASIGNADO'; };
const _opsFechaMx=f=>{ if(!f) return ''; const p=String(f).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]:f; };
const _opsHora=h=>h?String(h).slice(0,5):'';
function _minTxt(min){ if(min==null) return ''; const h=Math.floor(min/60), m=min%60; return (h?h+'h ':'')+(m||!h?m+'m':''); }
function _estimMin(nombreServicio){ // intenta sacar minutos estimados del catálogo (tiempo_prom_txt)
  const s=(_opsCatAsig||[]).find(x=>x.nombre===nombreServicio); if(!s) return null;
  const t=(s.tiempo_prom_txt||s.tiempo_max_txt||'')+''; if(!t) return null;
  let tot=0; const ho=t.match(/(\d+)\s*h/i); const mi=t.match(/(\d+)\s*m/i);
  if(ho) tot+=parseInt(ho[1],10)*60; if(mi) tot+=parseInt(mi[1],10);
  if(!ho&&!mi){ const n=t.match(/\d+/); if(n) tot=parseInt(n[0],10); }
  return tot||null;
}
function _durMin(s){ // minutos reales entre inicio y fin (o hasta ahora si en curso)
  if(!s.inicio_real_at) return null;
  const ini=new Date(s.inicio_real_at).getTime();
  const fin=s.fin_real_at?new Date(s.fin_real_at).getTime():Date.now();
  return Math.max(0,Math.round((fin-ini)/60000));
}
// Cronómetro en vivo de los servicios "En curso" (se actualiza sin re-dibujar el tablero)
function _timerHtml(ini,est){
  if(!ini) return '<span style="color:#7C3AED;">⏱ en curso</span>';
  const d=Math.max(0,Math.round((Date.now()-new Date(ini).getTime())/60000));
  est=est?parseInt(est,10):null; const over=est&&d>est;
  return `<span style="color:${over?'#c0392b':'#7C3AED'};">⏱ ${_minTxt(d)} en curso${est?' / estim. '+_minTxt(est):''}${over?' ⚠️':''}</span>`;
}
function tickTiempos(){ try{ document.querySelectorAll('.enCursoTimer').forEach(el=>{ el.innerHTML=_timerHtml(el.dataset.ini,el.dataset.est); }); }catch(e){} }

async function renderAsignaciones(){
  const m=document.getElementById('mod');
  m.innerHTML=`<div class="loading"><div class="spinner"></div> Cargando tablero…</div>`;
  try{
    const [cat,ases,pend,asig,pol]=await Promise.all([
      _opsCatAsig.length?Promise.resolve({data:_opsCatAsig}):sb.from('operaciones_servicios_catalogo').select('*').eq('activo',true).order('orden').order('nombre'),
      sb.from('usuarios').select('id,nombre,rol').in('rol',['asesor','gerente_operaciones']).eq('activo',true).order('nombre'),
      sb.from('mesa_control_telegram_solicitudes').select('*').eq('estado','pendiente').order('created_at',{ascending:false}).limit(150),
      sb.from('servicios_ejecutados').select('*').order('fecha_asignada',{ascending:true,nullsFirst:false}).order('created_at',{ascending:false}).limit(400),
      sb.from('clientes_polizas').select('id,cliente_cartera_id,cliente_nombre,horas_totales,horas_consumidas,fecha_vencimiento,polizas_catalogo(nombre,prioridad_codigo,prioridad_nombre)').eq('estatus','VIGENTE')
    ]);
    _opsCatAsig=cat.data||_opsCatAsig; _asesores=ases.data||[]; _pendientes=pend.data||[]; _polVig=pol.data||[];
    // Jp y cualquier staff también pueden tomar servicios: se agregan como asesor seleccionable.
    if(userProfile&&!_asesores.some(a=>a.id===userProfile.id)) _asesores=[{id:userProfile.id,nombre:userProfile.nombre,rol:userProfile.rol},..._asesores];
    _asignaciones=(asig.data||[]).filter(s=>!s.ticket_cerrado||estEtapa(s.estatus)==='CERRADO');
  }catch(e){ m.innerHTML=`<div class="center" style="color:var(--red);">No se pudo cargar: ${esc(e.message||e)}</div>`; return; }
  pintarAsignaciones();
}
function _agCanalCorto(t){ t=t||''; if(/coordinacion/i.test(t)||/ventas-coord/i.test(t)) return 'Ventas-Coordinación'; if(/factura/i.test(t)) return 'Facturación'; if(/soporte/i.test(t)) return 'Coordinación Soporte'; return t.slice(0,32); }
function opsFiltrarTipo(v){ _opsFiltroTipo=v; pintarAsignaciones(); }
function opsActuarComo(v){ _actuarComo=v||null; pintarAsignaciones(); }

function pintarAsignaciones(){
  const m=document.getElementById('mod');
  // Vista: el asesor (real) ve solo sus servicios; staff puede "actuar como" un asesor para probar.
  const vistaAsesorId = esAsesor ? (userProfile&&userProfile.id) : _actuarComo;
  const tipoChip=s=>{ const ev=(s.tipo_flujo==='evento'); return `<span class="chip" style="background:${ev?'#F59E0B22':'#2563EB18'};color:${ev?'#B45309':'#2563EB'};font-size:10px;">${ev?'💵 Evento':'🛡 Póliza'}</span>`; };
  // Tarjeta de una SOLICITUD pendiente de Telegram
  const pendCard=p=>{
    const d=p.datos_extraidos||{};
    const pol=_polizaDe({cliente_nombre:d.cliente}); const niv=_nivelDe(pol);
    const bord=niv?`border-left:4px solid ${POLIZA_NIVEL_COLOR[niv]};`:'';
    return `<div class="card" style="padding:10px 12px;${bord}">
      <div style="display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap;">
        <span class="chip" style="background:var(--teal-bg);color:var(--teal);font-size:10px;">${esc(_agCanalCorto(p.telegram_chat_titulo))}</span>
        ${niv?_nivelBadge(niv):''}
        <span class="muted" style="font-size:10px;margin-left:auto;">${_opsFechaMx(p.created_at)}</span>
      </div>
      <div style="font-weight:700;font-size:13px;margin-top:5px;">${esc(d.cliente||'(sin cliente)')}</div>
      <div style="font-size:11.5px;color:var(--text2);margin-top:2px;line-height:1.4;">${esc((d.descripcion||p.texto_original||'').slice(0,160))}</div>
      ${esStaff?`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn" style="padding:5px 10px;font-size:11px;" onclick="abrirAsignar('${p.id}')">Asignar →</button>
        <button class="btn ghost" style="padding:5px 10px;font-size:11px;" onclick="descartarPendiente('${p.id}')">Descartar</button></div>`:''}
    </div>`;
  };
  // Acción principal de una tarjeta según su etapa (candado del flujo)
  const accion=s=>{
    const et=estEtapa(s.estatus);
    const b=(txt,fn,ghost)=>`<button class="btn${ghost?' ghost':''}" style="padding:5px 10px;font-size:11px;" onclick="event.stopPropagation();${fn}">${txt}</button>`;
    if(vistaAsesorId){ // vista del asesor: SOLO sus servicios, SOLO iniciar/finalizar/reportar
      if(s.asesor_id!==vistaAsesorId) return '';
      if(et==='ASIGNADO')  return b('▶ Iniciar',`avanzaEtapa('${s.id}','EN_CURSO')`);
      if(et==='EN_CURSO')  return b('⏹ Finalizar',`avanzaEtapa('${s.id}','CONCLUIDO')`);
      if(et==='CONCLUIDO') return b('📝 Subir reporte',`reportarServicio('${s.id}')`);
      return '';
    }
    if(esStaff){ // Mesa de Control: asignar y cerrar; NO iniciar/finalizar (eso es del asesor)
      if(!s.asesor_id && et!=='CERRADO') return b('Asignar →',`abrirAsignarServ('${s.id}')`); // sin asesor (p.ej. alerta de resguardo) → asignar
      if(et==='SOLICITUD') return b('Asignar →',`abrirAsignarServ('${s.id}')`);
      if(et==='REPORTADO') return b('🎫 Cerrar con ticket',`cerrarConTicket('${s.id}')`);
      return '';
    }
    return '';
  };
  // Tarjeta de un servicio (servicios_ejecutados)
  const servCard=s=>{
    const et=estEtapa(s.estatus);
    let extra='';
    if(et==='ASIGNADO'){ const prog=s.fecha_asignada&&(s.fecha_asignada+'T'+(_opsHora(s.hora_asignada)||'00:00'))<=new Date().toISOString().slice(0,16); if(prog) extra=`<div style="font-size:11px;color:#B45309;font-weight:700;margin-top:3px;">⏰ Es hora</div>`; }
    if(et==='EN_CURSO'){ const est=_estimMin(s.tipo_servicio); extra=`<div class="enCursoTimer" data-ini="${s.inicio_real_at||''}" data-est="${est||''}" style="font-size:11px;margin-top:3px;font-weight:700;">${_timerHtml(s.inicio_real_at,est)}</div>`; }
    if(et==='CONCLUIDO'||et==='REPORTADO'||et==='CERRADO'){ const d=_durMin(s); if(d!=null){ const est=_estimMin(s.tipo_servicio); extra=`<div style="font-size:11px;margin-top:3px;color:${est&&d>est?'#c0392b':'var(--text2)'};">⏱ duró ${_minTxt(d)}${est&&d>est?' (excedió '+_minTxt(est)+') ⚠️':''}</div>`; } }
    const pol=_polizaDe(s); const niv=_nivelDe(pol);
    const bord=niv?`border-left:4px solid ${POLIZA_NIVEL_COLOR[niv]};`:'';
    return `<div class="card" style="padding:10px 12px;cursor:pointer;${bord}" onclick="abrirAsignacion('${s.id}')">
      <div style="display:flex;justify-content:space-between;gap:6px;align-items:flex-start;flex-wrap:wrap;">
        <span style="font-weight:700;font-size:13px;">${esc(s.cliente_nombre||'Sin cliente')}</span>
        <span style="display:flex;gap:4px;flex-wrap:wrap;">${niv?_nivelBadge(niv):''}${tipoChip(s)}</span>
      </div>
      <div style="font-size:11.5px;color:var(--text2);margin-top:2px;">${esc(s.tipo_servicio||'(servicio sin definir)')}</div>
      <div class="muted" style="margin-top:3px;font-size:11px;">🧑‍🔧 ${esc(s.asesor_nombre||'sin asesor')}${s.fecha_asignada?' · 📅 '+_opsFechaMx(s.fecha_asignada)+(s.hora_asignada?' '+_opsHora(s.hora_asignada):''):''}</div>
      ${extra}
      ${et==='CERRADO'&&s.folio_ticket?`<div style="font-size:11px;color:#16A34A;margin-top:3px;">🎫 Folio ${esc(s.folio_ticket)}</div>`:''}
      ${accion(s)?`<div style="margin-top:8px;">${accion(s)}</div>`:''}
    </div>`;
  };
  // Filtro por tipo
  const pasaTipo=s=>_opsFiltroTipo==='todo'||(s.tipo_flujo||'poliza')===_opsFiltroTipo;
  const pasaVista=s=>!vistaAsesorId||s.asesor_id===vistaAsesorId;
  const asigPorEtapa={}; ETAPAS.forEach(e=>asigPorEtapa[e.k]=[]);
  (_asignaciones||[]).filter(s=>pasaTipo(s)&&pasaVista(s)).forEach(s=>{ asigPorEtapa[estEtapa(s.estatus)].push(s); });
  asigPorEtapa['SOLICITUD'].sort((a,b)=>_nivOrden(_nivelDe(_polizaDe(a)))-_nivOrden(_nivelDe(_polizaDe(b))));
  // Solicitudes de Telegram: se ordenan por prioridad de póliza (N1 primero), luego por fecha.
  const pendVis=(vistaAsesorId||_opsFiltroTipo==='evento')?[]:[..._pendientes].sort((a,b)=>{
    const na=_nivOrden(_nivelDe(_polizaDe({cliente_nombre:(a.datos_extraidos||{}).cliente})));
    const nb=_nivOrden(_nivelDe(_polizaDe({cliente_nombre:(b.datos_extraidos||{}).cliente})));
    return na!==nb ? na-nb : (b.created_at||'').localeCompare(a.created_at||'');
  });
  // Columnas
  const col=e=>{
    const cards = e.k==='SOLICITUD' ? [...pendVis.map(pendCard), ...asigPorEtapa[e.k].map(servCard)] : asigPorEtapa[e.k].map(servCard);
    const n = (e.k==='SOLICITUD'?pendVis.length:0)+asigPorEtapa[e.k].length;
    return `<div style="flex:0 0 240px;min-width:240px;background:var(--surf2);border-radius:12px;padding:8px;">
      <div style="display:flex;align-items:center;gap:6px;padding:4px 6px 8px;position:sticky;top:0;">
        <span style="font-size:14px;">${e.ic}</span>
        <span style="font-weight:800;font-size:12px;color:${e.c};">${e.t}</span>
        <span class="chip" style="margin-left:auto;background:${e.c}1a;color:${e.c};font-size:10px;">${n}</span>
      </div>
      <div style="display:grid;gap:8px;">${cards.join('')||'<div class="muted" style="text-align:center;font-size:11px;padding:10px 0;">—</div>'}</div>
    </div>`;
  };
  const fchip=(v,t)=>`<button class="btn${_opsFiltroTipo===v?'':' ghost'}" style="padding:4px 12px;font-size:12px;" onclick="opsFiltrarTipo('${v}')">${t}</button>`;
  const selAsesor = esStaff ? `<select class="inp" style="width:auto;padding:5px 9px;font-size:12px;" onchange="opsActuarComo(this.value)">
      <option value="">👁 Vista Mesa de Control</option>
      ${(_asesores||[]).map(a=>`<option value="${a.id}" ${_actuarComo===a.id?'selected':''}>🧑‍🔧 Ver como ${esc(a.nombre)}</option>`).join('')}
    </select>` : '';
  const nombreAct = _actuarComo ? ((_asesores||[]).find(a=>a.id===_actuarComo)||{}).nombre : '';
  m.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
        ${fchip('todo','Todo')}${fchip('poliza','🛡 Póliza')}${fchip('evento','💵 Evento')}
        ${selAsesor}
        <button class="btn ghost" style="padding:4px 10px;font-size:12px;" onclick="renderAsignaciones()" title="Refresca el tiempo transcurrido y trae solicitudes nuevas">↻ Actualizar tiempos</button>
      </div>
      ${(esStaff&&!vistaAsesorId)?`<div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn ghost" id="btnSyncTickets" onclick="opsSyncTickets()" title="Trae los tickets nuevos de 123FormBuilder">↻ Sincronizar tickets</button>
        <button class="btn" onclick="abrirAsignar(null)">＋ Nueva</button>
      </div>`:''}

async function guardarAsignacion(pendId, servId){
  const g=i=>document.getElementById(i)?.value.trim();
  const msg=document.getElementById('agMsg');
  const err=t=>{ if(msg) msg.innerHTML='<span style="color:var(--red);font-weight:600;">'+t+'</span>'; };
  const cliente=g('agCliente'), servicio=g('agServicio'), asesorId=g('agAsesor'), fecha=g('agFecha');
  if(!cliente) return err('El cliente es obligatorio.');
  if(!servicio) return err('Elige el servicio del catálogo.');
  if(!asesorId) return err('Elige al asesor.');
  if(!fecha) return err('Pon la fecha de la asignación.');
  const tipo=g('agTipo')||'poliza';
  const polId=g('agPolId'), carteraId=g('agCarteraId');
  // Antes de asignar un servicio de póliza: debe haber póliza vigente y con horas disponibles.
  if(tipo==='poliza'){
    const pol=polId?(_polVig||[]).find(x=>x.id===polId):null;
    if(!pol){ if(!confirm('Este cliente no tiene una póliza vigente ligada. ¿Asignar de todos modos?')) return; }
    else{
      if(!_polVigente(pol)){ if(!confirm('La póliza de este cliente está VENCIDA (venció el '+_opsFechaMx(pol.fecha_vencimiento)+'). ¿Asignar de todos modos?')) return; }
      const rest=_horasRest(pol), est=_estimMin(servicio);
      if(rest!=null&&est&&rest*60<est){ if(!confirm('La póliza solo tiene '+rest+' h disponibles y este servicio estima '+_minTxt(est)+'. ¿Asignar de todos modos?')) return; }
    }
  }
  const ases=(_asesores||[]).find(a=>a.id===asesorId);
  const fila={
    tipo_flujo:tipo,
    cliente_nombre:cliente, tipo_servicio:servicio, descripcion_solicitud:g('agDesc')||null,
    asesor_id:asesorId, asesor_nombre:ases?ases.nombre:null,
    fecha_asignada:fecha, hora_asignada:g('agHora')||null,
    estatus:'ASIGNADO', solicitado_por:g('agContacto')||null,
    contacto_telefono:g('agTel')||null, contacto_preferido:g('agPref')||null, nota:g('agNota')||null,
    cliente_poliza_id:polId||null, cliente_cartera_id:carteraId||null
  };
  const btn=document.getElementById('agGuardar'); if(btn){btn.disabled=true;btn.textContent='Guardando…';}
  let error,nuevo;
  if(servId){ ({data:nuevo,error}=await sb.from('servicios_ejecutados').update(fila).eq('id',servId).select().single()); }
  else{ fila.fecha_solicitud=new Date().toISOString(); ({data:nuevo,error}=await sb.from('servicios_ejecutados').insert(fila).select().single()); }
  if(error){ if(btn){btn.disabled=false;btn.textContent='Asignar';} return err('No se pudo guardar: '+esc(error.message)); }
  if(pendId){ try{ await sb.from('mesa_control_telegram_solicitudes').update({estado:'asignado',servicio_ejecutado_id:nuevo.id,procesado_por:userProfile.id,procesado_at:new Date().toISOString()}).eq('id',pendId); }catch(_){} }
  // Aviso al asesor por Telegram (best-effort)
  try{
    const {data:sess}=await sb.auth.getSession();
    fetch('/api/operaciones-avisar-asesor',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(sess?.session?.access_token||'')},body:JSON.stringify({servicio_id:nuevo.id,reenviar:!!servId})})
      .then(x=>x.json()).then(j=>{ if(j.ok&&!j.yaEnviado) opsToast('Asignado ✓ y avisado al asesor',true); else if(!j.ok) opsToast('Asignado ✓. No se pudo avisar: '+(j.error||'—'),false); try{renderAsignaciones();}catch(_){} }).catch(()=>{});
  }catch(_){}
  cerrarModal(); renderAsignaciones();
}
// Avanzar de etapa (candado del flujo): fija el estatus y los tiempos que correspondan.
async function avanzaEtapa(id,destino){
  const s=(_asignaciones||[]).find(x=>x.id===id); if(!s) return;
  // Permitido: staff (Mesa/Dirección) o el asesor asignado a este servicio.
  if(!(esStaff || (userProfile && s.asesor_id===userProfile.id))) return;
  if(destino!=='SOLICITUD' && !s.asesor_id){ opsToast('Primero asigna un asesor a este servicio.',false); return; }
  const patch={estatus:destino,updated_at:new Date().toISOString()};
  if(destino==='EN_CURSO'&&!s.inicio_real_at) patch.inicio_real_at=new Date().toISOString();
  if(destino==='CONCLUIDO'){ if(!s.fin_real_at) patch.fin_real_at=new Date().toISOString();
    const ini=s.inicio_real_at?new Date(s.inicio_real_at).getTime():null;
    if(ini) patch.duracion_real_min=Math.max(0,Math.round((Date.now()-ini)/60000)); }
  if(destino==='REPORTADO'&&!s.reportado_at) patch.reportado_at=new Date().toISOString();
  try{ await sb.from('servicios_ejecutados').update(patch).eq('id',id); }catch(e){ opsToast('No se pudo: '+(e.message||e),false); return; }
  // Aviso de tiempo excedido (Parte 3: alerta formal a Mesa; por ahora, aviso visible)
  if(destino==='CONCLUIDO'){ const est=_estimMin(s.tipo_servicio); const dur=patch.duracion_real_min; if(est&&dur&&dur>est) opsToast(`⚠️ ${s.cliente_nombre}: duró ${_minTxt(dur)} (estimado ${_minTxt(est)}). Revisa el reporte del asesor.`,false); }
  opsToast('Movido a '+(ETAPA[destino]?ETAPA[destino].t:destino),true);
  renderAsignaciones();
}

      <div><div style="font-size:16px;font-weight:800;">${esc(s.cliente_nombre||'Sin cliente')} <span class="chip" style="background:${s.tipo_flujo==='evento'?'#F59E0B22':'#2563EB18'};color:${s.tipo_flujo==='evento'?'#B45309':'#2563EB'};font-size:11px;">${s.tipo_flujo==='evento'?'💵 Evento':'🛡 Póliza'}</span> ${nivD?_nivelBadge(nivD):''}</div>
      ${polD?`<div class="muted" style="margin-top:2px;">${esc(polD.polizas_catalogo?polD.polizas_catalogo.nombre:'')} · ${_polVigente(polD)?'vigente':'⚠️ vencida'} · ⏱ ${restD!=null?restD+' h disp.':'—'}</div>`:''}
      <div class="muted">${esc(s.tipo_servicio||'(servicio sin definir)')}</div></div>
      <span class="chip" style="background:${e.c}1a;color:${e.c};">${e.ic} ${e.t}</span>
    </div>
    <div style="margin-top:10px;display:flex;gap:4px;flex-wrap:wrap;">${pasos}</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:var(--surf2);border-radius:10px;">
      <div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;">Asesor</div><div style="font-weight:700;">${esc(s.asesor_nombre||'—')}</div></div>
      <div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;">Programado</div><div style="font-weight:700;">${fechaMx(s.fecha_asignada)}${s.hora_asignada?' · '+String(s.hora_asignada).slice(0,5):''}</div></div>
      <div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;">Contacto</div><div style="font-weight:700;">${esc(s.solicitado_por||'—')}${s.contacto_telefono?' · '+esc(s.contacto_telefono):''}${s.contacto_preferido?' · '+esc(s.contacto_preferido):''}</div></div>
      ${dur!=null?`<div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;">Duración</div><div style="font-weight:700;color:${est&&dur>est?'#c0392b':'var(--text)'};">${_minTxt(dur)}${est?' / est. '+_minTxt(est):''}${est&&dur>est?' ⚠️':''}</div></div>`:''}
      ${s.folio_ticket?`<div><div style="font-size:10px;color:var(--text3);text-transform:uppercase;">Ticket</div><div style="font-weight:700;color:#16A34A;">🎫 ${esc(s.folio_ticket)}</div></div>`:''}
    </div>
    ${s.descripcion_solicitud?`<div style="margin-top:12px;"><div style="font-size:11px;font-weight:700;color:var(--text2);">Lo solicitado</div><div style="font-size:13px;white-space:pre-wrap;line-height:1.5;margin-top:3px;">${esc(s.descripcion_solicitud)}</div></div>`:''}
    ${s.nota?`<div style="margin-top:10px;"><div style="font-size:11px;font-weight:700;color:var(--text2);">Nota para el asesor</div><div style="font-size:13px;white-space:pre-wrap;line-height:1.5;margin-top:3px;">${esc(s.nota)}</div></div>`:''}
    ${s.trabajo_realizado?`<div style="margin-top:12px;padding:8px 10px;background:#0D948815;border-radius:8px;"><div style="font-size:11px;font-weight:700;color:#0D9488;">📝 Reporte del asesor</div><div style="font-size:13px;white-space:pre-wrap;line-height:1.5;margin-top:3px;">${esc(s.trabajo_realizado)}${s.comentarios_asesor?'\n\nObs: '+esc(s.comentarios_asesor):''}</div></div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center;">
      ${accDet()}
      <button class="btn ghost" onclick="cerrarModal()">Cerrar</button>
    </div>
    ${(esStaff&&!vistaAsesorId)?`
    <div style="margin-top:12px;padding:8px 10px;background:var(--surf2);border-radius:8px;font-size:12px;">
      ${s.aviso_asesor_at
        ?`✈️ <b>Avisado al asesor</b> · ${fechaMx(s.aviso_asesor_at)} <button class="btn ghost" style="padding:3px 10px;font-size:11px;margin-left:6px;" onclick="opsAvisarAsesor('${s.id}',true)">↻ Reenviar</button>`
        :`<span style="color:#B45309;">✈️ Aún no se avisa al asesor</span> <button class="btn" style="padding:3px 10px;font-size:11px;margin-left:6px;" onclick="opsAvisarAsesor('${s.id}',false)">Avisar al asesor</button>`}
    </div>
    <details style="margin-top:10px;"><summary style="font-size:11px;color:var(--text3);cursor:pointer;">Corregir etapa (solo para pruebas / errores)</summary>
      <div style="display:flex;gap:8px;margin-top:6px;align-items:center;"><select class="inp" id="aeEst" style="max-width:220px;">${opcCorr}</select>
      <button class="btn ghost" style="font-size:11px;" onclick="guardarEstatusAsig('${s.id}')">Aplicar</button></div></details>`:''}`);
}
async function guardarEstatusAsig(id){
  const est=document.getElementById('aeEst')?.value; if(!est) return;
  try{ await sb.from('servicios_ejecutados').update({estatus:est,updated_at:new Date().toISOString()}).eq('id',id); }catch(e){ alert('No se pudo: '+(e.message||e)); return; }
  cerrarModal(); renderAsignaciones();
}

// ─── Modal genérico ─────────────────────────────────────────────────────────
function mostrarModal(html){
  cerrarModal();
  const d=document.createElement('div'); d.className='modal'; d.id='opsModal';
  d.innerHTML=`<div class="box">${html}</div>`;
  d.addEventListener('click',e=>{ if(e.target===d) cerrarModal(); });
  document.body.appendChild(d);
}
function cerrarModal(){ document.getElementById('opsModal')?.remove(); }

arrancar();
</script>
</body>
</html>
