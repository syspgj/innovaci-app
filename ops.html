<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovaci OS · Operaciones</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Mismo lenguaje visual que la app principal (index.html) — Jp, 2026-11-19.
   Fase 0 del plan de Mesa de Control: módulo en su propio HTML para no
   sobrecargar index.html. Comparte la sesión de Supabase por ser el mismo
   dominio; no vuelve a pedir login. */
:root{
  --navy:#0D2240;--navy2:#132C52;--teal:#00A99D;--teal-d:#00877E;--teal-bg:rgba(0,169,157,0.1);--teal-b:rgba(0,169,157,0.25);
  --gold:#F5A623;--gold-bg:rgba(245,166,35,0.1);--gold-b:rgba(245,166,35,0.25);
  --red:#E84040;--red-bg:rgba(232,64,64,0.08);--red-b:rgba(232,64,64,0.25);--green:#27AE60;--green-bg:rgba(39,174,96,0.1);
  --bg:#EEF2F7;--surface:#fff;--surf2:#F7FAFC;
  --text:#0D2240;--text2:#4A6080;--text3:#8BA0B8;
  --border:rgba(13,34,64,0.08);--rad:16px;--radsm:10px;--radpill:999px;
  --shadow-sm:0 1px 2px rgba(13,34,64,0.05),0 1px 3px rgba(13,34,64,0.06);
  --shadow-md:0 2px 6px rgba(13,34,64,0.06),0 8px 24px rgba(13,34,64,0.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,Arial,sans-serif;font-size:14px;}
a{color:var(--teal);}
.topbar{background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;}
.topbar .brand small{font-weight:500;color:rgba(255,255,255,.6);font-size:12px;}
.topbar .right{display:flex;align-items:center;gap:10px;font-size:12px;}
.topbar a.app{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;font-weight:600;}
.topbar .av{width:30px;height:30px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px;}
.tab{padding:7px 14px;border-radius:var(--radpill);border:1px solid var(--border);background:#fff;color:var(--text2);font-size:12.5px;font-weight:600;cursor:pointer;}
.tab.active{background:var(--teal);color:#fff;border-color:var(--teal);}
.tab.soon{opacity:.55;cursor:default;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);box-shadow:var(--shadow-sm);}
.btn{background:var(--teal);color:#fff;border:none;border-radius:var(--radsm);padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn.ghost{background:#fff;color:var(--text2);border:1px solid var(--border);font-weight:600;}
.btn.navy{background:var(--navy);}
.inp{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--radsm);font-size:13px;font-family:inherit;color:var(--text);box-sizing:border-box;background:#fff;}
textarea.inp{min-height:62px;resize:vertical;}
label.fld{display:block;margin-bottom:10px;}
label.fld>span{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:600;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;border-radius:var(--radpill);padding:2px 9px;}
.loading{display:flex;align-items:center;gap:10px;color:var(--text3);padding:40px;justify-content:center;}
.spinner{width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
.modal .box{background:#fff;border-radius:var(--rad);max-width:680px;width:100%;max-height:92vh;overflow-y:auto;padding:22px 24px;}
.svc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
.svc:hover{background:var(--surf2);}
.svc:last-child{border-bottom:none;}
.svc .nom{font-weight:700;font-size:13.5px;color:var(--text);}
.svc .meta{font-size:11px;color:var(--text3);margin-top:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
@media(max-width:560px){.grid2{grid-template-columns:1fr;}}
.muted{color:var(--text3);font-size:12px;}
.center{text-align:center;padding:50px 20px;color:var(--text3);}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">🛠 Innovaci OS <small>· Operaciones</small></div>
  <div class="right" id="topRight"></div>
</div>
<div class="wrap" id="root">
  <div class="loading"><div class="spinner"></div> Cargando…</div>
</div>

<script>
// ─── Conexión (misma que la app principal; sesión compartida por dominio) ───
const SURL='https://ydwouspzneacxfixlmmv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd291c3B6bmVhY3hmaXhsbW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzA5MzAsImV4cCI6MjA5NjkwNjkzMH0.uWB1VN2YT7ynTbHmfTWCOBHMRR54LdHJook7iOk7Mug';
const sb=supabase.createClient(SURL,SKEY);

// Roles que entran a Operaciones. El asesor (Soporte) entra en modo lectura.
const ROLES_OPS=['director','mesa_control','gerente_operaciones','administracion','asesor'];
let userProfile=null, esStaff=false, _servicios=[], _busca='';

function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function tiempoTxt(min){ if(min==null||min==='') return '—'; min=+min; if(min<60) return min+' min'; const h=Math.floor(min/60),m=min%60; return h+'h'+(m?' '+m+'m':''); }

async function arrancar(){
  const root=document.getElementById('root');
  const {data:sessData}=await sb.auth.getSession();
  if(!sessData||!sessData.session){
    root.innerHTML=`<div class="center card" style="padding:50px 24px;">
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px;">Inicia sesión primero</div>
      <div class="muted" style="margin-bottom:16px;">Esta es el área de Operaciones de Innovaci OS. Entra en la app principal y desde ahí se abre aquí.</div>
      <a class="btn" href="/" style="text-decoration:none;display:inline-block;">Ir a la app principal</a></div>`;
    return;
  }
  const uid=sessData.session.user.id;
  const {data:prof}=await sb.from('usuarios').select('*').eq('id',uid).maybeSingle();
  if(!prof){ root.innerHTML=`<div class="center">No encontré tu perfil de usuario. Avisa a Dirección.</div>`; return; }
  userProfile=prof;
  if(!ROLES_OPS.includes(prof.rol)){
    root.innerHTML=`<div class="center card" style="padding:50px 24px;">
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px;">Esta área es de Operaciones</div>
      <div class="muted" style="margin-bottom:16px;">Tu usuario (${esc(prof.rol)}) no tiene acceso a Mesa de Control. Si crees que debería, avisa a Dirección.</div>
      <a class="btn ghost" href="/" style="text-decoration:none;display:inline-block;">Volver a la app</a></div>`;
    return;
  }
  esStaff=['director','mesa_control','gerente_operaciones','administracion'].includes(prof.rol);
  document.getElementById('topRight').innerHTML=`
    <a class="app" href="/">← App principal</a>
    <span>${esc(prof.nombre||'')}</span>
    <span class="av">${esc((prof.nombre||'?').substring(0,2).toUpperCase())}</span>`;
  pintarShell();
  renderCatalogo();
}

function pintarShell(){
  document.getElementById('root').innerHTML=`
    <div class="tabs">
      <div class="tab active">🧾 Catálogo de servicios</div>
      <div class="tab soon" title="Próxima fase">📅 Asignaciones</div>
      <div class="tab soon" title="Próxima fase">🎫 Tickets</div>
    </div>
    <div class="muted" style="margin:2px 0 14px;">Asignaciones y Tickets llegan en las siguientes fases del plan. Hoy: el catálogo que es cimiento de todo.</div>
    <div id="mod"></div>`;
}

// ─── Catálogo de servicios de operación ─────────────────────────────────────
async function renderCatalogo(){
  const m=document.getElementById('mod');
  m.innerHTML=`<div class="loading"><div class="spinner"></div> Cargando catálogo…</div>`;
  const {data,error}=await sb.from('operaciones_servicios_catalogo').select('*').order('activo',{ascending:false}).order('orden').order('nombre');
  if(error){ m.innerHTML=`<div class="center" style="color:var(--red);">No se pudo cargar: ${esc(error.message)}</div>`; return; }
  _servicios=data||[];
  pintarCatalogo();
}
function pintarCatalogo(){
  const m=document.getElementById('mod');
  const q=_busca.trim().toLowerCase();
  let lista=_servicios;
  if(q) lista=_servicios.filter(s=>[s.nombre,s.codigo,s.categoria,s.aplica_poliza].join(' ').toLowerCase().includes(q));
  m.innerHTML=`
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">
      <div style="flex:1;min-width:200px;">
        <div style="font-size:15px;font-weight:700;">Catálogo de servicios</div>
        <div class="muted">${_servicios.length} servicio${_servicios.length===1?'':'s'} · de aquí salen los requisitos y el tiempo aproximado de cada uno.</div>
      </div>
      <input class="inp" style="flex:0 0 220px;max-width:240px;" placeholder="🔍 Buscar servicio…" value="${esc(_busca)}" oninput="_busca=this.value;pintarCatalogo()">
      ${esStaff?`<button class="btn" onclick="editarServicio(null)">＋ Nuevo servicio</button>`:''}
    </div>
    <div class="card">
      ${lista.length?lista.map(filaServicio).join(''):'<div class="center">'+(q?'Sin coincidencias.':'Aún no hay servicios en el catálogo.'+(esStaff?' Empieza con “＋ Nuevo servicio”.':''))+'</div>'}
    </div>`;
}
function filaServicio(s){
  const t=tiempoTxt(s.tiempo_aprox_min);
  return `<div class="svc" onclick="verServicio('${s.id}')">
    <div style="flex:1;min-width:0;">
      <div class="nom">${esc(s.nombre)}${s.activo?'':' <span class="chip" style="background:var(--red-bg);color:var(--red);">inactivo</span>'}</div>
      <div class="meta">${s.categoria?esc(s.categoria)+' · ':''}${s.aplica_poliza?'Póliza: '+esc(s.aplica_poliza)+' · ':''}⏱ ${t}${s.codigo?' · '+esc(s.codigo):''}</div>
    </div>
    <div style="color:var(--text3);font-size:12px;white-space:nowrap;">ver →</div>
  </div>`;
}

// Detalle en segundo nivel (UX: entrada básica, detalle al abrir).
function verServicio(id){
  const s=_servicios.find(x=>x.id===id); if(!s) return;
  const bloque=(t,v)=>v?`<div style="margin-top:10px;"><div style="font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;">${t}</div><div style="font-size:13px;color:var(--text);margin-top:2px;white-space:pre-wrap;">${esc(v)}</div></div>`:'';
  mostrarModal(`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
      <div>
        <div style="font-size:16px;font-weight:800;">${esc(s.nombre)}</div>
        <div class="muted">${s.categoria?esc(s.categoria)+' · ':''}${s.aplica_poliza?'Aplica a póliza: '+esc(s.aplica_poliza)+' · ':''}⏱ ${tiempoTxt(s.tiempo_aprox_min)}${s.codigo?' · '+esc(s.codigo):''}</div>
      </div>
      <button class="btn ghost" onclick="cerrarModal()" style="padding:5px 10px;">✕</button>
    </div>
    ${bloque('Descripción',s.descripcion)}
    ${bloque('Requisitos del cliente',s.requisitos_cliente)}
    ${bloque('Requisitos del asesor',s.requisitos_asesor)}
    ${bloque('Consideraciones para Ventas',s.consideraciones_ventas)}
    <div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;">
      ${esStaff?`<button class="btn" onclick="editarServicio('${s.id}')">✏️ Editar</button>`:''}
      <button class="btn ghost" onclick="cerrarModal()">Cerrar</button>
    </div>`);
}

// Alta / edición (solo staff).
function editarServicio(id){
  const s=id?_servicios.find(x=>x.id===id):{};
  if(!esStaff) return;
  mostrarModal(`
    <div style="font-size:16px;font-weight:800;margin-bottom:12px;">${id?'Editar servicio':'Nuevo servicio'}</div>
    <label class="fld"><span>Nombre del servicio *</span><input class="inp" id="svNombre" value="${esc(s.nombre||'')}" placeholder="Ej. Respaldo y restauración de base NOI"></label>
    <div class="grid2">
      <label class="fld"><span>Categoría</span><input class="inp" id="svCat" value="${esc(s.categoria||'')}" placeholder="NOI / COI / SAE / Resguardo / General"></label>
      <label class="fld"><span>Código (opcional)</span><input class="inp" id="svCod" value="${esc(s.codigo||'')}" placeholder="NOI-RESP"></label>
      <label class="fld"><span>Aplica a póliza</span><input class="inp" id="svPol" value="${esc(s.aplica_poliza||'')}" placeholder="Infinito / Profesionista / Resguardo…"></label>
      <label class="fld"><span>Tiempo aproximado (minutos)</span><input class="inp" id="svTiempo" type="number" min="0" value="${s.tiempo_aprox_min!=null?s.tiempo_aprox_min:''}" placeholder="60"></label>
    </div>
    <label class="fld"><span>Descripción (base del entregable al cliente)</span><textarea class="inp" id="svDesc" placeholder="En qué consiste el servicio, en lenguaje claro.">${esc(s.descripcion||'')}</textarea></label>
    <label class="fld"><span>Requisitos del cliente</span><textarea class="inp" id="svReqCli" placeholder="Qué debe tener listo el cliente (accesos, respaldos previos, etc.).">${esc(s.requisitos_cliente||'')}</textarea></label>
    <label class="fld"><span>Requisitos del asesor</span><textarea class="inp" id="svReqAse" placeholder="Qué debe preparar o llevar el asesor.">${esc(s.requisitos_asesor||'')}</textarea></label>
    <label class="fld"><span>Consideraciones para Ventas</span><textarea class="inp" id="svVen" placeholder="Qué debe saber Ventas al ofrecer o agendar este servicio.">${esc(s.consideraciones_ventas||'')}</textarea></label>
    <label style="display:flex;align-items:center;gap:7px;font-size:13px;margin:4px 0 14px;cursor:pointer;"><input type="checkbox" id="svActivo" ${s.activo===false?'':'checked'}> Activo</label>
    <div id="svMsg" style="font-size:12px;margin-bottom:8px;"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" id="svGuardar" onclick="guardarServicio('${id||''}')">Guardar</button>
      <button class="btn ghost" onclick="cerrarModal()">Cancelar</button>
    </div>`);
}
async function guardarServicio(id){
  const v=i=>document.getElementById(i)?.value.trim();
  const nombre=v('svNombre');
  const msg=document.getElementById('svMsg');
  if(!nombre){ msg.innerHTML='<span style="color:var(--red);font-weight:600;">El nombre es obligatorio.</span>'; return; }
  const tiempoRaw=v('svTiempo');
  const fila={
    nombre,
    categoria:v('svCat')||null, codigo:v('svCod')||null, aplica_poliza:v('svPol')||null,
    tiempo_aprox_min:tiempoRaw!==''?parseInt(tiempoRaw,10):null,
    descripcion:v('svDesc')||null, requisitos_cliente:v('svReqCli')||null,
    requisitos_asesor:v('svReqAse')||null, consideraciones_ventas:v('svVen')||null,
    activo:document.getElementById('svActivo').checked, updated_at:new Date().toISOString()
  };
  const btn=document.getElementById('svGuardar'); btn.disabled=true; btn.textContent='Guardando…';
  let error;
  if(id){ ({error}=await sb.from('operaciones_servicios_catalogo').update(fila).eq('id',id)); }
  else  { ({error}=await sb.from('operaciones_servicios_catalogo').insert(fila)); }
  if(error){ btn.disabled=false; btn.textContent='Guardar'; msg.innerHTML=`<span style="color:var(--red);font-weight:600;">No se pudo guardar: ${esc(error.message)}</span>`; return; }
  cerrarModal();
  renderCatalogo();
}

// ─── Modal genérico ─────────────────────────────────────────────────────────
function mostrarModal(html){
  cerrarModal();
  const d=document.createElement('div'); d.className='modal'; d.id='opsModal';
  d.innerHTML=`<div class="box">${html}</div>`;
  d.addEventListener('click',e=>{ if(e.target===d) cerrarModal(); });
  document.body.appendChild(d);
}
function cerrarModal(){ document.getElementById('opsModal')?.remove(); }

arrancar();
</script>
</body>
</html>
