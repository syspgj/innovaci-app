<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* Paleta tomada de la insignia de marca de Círculo Innovaci (171026) */
  --navy:#0b1f33; --navy2:#0b3b5c; --teal:#12b3a8; --teal2:#0e8d85;
  --brand-blue:#1a7bc4; --gold:#f0b65c;
  --border:#e7ebee; --text2:#5c6b77; --text3:#9aa6b0; --bg:#eef1f4;
  --green:#1f8a5f; --greenbg:#e9f8f0; --amber:#b4791f; --amberbg:#fbf1e2;
  --red:#b4441f; --redbg:#fdecea;
}
.brandlogo{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.brandlogo img{width:36px;height:36px;border-radius:9px;}
.brandlogo .tagline{margin-bottom:0;}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;max-width:560px;}
.teaser{display:flex;gap:10px;margin-bottom:24px;}
.teaser div{flex:1;background:#f8f9fa;border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;font-size:11px;color:var(--text2);font-weight:700;}
.wrap.expanded{max-width:720px;}
.card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;box-shadow:0 1px 2px rgba(16,24,32,.04),0 12px 32px -16px rgba(16,24,32,.14);}
.tagline{font-size:12px;color:var(--teal2);margin-bottom:26px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
h1{font-size:18px;font-weight:800;margin-bottom:7px;}
.sub{font-size:13px;color:var(--text2);margin-bottom:22px;line-height:1.55;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;}
.field input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:'Manrope',sans-serif;outline:none;}
.field input#fCodigo{text-transform:uppercase;letter-spacing:.08em;}
.field input:focus{border-color:var(--teal);}
.btn{width:100%;padding:13px;background:var(--teal);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn:disabled{opacity:.6;cursor:default;}
.bad{color:var(--red);font-weight:600;font-size:13px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.foot{font-size:11px;color:var(--text3);margin-top:22px;text-align:center;}

.result-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,32,.04),0 12px 32px -16px rgba(16,24,32,.14);}
.result-topbar{height:5px;width:100%;background:linear-gradient(90deg,var(--navy2) 0%,var(--teal) 100%);}
.result-head{padding:32px 36px 22px;}
.result-brand{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.1em;text-transform:uppercase;}
.result-name{font-size:24px;font-weight:800;margin-top:6px;}
.result-sub{font-size:14px;font-weight:700;color:var(--teal2);margin-top:4px;}
.badge{display:inline-block;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:700;margin-top:10px;}
.badge.activa{background:var(--greenbg);color:var(--green);}
.badge.revision{background:var(--amberbg);color:var(--amber);}
.badge.suspendida,.badge.vencida{background:var(--redbg);color:var(--red);}
.result-body{padding:0 36px 32px;display:flex;flex-direction:column;gap:18px;}
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;}
.panel{background:#f8f9fa;border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.stat .k{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:4px;}
.stat .v{font-size:14px;font-weight:700;}
.list-item{font-size:13px;color:var(--navy);padding:8px 0;border-top:1px solid #eef1f3;}
.list-item:first-child{border-top:none;}
.list-item small{display:block;color:var(--text3);font-weight:500;margin-top:2px;}
.cta{display:block;text-align:center;background:var(--navy);color:#fff;text-decoration:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;}
.aviso{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;}
.dias{display:flex;align-items:baseline;gap:8px;}
.dias .n{font-size:28px;font-weight:800;}
.dias .n.warn{color:var(--amber);}
.dias .n.red{color:var(--red);}
.dias .t{font-size:12px;color:var(--text2);}
.beneficio{font-size:13px;color:var(--navy);padding:6px 0;display:flex;gap:8px;}
.beneficio::before{content:'✓';color:var(--teal2);font-weight:800;}
.solicitud{border-top:1px solid var(--border);padding:16px 0;}
.solicitud:first-child{padding-top:0;border-top:none;}
.solicitud-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.solicitud-head strong{font-size:13px;}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;}
.pill.solicitado{background:var(--amberbg);color:var(--amber);}
.pill.confirmado{background:var(--greenbg);color:var(--green);}
.pill.rechazado{background:var(--redbg);color:var(--red);}
.solicitud .desc{font-size:12px;color:var(--text2);margin-bottom:8px;}
.sfield{margin-bottom:8px;}
.sfield label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.sfield select,.sfield input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:'Manrope',sans-serif;}
.btn.chico{width:auto;padding:9px 16px;font-size:13px;margin-top:4px;}
</style>

  if(!f) return '—';
  const [y,m,d]=f.split('-');
  return `${d}/${m}/${y}`;
}

// Categorías de curso ya definidas en index.html (Academia) — el catálogo
// real de cursos de Jp todavía no llega, así que por ahora se usa esta lista
// genérica para la solicitud de Laboratorio Virtual (ver pendiente en
// claude/circulo-innovaci-fase0-build-171026.md).
const CURSOS=['Empresarial','Diplomado 24/7','Diplomado en vivo','Taller 24/7','Taller en vivo','Desde cero'];

let membresiaActual=null;

function ultimaSolicitud(beneficios,tipo){
  return (beneficios||[]).find(b=>b.tipo===tipo) || null;
}

function pill(estado){
  const txt={solicitado:'Pendiente de confirmación',confirmado:'Confirmado',rechazado:'Rechazado'}[estado]||estado;
  return `<span class="pill ${estado}">${txt}</span>`;
}

async function enviarSolicitud(tipo,detalle,btn){
  btn.disabled=true; btn.textContent='Enviando…';
  const {error}=await sb.from('circulo_beneficios_uso').insert({
    membresia_id: membresiaActual.membresia_id,
    tipo, detalle, estado:'solicitado',
  });
  if(error){ btn.disabled=false; btn.textContent='Reintentar'; alert('No se pudo enviar la solicitud. Intenta de nuevo o escríbenos por WhatsApp.'); return; }
  // recarga el resultado completo para reflejar el nuevo estado
  const {data}=await sb.from('circulo_portal_publico').select('*').eq('membresia_id',membresiaActual.membresia_id).maybeSingle();
  if(data) mostrarResultado(data);
}

function bloqueLaboratorio(beneficios){
  const s=ultimaSolicitud(beneficios,'laboratorio');
  if(s && s.estado!=='rechazado'){
    return `<div class="solicitud"><div class="solicitud-head"><strong>Laboratorio Virtual</strong>${pill(s.estado)}</div><div class="desc">${s.detalle||''}${s.estado==='solicitado'?' — te confirmamos en breve.':''}</div></div>`;
  }
  return `<div class="solicitud">
    <div class="solicitud-head"><strong>Laboratorio Virtual</strong>${s&&s.estado==='rechazado'?pill('rechazado'):''}</div>
    <div class="desc">Elige curso y modalidad. Sujeto a disponibilidad — te confirmamos por correo o WhatsApp.</div>
    <div class="sfield"><label>Curso</label><select id="labCurso">${CURSOS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="sfield"><label>Modalidad</label><select id="labModalidad"><option>24/7</option><option>En vivo</option></select></div>
    <button class="btn chico" onclick="solicitarLaboratorio(this)">Solicitar acceso</button>
  </div>`;
}
function solicitarLaboratorio(btn){
  const curso=document.getElementById('labCurso').value;
  const modalidad=document.getElementById('labModalidad').value;
  enviarSolicitud('laboratorio',`${curso} — ${modalidad}`,btn);
}

function bloqueSesion(beneficios){
  const s=ultimaSolicitud(beneficios,'sesion_academica');
  if(s && s.estado!=='rechazado'){
    return `<div class="solicitud"><div class="solicitud-head"><strong>Sesión académica privada</strong>${pill(s.estado)}</div><div class="desc">${s.detalle||''}</div></div>`;
  }
  return `<div class="solicitud">
    <div class="solicitud-head"><strong>Sesión académica privada</strong>${s&&s.estado==='rechazado'?pill('rechazado'):''}</div>
    <div class="desc">Incluye 2 sesiones. Describe brevemente tu duda o tema (ya debes haber visto el curso relacionado).</div>
    <div class="sfield"><input id="sesTema" placeholder="Tema o duda puntual"></div>
    <button class="btn chico" onclick="solicitarSesion(this)">Solicitar sesión</button>
  </div>`;
}
function solicitarSesion(btn){
  const tema=document.getElementById('sesTema').value.trim();
  if(!tema){ alert('Describe brevemente el tema.'); return; }
  enviarSolicitud('sesion_academica',tema,btn);
}

function bloqueAcompanante(beneficios){
  const s=ultimaSolicitud(beneficios,'acompanante');
  if(s && s.estado!=='rechazado'){
    return `<div class="solicitud"><div class="solicitud-head"><strong>Acompañante</strong>${pill(s.estado)}</div><div class="desc">${s.detalle||''}</div></div>`;
  }
  return `<div class="solicitud">
    <div class="solicitud-head"><strong>Acompañante</strong>${s&&s.estado==='rechazado'?pill('rechazado'):''}</div>
    <div class="desc">Comparte un beneficio con alguien más: dinos su nombre y correo.</div>
    <div class="sfield"><input id="acompNombre" placeholder="Nombre"></div>
    <div class="sfield"><input id="acompCorreo" placeholder="Correo" type="email"></div>
    <button class="btn chico" onclick="solicitarAcompanante(this)">Registrar acompañante</button>
  </div>`;
}
function solicitarAcompanante(btn){
  const nombre=document.getElementById('acompNombre').value.trim();
  const correo=document.getElementById('acompCorreo').value.trim();
  if(!nombre || !correo){ alert('Captura nombre y correo.'); return; }
  enviarSolicitud('acompanante',`${nombre} (${correo})`,btn);
}

function bloqueCredito(beneficios){
  const s=ultimaSolicitud(beneficios,'credito_referido');
  if(s && s.estado!=='rechazado'){
    return `<div class="solicitud"><div class="solicitud-head"><strong>Crédito por referido</strong>${pill(s.estado)}</div><div class="desc">${s.detalle||''}</div></div>`;
  }
  return `<div class="solicitud">
    <div class="solicitud-head"><strong>Crédito por referido</strong>${s&&s.estado==='rechazado'?pill('rechazado'):''}</div>
    <div class="desc">No es automático — dinos a quién referiste y lo validamos.</div>
    <div class="sfield"><input id="credRef" placeholder="Nombre de la persona que referiste"></div>
    <button class="btn chico" onclick="solicitarCredito(this)">Solicitar crédito</button>
  </div>`;
}
function solicitarCredito(btn){
  const ref=document.getElementById('credRef').value.trim();
  if(!ref){ alert('Captura a quién referiste.'); return; }
  enviarSolicitud('credito_referido',ref,btn);
}

function diasRestantes(fv){
  if(!fv) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const v=new Date(fv+'T00:00:00');
  return Math.round((v-hoy)/86400000);
}

// Verificación anti-bot simple (sin dependencias externas): una suma
// aleatoria que un script automático no resuelve de un vistazo. No es una
// protección fuerte tipo Cloudflare Turnstile — eso requeriría que Jp cree
// una cuenta/llave en Cloudflare y mover esta consulta a un endpoint propio
// que la valide del lado del servidor (queda anotado como mejora de Fase 1
// en claude/circulo-innovaci-fase0-build-171026.md). Esto es un filtro
// barato que sí detiene bots genéricos y además, junto con el bloqueo
// temporal tras varios intentos fallidos, hace más lento un ataque de fuerza
// bruta sobre el código de acceso.
let captchaA=0, captchaB=0, intentosFallidos=0;
function nuevoCaptcha(){
  captchaA=Math.floor(Math.random()*8)+1;
  captchaB=Math.floor(Math.random()*8)+1;
  document.getElementById('captchaLabel').textContent=`¿Cuánto es ${captchaA} + ${captchaB}?`;
  document.getElementById('fCaptcha').value='';
}
nuevoCaptcha();

async function entrar(){
  const email=document.getElementById('fEmail').value.trim().toLowerCase();
  const codigo=document.getElementById('fCodigo').value.trim().toUpperCase();
  const captcha=document.getElementById('fCaptcha').value.trim();
  const err=document.getElementById('resultadoError');
  err.innerHTML='';
  if(!email || !codigo){ err.innerHTML='<div class="bad">Captura tu correo y tu código de acceso.</div>'; return; }
  if(Number(captcha)!==captchaA+captchaB){ err.innerHTML='<div class="bad">La verificación no es correcta.</div>'; nuevoCaptcha(); return; }

  const btn=document.getElementById('btnEntrar');
  btn.disabled=true; btn.textContent='Buscando…';
  const {data,error}=await sb.from('circulo_portal_publico')
    .select('*')
    .eq('email_norm',email)
    .eq('codigo_acceso',codigo)
    .maybeSingle();
  btn.disabled=false; btn.textContent='Ingresar';
  nuevoCaptcha();

  if(error){ err.innerHTML=`<div class="bad">Ocurrió un error. Intenta de nuevo.</div>`; return; }
  if(!data){
    intentosFallidos++;
    err.innerHTML='<div class="bad">No encontramos una membresía con ese correo y código. Verifica los datos o contacta a Innovaci.</div>';
    if(intentosFallidos>=5){
      let espera=20;
      btn.disabled=true;
      const t=setInterval(()=>{
        espera--; btn.textContent=`Espera ${espera}s…`;
        if(espera<=0){ clearInterval(t); btn.disabled=false; btn.textContent='Ingresar'; intentosFallidos=0; }
      },1000);
    }
    return;
  }

  mostrarResultado(data);
}

function mostrarResultado(m){
  membresiaActual=m;
  document.getElementById('wrap').style.display='none';
  const avisos=(m.avisos||[]).map(a=>`<div class="aviso">${a.mensaje}</div>`).join('');
  const constancias=(m.constancias||[]);
  const beneficios=(m.beneficios_usados||[]);
  const beneficiosPlan=BENEFICIOS_PLAN[m.plan]||[];
  const esPro=m.plan==='socio_pro';

  const dias=diasRestantes(m.fecha_vencimiento);
  let diasHtml='—';
  if(dias!==null){
    const clase = dias<0 ? 'red' : (dias<=30 ? 'warn' : '');
    const texto = dias<0 ? `Vencida hace ${Math.abs(dias)} días` : `${dias} días restantes`;
    diasHtml = `<div class="dias"><span class="n ${clase}">${dias<0?Math.abs(dias):dias}</span><span class="t">${texto}</span></div>`;
  }

  const html=`
  <div class="wrap expanded">
    <div class="result-card">
      <div class="result-topbar"></div>
      <div class="result-head">
        <div class="result-brand">Círculo Innovaci</div>
        <div class="result-name">${m.nombre}</div>
        <div class="result-sub">${ESPECIALIDAD_LABEL[m.especialidad]||m.especialidad} — ${m.plan==='socio_pro'?'Socio Pro':'Socio'}${m.costo_cero?' (vinculada, sin costo adicional)':''}</div>
        <span class="badge ${m.estado}">${ESTADO_LABEL[m.estado]||m.estado}</span>
      </div>
      <div class="result-body">
        ${avisos ? `<div>${avisos}</div>` : ''}
        <div class="panel">
          <div class="section-title">Tu membresía</div>
          <div class="grid2">
            <div class="stat"><div class="k">Activación</div><div class="v">${fmtFecha(m.fecha_activacion)}</div></div>
            <div class="stat"><div class="k">Vigencia hasta</div><div class="v">${fmtFecha(m.fecha_vencimiento)}</div></div>
          </div>
          <div style="margin-top:12px">${diasHtml}</div>
        </div>
        <div class="panel">
          <div class="section-title">Qué incluye tu membresía</div>
          ${beneficiosPlan.map(b=>`<div class="beneficio">${b}</div>`).join('')}
        </div>
        <div>
          <div class="section-title">Tus cursos</div>
          <a class="cta" href="https://odoo.com" target="_blank" rel="noopener">Entrar a Academia / Odoo →</a>
        </div>
        ${esPro ? `<div class="panel">
          <div class="section-title">Solicitar beneficios</div>
          ${bloqueLaboratorio(beneficios)}
          ${bloqueSesion(beneficios)}
          ${bloqueAcompanante(beneficios)}
          ${bloqueCredito(beneficios)}
        </div>` : ''}
        ${constancias.length ? `<div>
          <div class="section-title">Tus constancias</div>
          ${constancias.map(c=>`<div class="list-item">${c.tipo}<small>Folio ${c.folio} · emitida ${fmtFecha(c.fecha_emision)}</small></div>`).join('')}
        </div>` : ''}
        ${beneficios.length ? `<div>
          <div class="section-title">Beneficios usados</div>
          ${beneficios.map(b=>`<div class="list-item">${b.tipo}${b.detalle?` — ${b.detalle}`:''}<small>${fmtFecha(b.fecha)}</small></div>`).join('')}
        </div>` : ''}
        <div class="foot">¿Dudas sobre tu membresía? Escribe a Innovaci por WhatsApp o correo.</div>
      </div>
    </div>
  </div>`;
  document.getElementById('resultadoWrap').innerHTML=html;
}
</script>
</body>
</html>
