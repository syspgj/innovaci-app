<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal del socio — Círculo Innovaci</title>
<link rel="icon" href="circulo-isotipo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  /* Paleta tomada de la insignia de marca de Círculo Innovaci (171026) */
  --navy:#0b1f33; --navy2:#0b3b5c; --teal:#12b3a8; --teal2:#0e8d85;
  --brand-blue:#0e5a8c; --gold:#f0b65c;
  --border:#e7ebee; --text2:#5c6b77; --text3:#9aa6b0; --bg:#eef1f4;
  --green:#1f8a5f; --greenbg:#e9f8f0; --amber:#b4791f; --amberbg:#fbf1e2;
  --red:#b4441f; --redbg:#fdecea;
}
.brandlogo{display:flex;justify-content:center;margin-bottom:18px;}
.brandlogo img{width:112px;height:112px;border-radius:50%;filter:drop-shadow(0 14px 28px rgba(11,31,51,.4));}
body{font-family:'Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;margin:0;-webkit-font-smoothing:antialiased;}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 16px;background:var(--navy);background-image:radial-gradient(circle at 15% 15%,rgba(18,179,168,.26) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(18,179,168,.16) 0%,transparent 50%);}
.wrap{width:100%;max-width:580px;margin:0 auto;}
.teaser{display:flex;gap:10px;margin-bottom:24px;}
.teaser div{flex:1;background:#f8f9fa;border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;font-size:11px;color:var(--text2);font-weight:700;}
.wrap.expanded{max-width:1040px;}
.card{background:#fff;border:1px solid var(--border);border-radius:22px;padding:44px 38px;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.06),0 34px 70px -20px rgba(0,0,0,.5);}
.tagline{font-size:12px;color:var(--teal2);margin-bottom:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;}
h1{font-size:23px;font-weight:800;margin-bottom:7px;text-align:center;}
.sub{font-size:14px;color:var(--text2);margin-bottom:24px;line-height:1.6;text-align:center;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:5px;}
.field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;font-family:'Montserrat',sans-serif;outline:none;}
.field input#fCodigo{text-transform:uppercase;letter-spacing:.08em;}
.field input:focus{border-color:var(--teal);}
.btn{width:100%;padding:13px;background:var(--teal);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;}
.btn:disabled{opacity:.6;cursor:default;}
.bad{color:var(--red);font-weight:600;font-size:13px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.foot{font-size:11px;color:var(--text3);margin-top:22px;text-align:center;}

#resultadoWrap{padding:48px 16px;}
#resultadoWrap:empty{padding:0;}
.result-grid{display:flex;flex-direction:column;gap:22px;}
.result-banner{border-radius:22px;overflow:hidden;background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 55%,var(--esp-color,var(--teal)) 160%);box-shadow:0 1px 2px rgba(16,24,32,.04),0 20px 44px -16px rgba(11,31,51,.5);padding:36px 38px;color:#fff;position:relative;}
.result-banner .brandrow{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.result-banner .brandrow img{width:50px;height:50px;border-radius:50%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));}
.result-banner .brandrow-title{font-size:13.5px;font-weight:800;letter-spacing:.02em;color:#fff;}
.result-banner .brandrow-tag{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.62);margin-top:2px;}
.result-banner .toprow{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;}
.result-name{font-size:30px;font-weight:800;letter-spacing:-.01em;}
.result-numero{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.55);margin-top:4px;font-variant-numeric:tabular-nums;}
.result-sub{font-size:13.5px;font-weight:700;margin-top:9px;color:rgba(255,255,255,.82);}
.chip{display:inline-block;padding:5px 13px;border-radius:99px;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);}
.badge{display:inline-block;padding:4px 11px;border-radius:99px;font-size:11px;font-weight:700;}
.badge.activa{background:rgba(31,138,95,.22);color:#aef0cf;}
.badge.revision{background:rgba(180,121,31,.25);color:#ffd9a0;}
.badge.suspendida,.badge.vencida{background:rgba(180,68,31,.25);color:#ffb6a0;}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px;}
.kpi{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:13px 14px;}
.kpi .k{font-size:10px;font-weight:700;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.kpi .v{font-size:18.5px;font-weight:600;}
.kpi .v.warn{color:#ffd9a0;}
.kpi .v.red{color:#ffb6a0;}

.section-title{font-size:15px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px;}
.panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:26px 28px;box-shadow:0 1px 2px rgba(16,24,32,.03),0 14px 32px -18px rgba(16,24,32,.16);}
.panel.acc{border-left:3px solid var(--esp-color,var(--teal));}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.stat .k{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:4px;}
.stat .v{font-size:15px;font-weight:700;}
.list-item{font-size:14px;color:var(--navy);padding:9px 0;border-top:1px solid #eef1f3;}
.list-item:first-child{border-top:none;}
.list-item small{display:block;color:var(--text3);font-weight:500;margin-top:2px;}
.cta{display:block;text-align:center;background:var(--navy);color:#fff;text-decoration:none;padding:13px;border-radius:10px;font-weight:700;font-size:14px;}
.aviso{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;}
.beneficio{font-size:13px;color:var(--navy);padding:6px 0;display:flex;gap:8px;}
.beneficio::before{content:'✓';color:var(--teal2);font-weight:800;}

.benefrow{display:flex;flex-direction:column;gap:16px;}
.benefcard{background:#fff;border:1px solid var(--border);border-radius:18px;padding:26px 28px;box-shadow:0 1px 2px rgba(16,24,32,.03),0 14px 32px -18px rgba(16,24,32,.16);}
.benefcard-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;}
.benefcard-icon{width:40px;height:40px;border-radius:11px;background:var(--esp-bg,var(--greenbg));display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.benefcard-titulo{font-size:16px;font-weight:800;}
.benefcard-que{font-size:13.5px;color:var(--text2);line-height:1.6;margin-top:4px;}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;margin-left:auto;flex-shrink:0;}
.pill.solicitado{background:var(--amberbg);color:var(--amber);}
.pill.confirmado{background:var(--greenbg);color:var(--green);}
.pill.rechazado{background:var(--redbg);color:var(--red);}
.pill.programada,.pill.realizada,.pill.en_revision_karen,.pill.propuesta{background:var(--amberbg);color:var(--amber);}
.pill.asignado,.pill.compra_confirmada,.pill.concluida{background:var(--greenbg);color:var(--green);}
.pill.no_asistio{background:#eef1f3;color:var(--text3);}
.benefcard .desc{font-size:12px;color:var(--text2);margin-bottom:10px;}
.sfield{margin-bottom:8px;}
.sfield label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;}
.sfield select,.sfield input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'Montserrat',sans-serif;}
.btn.chico{width:auto;padding:9px 16px;font-size:13px;margin-top:4px;background:var(--brand-blue);}

/* Grupos de cursos en "Qué incluye tu membresía" — reacomodo pedido por Jp
   (191026): alineados a la izquierda, agrupados por modalidad (24/7 / en
   vivo / masterclass) cada uno con su propio distintivo de color; las
   masterclasses conservan el verde que ya existía. */
.curso-group-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.curso-item{display:flex;gap:10px;align-items:baseline;justify-content:flex-start;text-align:left;}
.cpill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;flex-shrink:0;}
.cpill.p247{background:#e3f0fc;color:var(--brand-blue);}
.cpill.pvivo{background:var(--amberbg);color:var(--amber);}
.cpill.pmc{background:var(--greenbg);color:var(--green);}

/* Accesos rápidos — tomado del mockup de referencia que compartió Jp
   (191026), con destinos reales (anclas a las secciones del portal). */
.quicklinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;}
.qlink{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:#f8f9fa;border:1px solid var(--border);border-radius:14px;padding:14px;text-decoration:none;color:var(--navy);font-size:12.5px;font-weight:700;border:1px solid var(--border);}
.qlink:hover{border-color:var(--esp-color,var(--teal));}
.qlink-icon{font-size:20px;}

/* Resumen "Mis beneficios" — solo datos reales (sin cifras inventadas como
   las del mockup de referencia); Jp pidió tomar el estilo visual pero con
   información verdadera (191026). */
.beneftiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px;}
.beneftile{background:#f8f9fa;border:1px solid var(--border);border-radius:14px;padding:14px;}
.beneftile-icon{font-size:18px;margin-bottom:6px;}
.beneftile-v{font-size:16px;font-weight:800;}
.beneftile-k{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px;}

/* Acordeón de "Cursos que incluye tu membresía" — colapsado por default,
   pedido por Jp (191026, segunda ronda) para que la ficha no se sienta tan
   larga de entrada. */
details.panel.acc{padding:0;}
details.panel.acc>summary{list-style:none;cursor:pointer;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;color:var(--navy);}
details.panel.acc>summary::-webkit-details-marker{display:none;}
details.panel.acc>summary .chev{transition:transform .2s ease;color:var(--text3);font-size:18px;}
details.panel.acc[open]>summary .chev{transform:rotate(90deg);}
details.panel.acc>.acc-body{padding:0 26px 24px;}

/* Toggle "Solicita tu sesión académica" — se ve como botón, no como
   acordeón nativo, para esconder los campos hasta que el socio quiera
   solicitar (191026, segunda ronda). */
.sesion-toggle>summary{list-style:none;}
.sesion-toggle>summary::-webkit-details-marker{display:none;}

/* Laboratorio Virtual en dos columnas — copy de venta a la izquierda,
   formulario de solicitud a la derecha (191026, segunda ronda). */
.benefcard-2col{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;}
@media(max-width:640px){.benefcard-2col{grid-template-columns:1fr;}}

/* Motivo de rechazo visible y "Ver comentarios de la instructora" — pedido
   por Jp (191026, ronda de motivos de rechazo): el socio debe ver por qué
   se rechazó una solicitud, y al concluir una sesión académica poder
   expandir los comentarios reales que dejó su instructora. */
.motivo-rechazo{font-size:11.5px;color:var(--red);margin-top:4px;}
.ver-comentarios{font-size:11.5px;list-style:none;cursor:pointer;color:var(--brand-blue);font-weight:700;margin-top:4px;}
.ver-comentarios::-webkit-details-marker{display:none;}
.ver-comentarios-body{font-size:11.5px;color:var(--text3);margin-top:4px;white-space:pre-wrap;}

/* Pantalla de bienvenida personal entre el login y la ficha completa —
   pedida por Jp (181026) para reforzar la sensación de pertenencia:
   "bienvenido Josué" antes de mostrar todo de golpe. */
.welcome-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--navy);background-image:radial-gradient(circle at 15% 15%,rgba(18,179,168,.26) 0%,transparent 45%),radial-gradient(circle at 85% 85%,rgba(18,179,168,.16) 0%,transparent 50%);color:#fff;text-align:center;padding:24px;opacity:0;animation:welcomeIn .5s ease forwards, welcomeOut .5s ease 1.9s forwards;}
.welcome-screen img{width:144px;height:144px;border-radius:50%;filter:drop-shadow(0 14px 28px rgba(0,0,0,.4));animation:welcomePop .6s ease .1s backwards;}
.welcome-title{font-size:28px;font-weight:800;}
.welcome-sub{font-size:14px;font-weight:600;color:rgba(255,255,255,.75);letter-spacing:.02em;}
@keyframes welcomeIn{from{opacity:0}to{opacity:1}}
@keyframes welcomeOut{from{opacity:1}to{opacity:0;visibility:hidden}}
@keyframes welcomePop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
<div class="wrap" id="wrap">
  <div class="card">
    <div class="brandlogo">
      <img src="circulo-insignia.png" alt="Círculo Innovaci">
    </div>
    <h1>Bienvenido a Círculo Innovaci</h1>
    <div class="tagline">Acceso exclusivo para miembros</div>
    <div class="sub">Ingresa tu correo y el código de acceso que te compartió Innovaci al confirmar tu membresía.</div>
    <div class="teaser">
      <div>Tu vigencia</div>
      <div>Tus cursos</div>
      <div>Tus beneficios</div>
    </div>
    <div class="field"><label>Correo</label><input id="fEmail" type="email" autocomplete="off"></div>
    <div class="field"><label>Código de acceso</label><input id="fCodigo" placeholder="Ej. K7M2QX" autocomplete="off"></div>
    <div class="field"><label id="captchaLabel">Verificación</label><input id="fCaptcha" autocomplete="off" inputmode="numeric"></div>
    <button class="btn" id="btnEntrar" onclick="entrar()">Ingresar</button>
    <div id="resultadoError"></div>
    <div class="foot">Grupo Innovaci · Círculo Innovaci</div>
  </div>
</div>
</div>
<div id="welcomeWrap"></div>
<div id="resultadoWrap"></div>

<script>
// Mismo modelo que verificar.html / portal-empresa.html: anon key pública,
// la protección es el correo+código (solo lo tiene el socio), no RLS por
// sesión — ver claude/circulo-innovaci-arquitectura-membresias.md para el
// porqué (el portal del socio NO usa Supabase Auth a propósito).
const SURL='https://ydwouspzneacxfixlmmv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd291c3B6bmVhY3hmaXhsbW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzA5MzAsImV4cCI6MjA5NjkwNjkzMH0.uWB1VN2YT7ynTbHmfTWCOBHMRR54LdHJook7iOk7Mug';
const sb=supabase.createClient(SURL,SKEY);

const ESPECIALIDAD_LABEL={NOI:'Especialidad NOI',COI:'Especialidad COI',SAE:'Especialidad SAE'};
const ESTADO_LABEL={activa:'Activa',revision:'En revisión',suspendida:'Suspendida',vencida:'Vencida'};

// Colores oficiales de marca de Aspel por especialidad, confirmados por Jp
// (171026): NOI naranja, COI cian, SAE rojo.
const ESPECIALIDAD_COLOR={
  NOI:{c:'#f5821f',bg:'#fdf0e3'},
  COI:{c:'#00add9',bg:'#e3f7fb'},
  SAE:{c:'#ec0928',bg:'#fde8ea'},
};

// Catálogo real de cursos y masterclasses vigentes por especialidad —
// snapshot manual (171026) a partir de lo que Jp compartió. El manual
// oficial (sección 9) dice que el catálogo se actualiza/sustituye/retira
// con el tiempo, así que esta lista debe mantenerse a mano hasta que exista
// una pantalla de catálogo en circulo-admin.html (pendiente, ver
// claude/circulo-innovaci-fase0-build-171026.md). COI y SAE no tienen
// especialidad activa todavía (manual, sección 2) — se muestran vacías.
const CURSOS_CATALOGO={
  NOI:[
    {tipo:'Diplomado',titulo:'Diplomado Siigo Aspel NOI 11 GMAY26'},
    {tipo:'Curso',titulo:'Curso Siigo Aspel NOI Desde Cero - 2026'},
    {tipo:'Taller',titulo:'Taller PTU 2026 sin errores en NOI 11'},
    {tipo:'Taller en vivo',titulo:'Taller Aguinaldo 2026 con Aspel NOI'},
    {tipo:'Masterclass',titulo:'De usuario a experto en Aspel NOI 11.0 (2026)'},
    {tipo:'Masterclass',titulo:'Finiquitos e indemnizaciones 2026: el error que casi todos cometen'},
    {tipo:'Masterclass',titulo:'¿Algo no cuadra en tu NOI? Revisa tus acumulados'},
    {tipo:'Masterclass',titulo:'Arranca 2026 sin errores en tu nómina: cambios clave en Aspel NOI 11'},
    {tipo:'Masterclass',titulo:'Jornada Laboral 2027: ¿beneficio o complicación? (Parte 1 y 2)'},
    {tipo:'Masterclass',titulo:'Reforma Laboral 2027 aplicada en Aspel NOI'},
  ],
  COI:[],
  SAE:[],
};

// Traduce códigos internos de edición en el título de un curso a una
// leyenda legible para el socio. Hoy solo se conoce el patrón confirmado
// por Jp (171026): "...G<MES><AA>" → "Modalidad 24/7 · Edición 20AA" (p.ej.
// "Diplomado Siigo Aspel NOI 11 GMAY26" → "...Modalidad 24/7 · Edición
// 2026"). Si aparecen más códigos (p.ej. uno para "en vivo"), hay que
// confirmarlos con Jp antes de generalizar esta función.
function formatCursoTitulo(titulo){
  const m=titulo.match(/^(.*?)\s+G(?:ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEP|OCT|NOV|DIC)(\d{2})$/);
  if(!m) return titulo;
  return `${m[1]} · Modalidad 24/7 · Edición 20${m[2]}`;
}

function fmtFecha(f){
  if(!f) return '—';
  const [y,m,d]=f.split('-');
  return `${d}/${m}/${y}`;
}
function fmtFechaHora(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return d.toLocaleString('es-MX',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'});
}

// Jp, 2026-10-20: el catálogo de "Solicitar laboratorio" YA NO es esta lista
// estática — ahora sale en vivo de circulo_catalogo_laboratorio (vista
// pública acotada de las generaciones reales de Academia que Jp marcó como
// "Disponible para Círculo"). Antes se podía pedir un curso que ni siquiera
// había arrancado, o una modalidad (en vivo/24-7) que ese curso ni ofrece —
// ahora la modalidad sale fija de la generación real, no se elige aparte.
// Ver academia_generaciones.circulo_disponible (checkbox en Editar
// generación, Academia) y cargarCatalogoLaboratorio() más abajo.
let catalogoLaboratorioActual=[];
const MODALIDAD_LAB_LABEL={en_vivo:'En vivo','24_7':'24/7',in_company:'In company'};
// Catálogo genérico de respaldo — sigue en uso por bloqueSesion() (Solicitar
// sesión académica), que no se toca en este cambio.
const CURSOS=['Empresarial','Diplomado 24/7','Diplomado en vivo','Taller 24/7','Taller en vivo','Desde cero'];

let membresiaActual=null;

function ultimaSolicitud(beneficios,tipo){
  return (beneficios||[]).find(b=>b.tipo===tipo) || null;
}

function pill(estado){
  const txt={
    solicitado:'Pendiente de revisión',
    confirmado:'Confirmado',
    rechazado:'Rechazado',
    asignado:'Asignado',
    en_revision_karen:'En revisión con tu instructora',
    propuesta:'Fecha propuesta — te contactaremos',
    programada:'Confirmada',
    realizada:'Realizada',
    concluida:'Concluida',
    no_asistio:'No asistió',
    compra_confirmada:'Compra confirmada',
  }[estado]||estado;
  return `<span class="pill ${estado}">${txt}</span>`;
}

// Qué es / para qué sirve cada beneficio — contenido descriptivo fijo,
// pedido por Jp (171026) para que el portal no sea solo un formulario sino
// explique el beneficio antes de pedirlo.
const BENEFICIO_INFO={
  laboratorio:{icon:'',titulo:'Laboratorio Virtual',que:'Un espacio de práctica exclusivamente académico para resolver dudas y practicar casos del curso que elijas — sin acompañamiento de instructor. Obtienes un acceso por cada curso elegible de tu catálogo, válido en una sola modalidad (24/7 o en vivo). No sustituye una licencia comercial de Aspel NOI ni puede usarse para nómina productiva o información real de tu empresa.'},
  sesion_academica:{icon:'',titulo:'Sesión académica privada',que:'¿Ya viste el curso y te quedaron dudas? ¿Te gustaría tener una sesión individual con tu instructora? Puedes solicitarla ahora. Esta sesión privada consta de 30 minutos, en los que podrás resolver de manera puntual las dudas que te quedaron del curso que acabas de tomar. No incluye soporte técnico, revisión de tu base de datos ni consultoría sobre tu operación real — eso se contrata aparte como soporte.'},
  acompanante:{icon:'',titulo:'Beneficios para acompañantes',que:'¿Tienes un colega, amigo o familiar que crees que le serviría alguno de nuestros cursos o beneficios? Aprovecha y otórgale un beneficio: puedes solicitar un cupón con 15% de descuento para que lo adquiera.'},
  // credito_referido no usa esta tabla para su tarjeta (bloqueCredito tiene
  // su propio render a dos columnas) — se deja solo el título, para el
  // historial de beneficios de abajo.
  credito_referido:{icon:'',titulo:'Crédito Innovaci'},
};
// Motivo de rechazo — igual para los 4 tipos de beneficio, pedido por Jp
// (191026): el socio debe ver por qué se rechazó, no solo el pill rojo.
function motivoRechazo(b){
  if(b.estado!=='rechazado' || !b.nota) return '';
  return `<div class="motivo-rechazo">Motivo: ${b.nota}</div>`;
}
function historialMini(items){
  if(!items || !items.length) return '';
  return `<div style="margin:0 0 12px">${items.map(b=>`<div class="list-item" style="padding:6px 0;font-size:12px">${b.detalle||''} ${pill(b.estado)}${b.fecha?`<small>${fmtFecha(b.fecha)}</small>`:''}</div>`).join('')}</div>`;
}
// Variante de historial para Laboratorio Virtual: cuando el admin ya asignó
// el acceso a una inscripción real de Academia, muestra la vigencia real
// (fecha_inicio_laboratorio/fecha_fin_laboratorio), no un "confirmado" vacío.
function historialLaboratorio(items){
  if(!items || !items.length) return '';
  return `<div style="margin:0 0 12px">${items.map(b=>{
    let extra='';
    if(b.estado==='asignado' && (b.lab_fecha_inicio||b.lab_fecha_fin)){
      extra=`<div style="font-size:11.5px;color:var(--text3);margin-top:4px">Vigencia del laboratorio: ${fmtFecha(b.lab_fecha_inicio)} → ${fmtFecha(b.lab_fecha_fin)}</div>`;
    }
    return `<div class="list-item" style="padding:6px 0;font-size:12px">${b.detalle||''} ${pill(b.estado)}${b.fecha?`<small>${fmtFecha(b.fecha)}</small>`:''}${extra}${motivoRechazo(b)}</div>`;
  }).join('')}</div>`;
}
// Variante de historial para Sesión académica: muestra fecha/hora programada
// y, cuando ya se agregó, el enlace de Zoom para entrar a la sesión —
// pedido por Jp (191026): "en cuanto se concluya... se descuenta".
function historialSesion(items){
  if(!items || !items.length) return '';
  return `<div style="margin:0 0 12px">${items.map(b=>{
    let extra='';
    if(b.estado==='en_revision_karen'){
      extra=`<div style="font-size:11.5px;color:var(--text3);margin-top:4px">Tu instructora ya está revisando la mejor fecha para atenderte.</div>`;
    } else if(b.estado==='propuesta' && b.fecha_programada){
      extra=`<div style="font-size:12px;color:var(--navy);margin-top:4px">Te contactaremos por WhatsApp para confirmar: ${fmtFechaHora(b.fecha_programada)}</div>`;
    } else if(b.estado==='programada' && b.fecha_programada){
      extra=`<div style="font-size:12px;color:var(--navy);font-weight:700;margin-top:4px">Confirmada: ${fmtFechaHora(b.fecha_programada)}${b.enlace_zoom?`<br><a href="${b.enlace_zoom}" target="_blank" rel="noopener" style="color:var(--brand-blue);font-weight:700">Entrar a tu sesión (Zoom) →</a>`:''}</div>`;
    } else if(b.estado==='realizada'){
      extra=`<div style="font-size:12px;color:var(--navy);margin-top:4px">${b.fecha_programada?`Fecha: ${fmtFechaHora(b.fecha_programada)}<br>`:''}${b.enlace_zoom?`<a href="${b.enlace_zoom}" target="_blank" rel="noopener" style="color:var(--brand-blue);font-weight:700">Entrar a tu sesión (Zoom) →</a>`:''}</div>`;
    } else if((b.estado==='concluida' || b.estado==='no_asistio') && b.fecha_programada){
      extra=`<div style="font-size:11.5px;color:var(--text3);margin-top:4px">Se realizó: ${fmtFechaHora(b.fecha_programada)}</div>`;
    }
    // Comentarios de la instructora al concluir — expandible, pedido por Jp
    // (191026), en vez de mostrarse siempre abierto.
    const comentarios = (b.estado==='concluida' || b.estado==='no_asistio') && b.nota
      ? `<details><summary class="ver-comentarios">Ver comentarios de la instructora</summary><div class="ver-comentarios-body">${b.nota}</div></details>`
      : '';
    return `<div class="list-item" style="padding:6px 0;font-size:12px">${b.detalle||''} ${pill(b.estado)}${b.fecha?`<small>${fmtFecha(b.fecha)}</small>`:''}${extra}${motivoRechazo(b)}${comentarios}</div>`;
  }).join('')}</div>`;
}
// Variante de historial para Acompañante / Crédito: cuando el admin ya
// confirmó la compra real en tienda, muestra qué se compró.
function historialCompra(items){
  if(!items || !items.length) return '';
  return `<div style="margin:0 0 12px">${items.map(b=>{
    let extra='';
    if(b.estado==='compra_confirmada' && b.producto_comprado){
      extra=`<div style="font-size:11.5px;color:var(--text3);margin-top:4px">Compra confirmada: ${b.producto_comprado}</div>`;
    }
    return `<div class="list-item" style="padding:6px 0;font-size:12px">${b.detalle||''} ${pill(b.estado)}${b.fecha?`<small>${fmtFecha(b.fecha)}</small>`:''}${extra}${motivoRechazo(b)}</div>`;
  }).join('')}</div>`;
}
function tarjetaBeneficio(tipo,pillHtml,descHtml,cuerpoHtml){
  const info=BENEFICIO_INFO[tipo];
  return `<div class="benefcard">
    <div class="benefcard-head">
      ${info.icon ? `<div class="benefcard-icon">${info.icon}</div>` : ''}
      <div style="flex:1">
        <div class="benefcard-titulo">${info.titulo}</div>
        <div class="benefcard-que">${info.que}</div>
      </div>
      ${pillHtml}
    </div>
    ${descHtml ? `<div class="desc">${descHtml}</div>` : ''}
    ${cuerpoHtml}
  </div>`;
}

async function enviarSolicitud(tipo,detalle,btn){
  btn.disabled=true; btn.textContent='Enviando…';
  const {error}=await sb.from('circulo_beneficios_uso').insert({
    membresia_id: membresiaActual.membresia_id,
    tipo, detalle, estado:'solicitado',
  });
  if(error){ btn.disabled=false; btn.textContent='Reintentar'; alert('No se pudo enviar la solicitud. Intenta de nuevo o escríbenos por WhatsApp.'); return; }
  // recarga el resultado completo para reflejar el nuevo estado
  const {data}=await sb.from('circulo_portal_publico').select('*').eq('membresia_id',membresiaActual.membresia_id).maybeSingle();
  if(data) mostrarResultado(data);
}

// Rediseño pedido por Jp (191026, segunda ronda): sin ícono, dos columnas
// — copy de venta + qué no incluye a la izquierda, formulario de solicitud
// a la derecha; botón azul de marca en vez de naranja de especialidad.
function bloqueLaboratorio(beneficios){
  const previas=(beneficios||[]).filter(b=>b.tipo==='laboratorio');
  // Jp, 2026-10-20: el curso y la modalidad ya no se eligen por separado —
  // la modalidad es un dato FIJO de la generación real (no se puede pedir
  // "en vivo" de un curso que solo existe 24/7), y la lista solo trae
  // generaciones que Jp ya activó para el Círculo (ver
  // catalogoLaboratorioActual, cargado en mostrarResultado()). Si todavía no
  // hay ninguna activa para su especialidad, se avisa en vez de dejar
  // solicitar "al aire".
  const catalogo=catalogoLaboratorioActual||[];
  const opciones=catalogo.map(c=>`<option value="${c.generacion_id}" data-modalidad="${c.curso_modalidad||''}">${c.curso_nombre}</option>`).join('');
  const formularioHtml=catalogo.length
    ? `<div class="sfield"><label>Curso</label><select id="labCurso" onchange="actualizarModalidadLab()">${opciones}</select></div>
       <div class="sfield"><label>Modalidad</label><div id="labModalidadTxt" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text2);background:#f8f9fa;">—</div></div>
       <div style="font-size:11px;color:var(--text3);margin-bottom:8px">La modalidad la define el curso elegido — 24/7: accedes a las grabaciones cuando quieras. En vivo: te unes en el horario que te confirme Capacitación.</div>
       <button class="btn chico" style="background:var(--brand-blue)" onclick="solicitarLaboratorio(this)">Solicitar acceso</button>`
    : `<div style="font-size:12.5px;color:var(--text3);line-height:1.6">Por ahora no hay ningún curso con Laboratorio Virtual disponible para solicitar en tu especialidad. En cuanto Capacitación active uno, aparecerá aquí.</div>`;
  return `<div class="benefcard">
    <div class="benefcard-titulo" style="margin-bottom:14px">Laboratorio Virtual</div>
    <div class="benefcard-2col">
      <div>
        <div style="font-size:13.5px;color:var(--navy);line-height:1.65;font-weight:600">¿Quieres reforzar lo que aprendiste sin presión? Este es tu espacio ideal para:</div>
        <div style="font-size:13px;color:var(--text2);line-height:1.75;margin-top:8px">
          ✓ Practicar casos reales del curso que elijas, a tu ritmo<br>
          ✓ Resolver dudas prácticas antes de aplicarlas en tu empresa<br>
          ✓ Ganar confianza en un entorno seguro, sin afectar tu operación
        </div>
        <div style="font-size:11.5px;color:var(--text3);line-height:1.6;margin-top:12px">No incluye: acompañamiento de instructor, uso con nómina productiva o información real de tu empresa, ni sustituye tu licencia comercial de Aspel NOI. Un acceso por curso elegible, en una sola modalidad, sujeto a disponibilidad — se asigna en hasta 15 días, vinculado a tu inscripción real en Academia.</div>
        ${historialLaboratorio(previas)}
      </div>
      <div>
        <div style="font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:10px">Solicita tu acceso</div>
        ${formularioHtml}
      </div>
    </div>
  </div>`;
}
// Refleja la modalidad REAL del curso elegido (no editable) — Jp, 2026-10-20.
function actualizarModalidadLab(){
  const sel=document.getElementById('labCurso');
  const txt=document.getElementById('labModalidadTxt');
  if(!sel||!txt) return;
  const modalidad=sel.selectedOptions[0]?.dataset.modalidad||'';
  txt.textContent=MODALIDAD_LAB_LABEL[modalidad]||modalidad||'—';
}
function solicitarLaboratorio(btn){
  const sel=document.getElementById('labCurso');
  const opt=sel?.selectedOptions[0];
  if(!opt){ return; }
  const item=(catalogoLaboratorioActual||[]).find(c=>c.generacion_id===opt.value);
  const modalidadTxt=MODALIDAD_LAB_LABEL[opt.dataset.modalidad]||opt.dataset.modalidad||'';
  const detalle=`${opt.textContent} — ${modalidadTxt}${item?` (${item.generacion_clave})`:''}`;
  enviarSolicitud('laboratorio',detalle,btn);
}

function bloqueSesion(beneficios){
  const previas=(beneficios||[]).filter(b=>b.tipo==='sesion_academica');
  const usadas=previas.filter(b=>b.estado!=='rechazado').length;
  const disponibles=Math.max(0,2-usadas);
  const pillSaldo=`<span class="pill ${disponibles>0?'confirmado':'rechazado'}" style="margin-left:auto">${disponibles} de 2 disponibles</span>`;
  const catalogo=(CURSOS_CATALOGO[membresiaActual.especialidad]||[]).filter(c=>c.tipo!=='Masterclass');
  const opcionesCurso=catalogo.length
    ? catalogo.map(c=>`<option>${formatCursoTitulo(c.titulo)}</option>`).join('')
    : CURSOS.map(c=>`<option>${c}</option>`).join('');
  let cuerpo=historialSesion(previas);
  // Los campos quedan ocultos detrás de un botón de "Solicita tu sesión
  // académica" — pedido por Jp (191026, segunda ronda) para que la
  // tarjeta no se vea como un formulario desde el inicio.
  if(disponibles>0){
    cuerpo+=`
    <details class="sesion-toggle">
      <summary class="btn chico">Solicita tu sesión académica</summary>
      <div style="margin-top:14px">
        <div class="sfield"><label>Selecciona el curso que ya viste</label><select id="sesCurso">${opcionesCurso}</select></div>
        <div class="sfield"><label>Escribe cuáles son tus dudas puntuales</label><input id="sesTema" placeholder="Sé específico — no es soporte técnico ni revisión de tu base de datos"></div>
        <label style="display:flex;gap:7px;align-items:flex-start;font-size:11.5px;color:var(--text2);margin:6px 0 8px;line-height:1.4">
          <input type="checkbox" id="sesConfirmo" style="margin-top:2px">
          <span>Ya revisé la capacitación correspondiente y mi duda sigue sin resolverse</span>
        </label>
        <div style="font-size:11.5px;color:var(--text2);line-height:1.5;margin-bottom:10px">Recuerda que tu membresía dispone de 2 sesiones académicas privadas. Esta solicitud ocupa uno de tus 2 lugares disponibles; se dará por utilizada hasta que la sesión se concluya.</div>
        <button class="btn chico" onclick="solicitarSesion(this)">Hacer solicitud</button>
      </div>
    </details>`;
  } else {
    cuerpo+=`<div style="font-size:12px;color:var(--text3)">Ya utilizaste tus 2 sesiones académicas privadas de esta vigencia.</div>`;
  }
  return tarjetaBeneficio('sesion_academica',pillSaldo,'',cuerpo);
}
function solicitarSesion(btn){
  const curso=document.getElementById('sesCurso').value.trim();
  const tema=document.getElementById('sesTema').value.trim();
  const confirmo=document.getElementById('sesConfirmo').checked;
  if(!curso || tema.length<10){ alert('Indica el curso y describe tu duda con un poco más de detalle.'); return; }
  if(!confirmo){ alert('Confirma que ya revisaste la capacitación correspondiente.'); return; }
  enviarSolicitud('sesion_academica',`${curso} — ${tema}`,btn);
}

// Soporte y ayuda — precios reales (manual sección 13); el enlace de
// WhatsApp usa el vendedor asignado al cliente en Cartera (vinculado por
// cliente_cartera_id), no un número genérico, tal como pidió Jp (191026:
// "al del vendedor de cada miembro"). Si no hay vendedor vinculado, no se
// inventa ningún contacto.
function bloqueSoporte(m,esPro){
  const precio30=esPro?'$599 + IVA':'$649 + IVA';
  const precioH=esPro?'$1,099 + IVA':'$1,199 + IVA';
  const waDigits=(m.vendedor_whatsapp||'').replace(/\D/g,'');
  const msg=encodeURIComponent(`Hola${m.vendedor_nombre?(' '+m.vendedor_nombre):''}, soy ${esPro?'Socio NOI Pro':'Socio NOI'} de Círculo Innovaci y me gustaría solicitar mi beneficio de soporte con precio especial.`);
  const link=waDigits?`https://wa.me/${waDigits}?text=${msg}`:null;
  return `<div class="panel" id="soporte">
    <div style="font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:12px">Tu membresía no incluye soporte técnico, pero tienes tarifa preferencial (no es atención inmediata). Antes de solicitarlo, estos son los precios con tu descuento de socio:</div>

      <div class="stat"><div class="k">30 minutos</div><div class="v">${precio30}</div></div>
      <div class="stat"><div class="k">Una hora</div><div class="v">${precioH}</div></div>
    </div>
    ${link
      ? `<a class="cta" href="${link}" target="_blank" rel="noopener" style="background:var(--esp-color,var(--teal))">Solicitar soporte por WhatsApp →</a>`
      : `<div style="font-size:12px;color:var(--text3)">Contacta directamente a tu asesor de Innovaci para solicitar este beneficio.</div>`}
  </div>`;
}

function diasRestantes(fv){
  if(!fv) return null;
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const v=new Date(fv+'T00:00:00');
  return Math.round((v-hoy)/86400000);
}

// Verificación anti-bot simple (sin dependencias externas): una suma
// aleatoria que un script automático no resuelve de un vistazo. No es una
// protección fuerte tipo Cloudflare Turnstile — eso requeriría que Jp cree
// una cuenta/llave en Cloudflare y mover esta consulta a un endpoint propio
// que la valide del lado del servidor (queda anotado como mejora de Fase 1
// en claude/circulo-innovaci-fase0-build-171026.md). Esto es un filtro
// barato que sí detiene bots genéricos y además, junto con el bloqueo
// temporal tras varios intentos fallidos, hace más lento un ataque de fuerza
// bruta sobre el código de acceso.
let captchaA=0, captchaB=0, intentosFallidos=0;
function nuevoCaptcha(){
  captchaA=Math.floor(Math.random()*8)+1;
  captchaB=Math.floor(Math.random()*8)+1;
  document.getElementById('captchaLabel').textContent=`¿Cuánto es ${captchaA} + ${captchaB}?`;
  document.getElementById('fCaptcha').value='';
}
nuevoCaptcha();

async function entrar(){
  const email=document.getElementById('fEmail').value.trim().toLowerCase();
  const codigo=document.getElementById('fCodigo').value.trim().toUpperCase();
  const captcha=document.getElementById('fCaptcha').value.trim();
  const err=document.getElementById('resultadoError');
  err.innerHTML='';
  if(!email || !codigo){ err.innerHTML='<div class="bad">Captura tu correo y tu código de acceso.</div>'; return; }
  if(Number(captcha)!==captchaA+captchaB){ err.innerHTML='<div class="bad">La verificación no es correcta.</div>'; nuevoCaptcha(); return; }

  const btn=document.getElementById('btnEntrar');
  btn.disabled=true; btn.textContent='Buscando…';
  const {data,error}=await sb.from('circulo_portal_publico')
    .select('*')
    .eq('email_norm',email)
    .eq('codigo_acceso',codigo)
    .maybeSingle();
  btn.disabled=false; btn.textContent='Ingresar';
  nuevoCaptcha();

  if(error){ err.innerHTML=`<div class="bad">Ocurrió un error. Intenta de nuevo.</div>`; return; }
  if(!data){
    intentosFallidos++;
    err.innerHTML='<div class="bad">No encontramos una membresía con ese correo y código. Verifica los datos o contacta a Innovaci.</div>';
    if(intentosFallidos>=5){
      let espera=20;
      btn.disabled=true;
      const t=setInterval(()=>{
        espera--; btn.textContent=`Espera ${espera}s…`;
        if(espera<=0){ clearInterval(t); btn.disabled=false; btn.textContent='Ingresar'; intentosFallidos=0; }
      },1000);
    }
    return;
  }

  mostrarResultado(data);
}

// Accesos rápidos → "Cursos incluidos": abre el acordeón colapsado y hace
// scroll hacia él (191026, segunda ronda).
function abrirCursos(e){
  const d=document.getElementById('cursos-incluidos');
  if(d){ d.open=true; setTimeout(()=>d.scrollIntoView({behavior:'smooth',block:'start'}),30); }
}

let bienvenidaMostrada=false;
function mostrarBienvenida(m){
  const primerNombre=(m.nombre||'').trim().split(' ')[0]||m.nombre;
  document.getElementById('welcomeWrap').innerHTML=`
    <div class="welcome-screen">
      <img src="circulo-insignia.png" alt="">
      <div class="welcome-title">Bienvenido, ${primerNombre}</div>
      <div class="welcome-sub">${ESPECIALIDAD_LABEL[m.especialidad]||m.especialidad} — ${m.plan==='socio_pro'?'Socio Pro':'Socio'}</div>
    </div>`;
  setTimeout(()=>{ const w=document.getElementById('welcomeWrap'); if(w) w.innerHTML=''; },2500);
}

async function mostrarResultado(m){
  membresiaActual=m;
  document.getElementById('loginScreen').style.display='none';
  if(!bienvenidaMostrada){ bienvenidaMostrada=true; mostrarBienvenida(m); }

  // — se carga aquí, antes de armar el HTML, para que ya esté listo al
  // momento de pintar la sección.

  const beneficios=(m.beneficios_usados||[]);
  const cursos=CURSOS_CATALOGO[m.especialidad]||[];
  const renderCurso=(c,cls)=>`<div class="list-item curso-item"><span class="cpill ${cls}">${c.tipo}</span><span>${formatCursoTitulo(c.titulo)}</span></div>`;
  const grupos={'247':[],'vivo':[],'mc':[]};
  cursos.forEach(c=>grupos[grupoCurso(c)].push(c));
  let huboGrupoPrevio=false;
  const renderGrupo=(list,cls,label)=>{
    if(!list.length) return '';
    const mt=huboGrupoPrevio?'16px':'0';
    huboGrupoPrevio=true;
    return `<div class="curso-group-label" style="margin-top:${mt}">${label}</div>${list.map(c=>renderCurso(c,cls)).join('')}`;
  };
  const cursosHtml = cursos.length ? `
    ${renderGrupo(grupos['247'],'p247','Diplomados, cursos y talleres · Modalidad 24/7 (dan acceso a Laboratorio Virtual)')}
    ${renderGrupo(grupos['mc'],'pmc','Masterclasses (no dan acceso a Laboratorio Virtual)')}
    ${renderGrupo(grupos['vivo'],'pvivo','Próximamente en vivo (dan acceso a Laboratorio Virtual)')}
  ` : `<div style="font-size:12.5px;color:var(--text3)">El catálogo de esta especialidad se publicará pronto. Mientras tanto, entra a la Academia para ver lo disponible.</div>`;
  const esPro=m.plan==='socio_pro';
  const esp=ESPECIALIDAD_COLOR[m.especialidad]||ESPECIALIDAD_COLOR.NOI;
  const styleVars=`--esp-color:${esp.c};--esp-bg:${esp.bg};`;

  const dias=diasRestantes(m.fecha_vencimiento);
  let diasV='—', diasClase='';
  if(dias!==null){
    diasClase = dias<0 ? 'red' : (dias<=30 ? 'warn' : '');
    diasV = dias<0 ? `Venció hace ${Math.abs(dias)}d` : `${dias} días`;
  }

  const html=`
  <div class="wrap expanded" style="${styleVars}">
    <div class="result-grid">
      <div class="result-banner">
        <div class="brandrow"><img src="circulo-insignia.png" alt=""><div><div class="brandrow-title">Círculo Innovaci</div><div class="brandrow-tag">Exclusivo miembros</div></div></div>
        <div class="toprow">
          <div>
            <div class="result-name">Hola, ${m.nombre}</div>
            ${m.numero_miembro ? `<div class="result-numero">MIEMBRO ${m.numero_miembro}</div>` : ''}
            <div class="result-sub">${m.plan==='socio_pro'?'Socio Pro':'Socio'}${m.costo_cero?' (vinculada, sin costo adicional)':''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
            <div style="text-align:right">
              <div style="font-size:11px;font-weight:500;color:rgba(255,255,255,.75);letter-spacing:.02em">Especialidad</div>
              <div style="font-size:28px;font-weight:800;color:${esp.c};letter-spacing:.02em;line-height:1.15">${m.especialidad}</div>
            </div>
            <span class="badge ${m.estado}">${ESTADO_LABEL[m.estado]||m.estado}</span>
          </div>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="k">Activación</div><div class="v">${fmtFecha(m.fecha_activacion)}</div></div>
          <div class="kpi"><div class="k">Vigencia hasta</div><div class="v">${fmtFecha(m.fecha_vencimiento)}</div></div>
          <div class="kpi"><div class="k">Vigencia</div><div class="v ${diasClase}">${diasV}</div></div>
        </div>
      </div>

      ${avisos ? `<div>${avisos}</div>` : ''}

      ${esPro ? `<div id="beneficios">
        <div class="section-title">Mis beneficios</div>
        ${statsBeneficios(beneficios,esp)}
      </div>` : ''}

      <div class="panel">
        <div class="section-title">Accesos rápidos</div>
        <div class="quicklinks">
          ${esPro ? `<a class="qlink" href="#laboratorio"><span class="qlink-icon">🧪</span>Solicitar laboratorio</a>
          <a class="qlink" href="#sesion-academica"><span class="qlink-icon">🎓</span>Solicitar sesión académica</a>` : ''}
          <a class="qlink" href="#constancias"><span class="qlink-icon">📄</span>Ver constancias</a>
          <a class="qlink" href="#cursos-incluidos" onclick="abrirCursos(event)"><span class="qlink-icon">📚</span>Cursos incluidos</a>
          <a class="qlink" href="#soporte"><span class="qlink-icon">🎧</span>Solicitar soporte</a>
        </div>
      </div>

      ${(esPro && m.especialidad==='NOI') ? `<div>
        <div class="section-title">NOI al Día</div>
        <div class="panel">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
            <div style="font-size:13px;color:var(--text2);line-height:1.65;flex:1;min-width:200px">
              Sesión mensual para revisar temas relevantes sobre <span style="color:${esp.c};font-weight:800">NOI</span>. En esta sesión vas a resolver preguntas relacionadas con el sistema para continuar tu aprendizaje.
              <br><br>La sesión se compone de 30 minutos de exposición de un tema que los Socios <span style="color:${esp.c};font-weight:800">NOI</span> Pro eligen, y 30 minutos para resolver dudas relacionadas al tema.
              <br><br>Asegúrate de estar en el grupo de Socios <span style="color:${esp.c};font-weight:800">NOI</span> Pro donde se vota el tema a tratar.
            </div>
            <span class="chip" style="background:var(--navy);border-color:var(--navy);color:#fff;white-space:nowrap">Exclusivo Socios Pro</span>
          </div>
          <div style="margin-top:14px;background:#f8f9fa;border:1px solid var(--border);border-radius:14px;padding:14px 16px">
            <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Próxima sesión</div>
            <div style="font-size:15px;font-weight:800;color:var(--navy)">Martes 24 de noviembre · 5:00 PM</div>
            <div style="font-size:12.5px;color:var(--text3);margin-top:2px;font-style:italic">Tema por confirmar</div>
          </div>
        </div>
      </div>` : ''}

      ${esPro ? `<div id="laboratorio">${bloqueLaboratorio(beneficios)}</div>` : ''}
      ${esPro ? `<div id="sesion-academica">${bloqueSesion(beneficios)}</div>` : ''}
      ${esPro ? `<div id="acompanante">${bloqueAcompanante(beneficios)}</div>` : ''}
      ${esPro ? `<div id="credito">${bloqueCredito(beneficios)}</div>` : ''}

      <div>
        <div class="section-title">Cursos que incluye tu membresía</div>
        <details class="panel acc" id="cursos-incluidos">
          <summary><span>Ver catálogo de ${ESPECIALIDAD_LABEL[m.especialidad]||m.especialidad} (${cursos.length} disponible${cursos.length===1?'':'s'})</span><span class="chev">›</span></summary>
          <div class="acc-body">
            ${cursosHtml}
            <a class="cta" href="https://odoo.com" target="_blank" rel="noopener" style="margin-top:14px">Entrar a Academia / Odoo →</a>
          </div>
        </details>
      </div>

      <div>
        <div class="section-title">Soporte y ayuda</div>
        ${bloqueSoporte(m,esPro)}
      </div>

      <div>
        <div class="section-title">Tus constancias</div>
        <div class="panel" id="constancias">
          ${constancias.length
            ? constancias.map(c=>`<div class="list-item">${c.tipo}<small>Folio ${c.folio} · emitida ${fmtFecha(c.fecha_emision)}</small></div>`).join('')

        </div>
      </div>
      ${beneficios.length ? `<div class="panel">
        <div class="section-title">Historial de beneficios</div>
        ${beneficios.map(b=>{
          let extra='';
          if(b.tipo==='sesion_academica'){
            if(b.estado==='propuesta' && b.fecha_programada) extra=` · Propuesta: ${fmtFechaHora(b.fecha_programada)}`;
            else if(b.estado==='programada' && b.fecha_programada) extra=` · Confirmada: ${fmtFechaHora(b.fecha_programada)}${b.enlace_zoom?' · Zoom disponible arriba':''}`;
            else if(b.estado==='realizada' && b.fecha_programada) extra=` · ${fmtFechaHora(b.fecha_programada)}${b.enlace_zoom?' · Zoom disponible arriba':''}`;

            extra=` · ${b.producto_comprado}`;
          }
          const comentarios = b.tipo==='sesion_academica' && (b.estado==='concluida'||b.estado==='no_asistio') && b.nota

          return `<div class="list-item">${(BENEFICIO_INFO[b.tipo]||{}).titulo||b.tipo}${b.detalle?` — ${b.detalle}`:''} ${pill(b.estado||'confirmado')}<small>${fmtFecha(b.fecha)}${extra}</small>${motivoRechazo(b)}${comentarios}</div>`;

  document.getElementById('resultadoWrap').innerHTML=html;
  actualizarModalidadLab();
}
