<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0D2240;
  --teal:#00A99D;
  --border:rgba(13,34,64,0.12);
  --text2:#4A6080;
  --text3:#8BA0B8;
  --bg:#f5f6f8;
  --accent:#00A99D; /* se sobreescribe por sistema al pintar el resultado */
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--navy);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;}
.wrap{width:100%;max-width:480px;}
.wrap.expanded{max-width:720px;}

/* ── Tarjeta de búsqueda ────────────────────────────────────────────── */
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;}
.logo{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:2px;}
.tagline{font-size:12px;color:var(--teal);margin-bottom:24px;font-weight:600;}
h1{font-size:17px;font-weight:600;margin-bottom:6px;}
.sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;}
.field input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:'Inter',sans-serif;outline:none;}
.field input:focus{border-color:var(--teal);}
.btn{width:100%;padding:12px;background:var(--teal);border:none;border-radius:9px;color:#fff;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:6px;}
.btn:disabled{opacity:.6;cursor:default;}
.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--border);}
.bad{color:#c0392b;font-weight:600;font-size:13px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.foot{font-size:11px;color:var(--text3);margin-top:22px;text-align:center;}

/* ── Resultado expandido (estilo "premium", inspirado en la constancia) ── */
.result-card{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 8px 32px rgba(13,34,64,0.08);}
.result-head{padding:36px 40px 28px;text-align:center;position:relative;}
.result-head::after{content:'';position:absolute;left:40px;right:40px;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent);}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,169,157,0.1);color:var(--accent);font-size:12px;font-weight:700;padding:6px 14px;border-radius:99px;margin-bottom:18px;}
.badge.revocada{background:rgba(192,57,43,0.1);color:#c0392b;}
.result-brand{font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px;}
.result-name{font-size:26px;font-weight:800;color:var(--navy);line-height:1.25;margin-bottom:8px;}
.result-verb{font-size:13px;color:var(--text2);margin-bottom:6px;}
.result-course{font-size:19px;font-weight:700;color:var(--accent);line-height:1.35;}

.result-body{padding:30px 40px 36px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 24px;margin-bottom:28px;}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr);}}
.stat{border-left:3px solid var(--accent);padding-left:12px;}
.stat .k{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.stat .v{font-size:14px;font-weight:600;color:var(--navy);line-height:1.3;}

.section{margin-bottom:26px;}
.section-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;}
.desc{font-size:13px;color:var(--text2);line-height:1.6;}
.comp-list{list-style:none;display:grid;gap:8px;}
.comp-list li{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--navy);line-height:1.5;}
.comp-list li::before{content:'✓';color:var(--accent);font-weight:700;flex-shrink:0;}

.signers{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.signer{background:var(--bg);border-radius:12px;padding:14px 16px;}
.signer .n{font-size:13px;font-weight:700;color:var(--navy);}
.signer .c{font-size:11px;color:var(--text2);margin-top:2px;}
.signer .cred{font-size:10px;color:var(--text3);margin-top:4px;font-family:'JetBrains Mono',monospace;}

.folio-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:22px;margin-top:6px;border-top:1px solid var(--border);}
.folio-code{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--navy);background:var(--bg);padding:6px 12px;border-radius:8px;}
.emit-date{font-size:12px;color:var(--text3);}

.result-foot{background:var(--navy);color:rgba(255,255,255,0.85);padding:16px 40px;text-align:center;font-size:11px;letter-spacing:.02em;}
.retry{text-align:center;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <div class="card" id="searchCard">
    <div class="logo">Grupo Innovaci</div>
    <div class="tagline">Capacitación que impulsa tu crecimiento</div>
    <h1>Verificar autenticidad de constancia</h1>
    <div class="sub">Ingresa el folio de la constancia (impreso en el documento o incluido en el código QR) y el apellido del titular para confirmar su autenticidad.</div>

    <div class="field">
      <label>Folio</label>
      <input id="fFolio" placeholder="Ej. NOI11-GMAY26-P-001-7XQK2" autocomplete="off">
    </div>
    <div class="field">
      <label>Apellido del titular</label>
      <input id="fApellido" placeholder="Ej. López" autocomplete="off">
    </div>
    <button class="btn" id="btnVerificar" onclick="verificar()">Verificar</button>

    <div id="resultadoError"></div>
    <div class="foot">Grupo Innovaci · os.innovaci.com.mx</div>
  </div>

  <div id="resultadoWrap"></div>

</div>

<script>
// Mismas credenciales públicas (anon key) que usa la app principal — la
// seguridad de este acceso vive en las políticas RLS del proyecto de
// Supabase, no en ocultar esta llave (es normal y esperado que sea pública).
const SURL='https://ydwouspzneacxfixlmmv.supabase.co';
const SKEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlkd291c3B6bmVhY3hmaXhsbW12Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzA5MzAsImV4cCI6MjA5NjkwNjkzMH0.uWB1VN2YT7ynTbHmfTWCOBHMRR54LdHJook7iOk7Mug'; // misma anon key pública que index.html
const sb=supabase.createClient(SURL,SKEY);

const ACENTOS={NOI:'#fc8104',COI:'#29a2dd',SAE:'#c80000'};
function accentDe(sistema){return ACENTOS[sistema]||'#00A99D';}

function normalizar(s){
  return (s||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function fechaLarga(d){
  if(!d) return null;
  const [y,m,day]=d.split('-');
  const meses=['','enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${parseInt(day)} de ${meses[parseInt(m)]} de ${y}`;
}
function periodoTexto(ini,fin){
  if(!ini) return '—';
  if(!fin) return `Desde ${fechaLarga(ini)}`;
  return `${fechaLarga(ini)} — ${fechaLarga(fin)}`;
}
const MODALIDAD_LABEL={en_vivo:'En vivo',['24_7']:'24/7 (a tu ritmo)',in_company:'In company'};
const TIPO_LABEL={participacion:'Participación',aprobacion:'Aprobación',acreditacion:'Acreditación'};
const ACCESO_LABEL={esencial:'Esencial',plus:'Plus',premium:'Premium'};

// Autocompletar folio si llega por query param (?folio=...) desde el QR
const params=new URLSearchParams(window.location.search);
if(params.get('folio')){
  document.getElementById('fFolio').value=params.get('folio');
}

let verificando=false;
async function verificar(){
  if(verificando) return;
  const folio=document.getElementById('fFolio').value.trim();
  const apellido=document.getElementById('fApellido').value.trim();
  const btn=document.getElementById('btnVerificar');
  const errDiv=document.getElementById('resultadoError');
  if(!folio||!apellido){
    errDiv.innerHTML='<div class="bad">Ingresa el folio y el apellido para continuar.</div>';
    return;
  }
  verificando=true; btn.disabled=true; btn.textContent='Verificando...';
  errDiv.innerHTML='';

  try{
    // El apellido se filtra DENTRO de la consulta (server-side) — si no
    // coincide, Postgres simplemente no regresa ninguna fila. Nunca se le
    // pide al servidor el registro completo para comparar el apellido en
    // el navegador, porque eso expondría los datos aunque el apellido
    // fuera incorrecto.
    const {data,error}=await sb.from('academia_constancias_publicas')
      .select('folio,tipo,fecha_emision,calificacion,estatus,participante_nombre,curso_nombre,curso_descripcion,curso_competencias,curso_duracion_horas,sistema,sistema_nombre,generacion,generacion_fecha_inicio,generacion_fecha_fin,modalidad,nivel_acceso,instructor_nombre,instructor_cargo,instructor_credenciales,director_nombre,director_cargo')
      .eq('folio',folio)
      .eq('apellido_normalizado',normalizar(apellido))
      .maybeSingle();

    // Mensaje deliberadamente genérico si no hay coincidencia — no revela
    // si el folio existe o no, ni si fue el apellido el que falló.
    if(error||!data){
      errDiv.innerHTML='<div class="bad">No se encontró una constancia con esos datos. Verifica el folio y el apellido e intenta de nuevo.</div>';
      return;
    }
    pintarResultado(data);
  }catch(e){
    errDiv.innerHTML='<div class="bad">Ocurrió un error al verificar. Intenta de nuevo en unos segundos.</div>';
  }finally{
    verificando=false; btn.disabled=false; btn.textContent='Verificar';
  }
}

function pintarResultado(data){
  const accent=accentDe(data.sistema);
  document.documentElement.style.setProperty('--accent',accent);
  document.getElementById('wrap').classList.add('expanded');
  document.getElementById('searchCard').style.display='none';

  const vigente=data.estatus==='vigente';
  const competencias=(data.curso_competencias||[]);
  const verbo=data.tipo==='acreditacion'?'ha acreditado':data.tipo==='aprobacion'?'ha aprobado':'ha participado en';

  const statBlock=(k,v)=>v?`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`:'';

  const html=`
  <div class="result-card">
    <div class="result-head">
      <div class="badge ${vigente?'':'revocada'}">${vigente?'✔ Constancia válida y vigente':'⚠ Constancia revocada'}</div>
      <div class="result-brand">Grupo Innovaci · ${data.sistema_nombre||data.sistema}</div>
      <div class="result-name">${data.participante_nombre}</div>
      <div class="result-verb">${verbo}</div>
      <div class="result-course">${data.curso_nombre}</div>
    </div>
    <div class="result-body">
      <div class="grid">
        ${statBlock('Modalidad',MODALIDAD_LABEL[data.modalidad]||data.modalidad)}
        ${statBlock('Duración',data.curso_duracion_horas?`${data.curso_duracion_horas} hrs`:null)}
        ${statBlock('Tipo de constancia',TIPO_LABEL[data.tipo]||data.tipo)}
        ${statBlock('Calificación',data.calificacion!=null?`${data.calificacion}/100`:null)}
        ${statBlock('Sistema / Generación',`${data.sistema} · ${data.generacion}`)}
        ${statBlock('Nivel de acceso',ACCESO_LABEL[data.nivel_acceso]||data.nivel_acceso)}
        ${statBlock('Periodo',periodoTexto(data.generacion_fecha_inicio,data.generacion_fecha_fin))}
        ${statBlock('Fecha de emisión',fechaLarga(data.fecha_emision))}
      </div>

      ${data.curso_descripcion?`<div class="section"><div class="section-title">Sobre el curso</div><div class="desc">${data.curso_descripcion}</div></div>`:''}

      ${competencias.length?`<div class="section"><div class="section-title">Competencias desarrolladas</div><ul class="comp-list">${competencias.map(c=>`<li>${c}</li>`).join('')}</ul></div>`:''}

      ${(data.instructor_nombre||data.director_nombre)?`<div class="section"><div class="section-title">Firmantes</div><div class="signers">
        ${data.instructor_nombre?`<div class="signer"><div class="n">${data.instructor_nombre}</div><div class="c">${data.instructor_cargo||''}</div>${data.instructor_credenciales?`<div class="cred">${data.instructor_credenciales}</div>`:''}</div>`:''}
        ${data.director_nombre?`<div class="signer"><div class="n">${data.director_nombre}</div><div class="c">${data.director_cargo||''}</div></div>`:''}
      </div></div>`:''}

      <div class="folio-row">
        <div class="folio-code">${data.folio}</div>
        <div class="emit-date">Emitida el ${fechaLarga(data.fecha_emision)}</div>
      </div>
    </div>
    <div class="result-foot">Capacitación práctica, soluciones reales · os.innovaci.com.mx</div>
  </div>
  <div class="retry"><button class="btn secondary" style="width:auto;padding:10px 20px;" onclick="reiniciar()">Verificar otro folio</button></div>
  `;
  document.getElementById('resultadoWrap').innerHTML=html;
}

function reiniciar(){
  document.getElementById('wrap').classList.remove('expanded');
  document.getElementById('resultadoWrap').innerHTML='';
  document.getElementById('searchCard').style.display='block';
  document.getElementById('fFolio').value='';
  document.getElementById('fApellido').value='';
  document.getElementById('resultadoError').innerHTML='';
  document.getElementById('fFolio').focus();
}

document.getElementById('fApellido').addEventListener('keydown',e=>{if(e.key==='Enter')verificar();});
</script>
</body>
</html>
